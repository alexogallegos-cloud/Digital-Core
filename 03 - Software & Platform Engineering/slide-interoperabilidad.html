<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interoperabilidad — Slide</title>
<style>
  :root{--a:#1C0032;--s:#A100FF;--teal:#00D9C0;--amber:#FFB020;--blue:#4D8BFF;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0d0018;display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",Roboto,Arial,sans-serif}
  .slide{width:1280px;height:720px;background:radial-gradient(120% 120% at 15% 0%,#2a0850 0%,#1a0433 45%,#12002a 100%);position:relative;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6);border-radius:6px}
  /* transform-scale to fit smaller viewports */
  @media(max-width:1320px){.slide{transform:scale(calc(100vw / 1320));transform-origin:center}}
  svg{position:absolute;inset:0}
  .glow{filter:drop-shadow(0 0 6px rgba(161,0,255,.55))}
</style>
</head>
<body>
<div class="slide">
<svg viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A100FF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#6416b0" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="legacy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241040"/><stop offset="1" stop-color="#160a2e"/>
    </linearGradient>
    <linearGradient id="chan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1250"/><stop offset="1" stop-color="#1c0940"/>
    </linearGradient>
    <linearGradient id="kernel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a0d68"/><stop offset="1" stop-color="#57139c"/>
    </linearGradient>
    <radialGradient id="evtNode" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#7dfff0"/><stop offset="1" stop-color="#00b3a0"/>
    </radialGradient>
    <marker id="arrS" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#c98bff"/>
    </marker>
    <marker id="arrE" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#00D9C0"/>
    </marker>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- top accent bar -->
  <rect x="0" y="0" width="1280" height="6" fill="#A100FF"/>

  <!-- HEADER -->
  <text x="60" y="62" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-.5">Framework de Interoperabilidad Empresarial</text>
  <text x="61" y="90" fill="#c9a8ff" font-size="15" letter-spacing="3" font-weight="600">LA CAPA QUE HACE QUE EL LEGADO Y LO NUEVO SE HABLEN — SIN BIG BANG</text>
  <text x="1220" y="52" text-anchor="end" fill="#ffffff" font-size="19" font-weight="800">accenture <tspan fill="#A100FF">/</tspan></text>
  <text x="1220" y="76" text-anchor="end" fill="#b79ae0" font-size="12" letter-spacing="1">Digital Core · S&amp;PE</text>

  <!-- ================= LEGACY (left) ================= -->
  <text x="60" y="150" fill="#8a72c0" font-size="13" font-weight="700" letter-spacing="2">SISTEMAS LEGADO</text>
  <!-- mainframe -->
  <g>
    <rect x="60" y="168" width="150" height="86" rx="10" fill="url(#legacy)" stroke="#4a2a80" stroke-width="1.5"/>
    <rect x="76" y="186" width="24" height="50" rx="3" fill="none" stroke="#7a5cc0" stroke-width="2"/>
    <line x1="82" y1="196" x2="94" y2="196" stroke="#7a5cc0" stroke-width="2"/>
    <line x1="82" y1="204" x2="94" y2="204" stroke="#7a5cc0" stroke-width="2"/>
    <line x1="82" y1="212" x2="94" y2="212" stroke="#7a5cc0" stroke-width="2"/>
    <text x="112" y="205" fill="#e6dcff" font-size="15" font-weight="700">Mainframe</text>
    <text x="112" y="225" fill="#9d86cf" font-size="12">IBM z/OS · COBOL</text>
  </g>
  <g>
    <rect x="60" y="266" width="150" height="86" rx="10" fill="url(#legacy)" stroke="#4a2a80" stroke-width="1.5"/>
    <circle cx="88" cy="309" r="16" fill="none" stroke="#7a5cc0" stroke-width="2"/><circle cx="88" cy="309" r="5" fill="#7a5cc0"/>
    <text x="112" y="303" fill="#e6dcff" font-size="15" font-weight="700">Unisys</text>
    <text x="112" y="323" fill="#9d86cf" font-size="12">Core batch</text>
  </g>
  <g>
    <rect x="60" y="364" width="150" height="86" rx="10" fill="url(#legacy)" stroke="#4a2a80" stroke-width="1.5"/>
    <path d="M80,392 h24 M80,400 h24 M80,408 h24 M80,416 h16" stroke="#7a5cc0" stroke-width="2.5" stroke-linecap="round"/>
    <text x="112" y="401" fill="#e6dcff" font-size="15" font-weight="700">Tandem</text>
    <text x="112" y="421" fill="#9d86cf" font-size="12">ISO 8583</text>
  </g>

  <!-- ================= ACL membrane ================= -->
  <path d="M250,168 C300,300 300,320 250,450 C285,450 300,430 300,309 C300,188 285,168 250,168 Z" fill="rgba(255,176,32,.14)" stroke="var(--amber)" stroke-width="2" stroke-dasharray="2 5"/>
  <text x="276" y="300" fill="#FFB020" font-size="12" font-weight="800" transform="rotate(-90 276 300)" text-anchor="middle" letter-spacing="1">ANTI-CORRUPTION LAYER</text>

  <!-- ================= INTEROPERABILITY SPINE (center) ================= -->
  <!-- outer frame -->
  <rect x="330" y="150" width="560" height="470" rx="16" fill="rgba(161,0,255,.06)" stroke="rgba(161,0,255,.45)" stroke-width="1.5"/>
  <text x="350" y="176" fill="#d9bfff" font-size="13" font-weight="800" letter-spacing="2">CAPA DE INTEROPERABILIDAD</text>

  <!-- API GATEWAY lane (sync) -->
  <rect x="350" y="192" width="520" height="78" rx="11" fill="url(#spine)" class="glow"/>
  <text x="372" y="222" fill="#fff" font-size="17" font-weight="800">API Gateway</text>
  <text x="372" y="244" fill="#e3d0ff" font-size="12.5">Síncrono · OAuth2/OIDC · rate limiting · versionado</text>
  <text x="850" y="236" text-anchor="end" fill="#ffffff" font-size="11" font-weight="700" opacity=".8">D1 · KERNEL</text>

  <!-- EVENT MESH lane (async) -->
  <rect x="350" y="286" width="520" height="150" rx="11" fill="rgba(0,217,192,.10)" stroke="rgba(0,217,192,.5)" stroke-width="1.5"/>
  <text x="372" y="312" fill="#5ff2df" font-size="17" font-weight="800">Event Mesh</text>
  <text x="372" y="332" fill="#9fe8dd" font-size="12.5">Asíncrono · publish/subscribe · guaranteed delivery</text>
  <!-- event bus line with nodes -->
  <line x1="372" y1="382" x2="848" y2="382" stroke="#00D9C0" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round" opacity=".8"/>
  <g>
    <circle cx="410" cy="382" r="13" fill="url(#evtNode)"/><text x="410" y="386" text-anchor="middle" font-size="11" font-weight="800" fill="#003a33">e</text>
    <circle cx="500" cy="382" r="13" fill="url(#evtNode)"/><text x="500" y="386" text-anchor="middle" font-size="11" font-weight="800" fill="#003a33">e</text>
    <circle cx="600" cy="382" r="17" fill="url(#evtNode)" filter="url(#soft)"/><text x="600" y="387" text-anchor="middle" font-size="12" font-weight="800" fill="#003a33">CEP</text>
    <circle cx="700" cy="382" r="13" fill="url(#evtNode)"/><text x="700" y="386" text-anchor="middle" font-size="11" font-weight="800" fill="#003a33">e</text>
    <circle cx="800" cy="382" r="13" fill="url(#evtNode)"/><text x="800" y="386" text-anchor="middle" font-size="11" font-weight="800" fill="#003a33">e</text>
  </g>
  <text x="372" y="418" fill="#8fd8ce" font-size="11.5">Event Sourcing · Streaming · Event Registry · Store &amp; Forward</text>

  <!-- SAGA orchestration node -->
  <rect x="350" y="452" width="250" height="72" rx="11" fill="rgba(255,176,32,.12)" stroke="rgba(255,176,32,.55)" stroke-width="1.5"/>
  <text x="372" y="480" fill="#FFC65C" font-size="15.5" font-weight="800">Saga Orchestration</text>
  <text x="372" y="500" fill="#e7c98f" font-size="11.5">Consistencia eventual</text>
  <!-- saga compensation loop glyph -->
  <path d="M540,478 a16,16 0 1 1 -4,-11" fill="none" stroke="#FFB020" stroke-width="2.5"/>
  <path d="M534,462 l4,5 l-6,2 Z" fill="#FFB020"/>

  <!-- CQRS / CDC node -->
  <rect x="620" y="452" width="250" height="72" rx="11" fill="rgba(77,139,255,.12)" stroke="rgba(77,139,255,.55)" stroke-width="1.5"/>
  <text x="642" y="480" fill="#8fb6ff" font-size="15.5" font-weight="800">CQRS · CDC</text>
  <text x="642" y="500" fill="#c2d5ff" font-size="11.5">Entrega de datos multicanal</text>
  <g stroke="#4D8BFF" stroke-width="2.5" fill="none">
    <path d="M812,470 h28"/><path d="M832,463 l8,7 l-8,7"/>
    <path d="M840,486 h-28"/><path d="M820,479 l-8,7 l8,7"/>
  </g>

  <!-- KERNEL base bar -->
  <rect x="350" y="540" width="520" height="66" rx="11" fill="url(#kernel)"/>
  <text x="610" y="562" text-anchor="middle" fill="#fff" font-size="13" font-weight="800" letter-spacing="1">DOMINIO 1 · KERNEL &amp; PLATFORM</text>
  <g fill="#e9dcff" font-size="11.5" font-weight="600" text-anchor="middle">
    <text x="410" y="590">Security</text>
    <text x="500" y="590">Observability</text>
    <text x="610" y="590">Gateway Svcs</text>
    <text x="720" y="590">API Mgmt</text>
    <text x="820" y="590">Infra</text>
  </g>

  <!-- ================= CHANNELS (right) ================= -->
  <text x="960" y="150" fill="#8a72c0" font-size="13" font-weight="700" letter-spacing="2">OMNICHANNEL</text>
  <!-- mobile -->
  <g>
    <rect x="960" y="168" width="150" height="86" rx="10" fill="url(#chan)" stroke="#4a2a80" stroke-width="1.5"/>
    <rect x="978" y="184" width="34" height="54" rx="6" fill="none" stroke="#b98bff" stroke-width="2.5"/><line x1="988" y1="232" x2="1002" y2="232" stroke="#b98bff" stroke-width="2.5"/>
    <text x="1024" y="205" fill="#e6dcff" font-size="15" font-weight="700">Mobile</text>
    <text x="1024" y="225" fill="#9d86cf" font-size="12">App banca</text>
  </g>
  <g>
    <rect x="960" y="266" width="150" height="86" rx="10" fill="url(#chan)" stroke="#4a2a80" stroke-width="1.5"/>
    <rect x="976" y="286" width="40" height="30" rx="3" fill="none" stroke="#b98bff" stroke-width="2.5"/><line x1="990" y1="322" x2="1002" y2="322" stroke="#b98bff" stroke-width="2.5"/>
    <text x="1026" y="303" fill="#e6dcff" font-size="15" font-weight="700">Web</text>
    <text x="1026" y="323" fill="#9d86cf" font-size="12">Portal</text>
  </g>
  <g>
    <rect x="960" y="364" width="150" height="86" rx="10" fill="url(#chan)" stroke="#4a2a80" stroke-width="1.5"/>
    <path d="M978,420 v-24 l14,-10 l14,10 v24 Z" fill="none" stroke="#b98bff" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="1024" y="401" fill="#e6dcff" font-size="15" font-weight="700">Sucursal</text>
    <text x="1024" y="421" fill="#9d86cf" font-size="12">Branch · ATM</text>
  </g>
  <g>
    <rect x="960" y="462" width="150" height="62" rx="10" fill="url(#chan)" stroke="#4a2a80" stroke-width="1.5"/>
    <circle cx="992" cy="493" r="14" fill="none" stroke="#b98bff" stroke-width="2.5"/><path d="M992,485 v8 l6,4" stroke="#b98bff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="1020" y="490" fill="#e6dcff" font-size="14" font-weight="700">Open API</text>
    <text x="1020" y="508" fill="#9d86cf" font-size="11">Terceros CNBV</text>
  </g>

  <!-- ================= FLOWS ================= -->
  <!-- legacy -> ACL -> spine (sync into API + async into mesh) -->
  <path d="M210,211 C260,211 300,231 350,231" fill="none" stroke="#c98bff" stroke-width="2.5" marker-end="url(#arrS)"/>
  <path d="M210,309 C270,340 300,360 350,368" fill="none" stroke="#00D9C0" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrE)"/>
  <path d="M210,407 C270,420 300,400 350,388" fill="none" stroke="#00D9C0" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrE)"/>

  <!-- spine -> channels -->
  <path d="M870,231 C910,231 930,211 960,211" fill="none" stroke="#c98bff" stroke-width="2.5" marker-end="url(#arrS)"/>
  <path d="M870,368 C910,340 930,320 960,309" fill="none" stroke="#00D9C0" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrE)"/>
  <path d="M870,388 C910,410 930,400 960,407" fill="none" stroke="#00D9C0" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrE)"/>
  <path d="M870,488 C910,490 930,491 960,491" fill="none" stroke="#c98bff" stroke-width="2.5" marker-end="url(#arrS)"/>

  <!-- ================= LEGEND ================= -->
  <g transform="translate(60,648)">
    <line x1="0" y1="8" x2="34" y2="8" stroke="#c98bff" stroke-width="3" marker-end="url(#arrS)"/>
    <text x="44" y="12" fill="#d9bfff" font-size="13" font-weight="600">Síncrono (API · request/response)</text>
    <line x1="320" y1="8" x2="354" y2="8" stroke="#00D9C0" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrE)"/>
    <text x="364" y="12" fill="#9fe8dd" font-size="13" font-weight="600">Asíncrono (evento · publish/subscribe)</text>
    <rect x="690" y="1" width="14" height="14" rx="3" fill="rgba(255,176,32,.2)" stroke="#FFB020"/>
    <text x="712" y="12" fill="#e7c98f" font-size="13" font-weight="600">Saga · consistencia eventual</text>
  </g>

  <!-- principle strip bottom right -->
  <text x="1220" y="662" text-anchor="end" fill="#b79ae0" font-size="12.5" font-style="italic">Envuelve el legado, no lo migras · Event-driven por defecto · API como producto</text>
</svg>
</div>
</body>
</html>
