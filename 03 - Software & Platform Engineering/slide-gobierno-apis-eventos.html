<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gobierno de APIs y Eventos — Slide</title>
<style>
  :root{--s:#A100FF;--teal:#00D9C0;--amber:#FFB020;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0d0018;display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",Roboto,Arial,sans-serif}
  .slide{width:1280px;height:720px;background:radial-gradient(120% 120% at 12% -5%,#2a0850 0%,#1a0433 45%,#12002a 100%);position:relative;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6);border-radius:6px}
  @media(max-width:1320px){.slide{transform:scale(calc(100vw / 1320));transform-origin:center}}
</style>
</head>
<body>
<div class="slide">
<svg viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="apiG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a1fd0"/><stop offset="1" stop-color="#A100FF"/></linearGradient>
    <linearGradient id="evtG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#008f7f"/><stop offset="1" stop-color="#00D9C0"/></linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffce6b"/><stop offset="1" stop-color="#FFB020"/></linearGradient>
    <linearGradient id="prod" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a0d68"/><stop offset="1" stop-color="#57139c"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1250"/><stop offset="1" stop-color="#1c0940"/></linearGradient>
    <marker id="aS" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#d9a8ff"/></marker>
    <marker id="aE" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#3fe8d4"/></marker>
    <marker id="aG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8a72c0"/></marker>
    <filter id="gl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect x="0" y="0" width="1280" height="6" fill="#A100FF"/>

  <!-- HEADER -->
  <text x="60" y="58" fill="#ffffff" font-size="33" font-weight="800" letter-spacing="-.5">Modelo de Gobierno de APIs y Eventos</text>
  <text x="61" y="85" fill="#c9a8ff" font-size="14" letter-spacing="3" font-weight="600">DOS CONTRATOS · UNA DISCIPLINA · DEL DISEÑO A PRODUCCIÓN</text>
  <image href="assets/accenture-white.png" x="1052" y="34" width="168" height="44" preserveAspectRatio="xMaxYMid meet"/>
  <text x="1220" y="94" text-anchor="end" fill="#b79ae0" font-size="12" letter-spacing="1">Digital Core · S&amp;PE</text>

  <!-- ============ GOVERNANCE BODIES (top) ============ -->
  <g>
    <rect x="60" y="108" width="360" height="66" rx="11" fill="url(#body)" stroke="#5a2fa0" stroke-width="1.5"/>
    <circle cx="96" cy="141" r="17" fill="none" stroke="#c98bff" stroke-width="2.5"/><path d="M96,131 v20 M86,141 h20" stroke="#c98bff" stroke-width="2.5"/>
    <text x="126" y="136" fill="#fff" font-size="16" font-weight="800">API &amp; Event Council</text>
    <text x="126" y="157" fill="#b79ae0" font-size="12">Estándares · excepciones · dueño del catálogo</text>
  </g>
  <g>
    <rect x="440" y="108" width="330" height="66" rx="11" fill="url(#body)" stroke="#5a2fa0" stroke-width="1.5"/>
    <circle cx="474" cy="135" r="7" fill="#c98bff"/><circle cx="464" cy="150" r="7" fill="#8a72c0"/><circle cx="486" cy="150" r="7" fill="#8a72c0"/>
    <text x="502" y="136" fill="#fff" font-size="16" font-weight="800">Integration Guild</text>
    <text x="502" y="157" fill="#b79ae0" font-size="12">Patrones vivos · revisión entre pares</text>
  </g>
  <g>
    <rect x="790" y="108" width="430" height="66" rx="11" fill="url(#body)" stroke="#5a2fa0" stroke-width="1.5"/>
    <rect x="818" y="126" width="16" height="30" rx="2" fill="none" stroke="#c98bff" stroke-width="2"/><rect x="840" y="126" width="16" height="30" rx="2" fill="none" stroke="#8a72c0" stroke-width="2"/>
    <text x="874" y="136" fill="#fff" font-size="16" font-weight="800">Equipos de producto</text>
    <text x="874" y="157" fill="#b79ae0" font-size="12">Dueños del contrato de extremo a extremo · autonomía federada</text>
  </g>
  <!-- authority arrows down -->
  <path d="M240,174 L240,205" stroke="#8a72c0" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#aG)"/>
  <path d="M605,174 L605,205" stroke="#8a72c0" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#aG)"/>
  <path d="M960,174 L960,205" stroke="#8a72c0" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#aG)"/>
  <text x="640" y="196" fill="#8a72c0" font-size="10.5" font-style="italic">gobierna</text>

  <!-- ============ GATES (vertical checkpoints) ============ -->
  <!-- gate x centers: 285, 505, 725, 945 -->
  <g font-family="inherit">
    <!-- gate bars -->
    <rect x="277" y="228" width="16" height="228" rx="8" fill="url(#gate)" opacity=".9"/>
    <rect x="497" y="228" width="16" height="228" rx="8" fill="url(#gate)" opacity=".9"/>
    <rect x="717" y="228" width="16" height="228" rx="8" fill="url(#gate)" opacity=".9"/>
    <rect x="937" y="228" width="16" height="228" rx="8" fill="url(#gate)" opacity=".9"/>
    <!-- gate badges -->
    <g>
      <path d="M285,196 l20,10 v14 c0,12 -12,18 -20,22 c-8,-4 -20,-10 -20,-22 v-14 Z" fill="#1a0433" stroke="#FFB020" stroke-width="2"/>
      <text x="285" y="216" text-anchor="middle" fill="#FFB020" font-size="13" font-weight="800">G1</text>
    </g>
    <g>
      <path d="M505,196 l20,10 v14 c0,12 -12,18 -20,22 c-8,-4 -20,-10 -20,-22 v-14 Z" fill="#1a0433" stroke="#FFB020" stroke-width="2"/>
      <text x="505" y="216" text-anchor="middle" fill="#FFB020" font-size="13" font-weight="800">G2</text>
    </g>
    <g>
      <path d="M725,196 l20,10 v14 c0,12 -12,18 -20,22 c-8,-4 -20,-10 -20,-22 v-14 Z" fill="#1a0433" stroke="#FFB020" stroke-width="2"/>
      <text x="725" y="216" text-anchor="middle" fill="#FFB020" font-size="13" font-weight="800">G3</text>
    </g>
    <g>
      <path d="M945,196 l20,10 v14 c0,12 -12,18 -20,22 c-8,-4 -20,-10 -20,-22 v-14 Z" fill="#1a0433" stroke="#FFB020" stroke-width="2"/>
      <text x="945" y="216" text-anchor="middle" fill="#FFB020" font-size="13" font-weight="800">G4</text>
    </g>
    <!-- gate captions -->
    <g fill="#e7c98f" font-size="11" font-weight="700" text-anchor="middle">
      <text x="285" y="474">Diseño</text>
      <text x="505" y="474">Seguridad</text>
      <text x="725" y="474">Publicación</text>
      <text x="945" y="474">Operación</text>
    </g>
  </g>

  <!-- ============ API LANE (sync) ============ -->
  <rect x="60" y="240" width="1010" height="86" rx="12" fill="rgba(161,0,255,.08)" stroke="rgba(161,0,255,.4)" stroke-width="1.3"/>
  <rect x="60" y="240" width="200" height="86" rx="12" fill="url(#apiG)"/>
  <text x="76" y="270" fill="#fff" font-size="16" font-weight="800">Gobierno de APIs</text>
  <text x="76" y="290" fill="#e3d0ff" font-size="11.5">Contrato síncrono</text>
  <text x="76" y="308" fill="#e3d0ff" font-size="11.5">request / response</text>
  <!-- api flow line -->
  <line x1="270" y1="283" x2="1055" y2="283" stroke="#c98bff" stroke-width="2" marker-end="url(#aS)" opacity=".55"/>
  <!-- api phase nodes -->
  <g font-size="12" font-weight="700" fill="#fff" text-anchor="middle">
    <g><circle cx="385" cy="283" r="6" fill="#A100FF" filter="url(#gl)"/><text x="385" y="258" fill="#e8d6ff">OpenAPI</text><text x="385" y="312" fill="#b79ae0" font-size="10.5" font-weight="500">design-first</text></g>
    <g><circle cx="605" cy="283" r="6" fill="#A100FF" filter="url(#gl)"/><text x="605" y="258" fill="#e8d6ff">OAuth2 / OIDC</text><text x="605" y="312" fill="#b79ae0" font-size="10.5" font-weight="500">mTLS · OWASP</text></g>
    <g><circle cx="825" cy="283" r="6" fill="#A100FF" filter="url(#gl)"/><text x="825" y="258" fill="#e8d6ff">Gateway + Portal</text><text x="825" y="312" fill="#b79ae0" font-size="10.5" font-weight="500">cuotas · SLO</text></g>
    <g><circle cx="1010" cy="283" r="6" fill="#A100FF" filter="url(#gl)"/><text x="1010" y="258" fill="#e8d6ff">Contract test</text><text x="1010" y="312" fill="#b79ae0" font-size="10.5" font-weight="500">versionado</text></g>
  </g>

  <!-- ============ EVENT LANE (async) ============ -->
  <rect x="60" y="360" width="1010" height="86" rx="12" fill="rgba(0,217,192,.08)" stroke="rgba(0,217,192,.4)" stroke-width="1.3"/>
  <rect x="60" y="360" width="200" height="86" rx="12" fill="url(#evtG)"/>
  <text x="76" y="390" fill="#04302b" font-size="16" font-weight="800">Gobierno de Eventos</text>
  <text x="76" y="410" fill="#063f38" font-size="11.5">Contrato asíncrono</text>
  <text x="76" y="428" fill="#063f38" font-size="11.5">publish / subscribe</text>
  <!-- event flow line dashed with nodes -->
  <line x1="270" y1="403" x2="1055" y2="403" stroke="#3fe8d4" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aE)" opacity=".6"/>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <g><circle cx="385" cy="403" r="7" fill="#00D9C0"/><text x="385" y="378" fill="#9fe8dd">AsyncAPI</text><text x="385" y="432" fill="#7fcabf" font-size="10.5" font-weight="500">taxonomía tópicos</text></g>
    <g><circle cx="605" cy="403" r="7" fill="#00D9C0"/><text x="605" y="378" fill="#9fe8dd">Schema Registry</text><text x="605" y="432" fill="#7fcabf" font-size="10.5" font-weight="500">compatibilidad</text></g>
    <g><circle cx="825" cy="403" r="7" fill="#00D9C0"/><text x="825" y="378" fill="#9fe8dd">Entrega garantizada</text><text x="825" y="432" fill="#7fcabf" font-size="10.5" font-weight="500">idempotencia · orden</text></g>
    <g><circle cx="1010" cy="403" r="7" fill="#00D9C0"/><text x="1010" y="378" fill="#9fe8dd">Dead letter</text><text x="1010" y="432" fill="#7fcabf" font-size="10.5" font-weight="500">reproceso</text></g>
  </g>

  <!-- ============ PRODUCTION target ============ -->
  <rect x="1088" y="240" width="132" height="206" rx="12" fill="url(#prod)" stroke="#7a3fd0" stroke-width="1.5"/>
  <path d="M1154,300 l30,18 v34 l-30,18 l-30,-18 v-34 Z" fill="none" stroke="#d9a8ff" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M1154,300 v70 M1124,318 l30,18 l30,-18" fill="none" stroke="#d9a8ff" stroke-width="2"/>
  <text x="1154" y="410" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">Producción</text>
  <text x="1154" y="430" text-anchor="middle" fill="#c9a8ff" font-size="11">observable</text>
  <path d="M1070,283 L1086,283" stroke="#c98bff" stroke-width="2.5" marker-end="url(#aS)"/>
  <path d="M1070,403 L1086,403" stroke="#3fe8d4" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#aE)"/>

  <!-- ============ UNIFIED CATALOG (both lanes register) ============ -->
  <path d="M385,326 C385,342 605,344 605,344" fill="none" stroke="#8a72c0" stroke-width="1.3" stroke-dasharray="2 4"/>
  <rect x="60" y="500" width="1160" height="52" rx="11" fill="rgba(161,0,255,.10)" stroke="rgba(161,0,255,.5)" stroke-width="1.5"/>
  <!-- little cylinder -->
  <g transform="translate(88,514)">
    <ellipse cx="0" cy="0" rx="16" ry="6" fill="#A100FF"/><path d="M-16,0 v22 a16,6 0 0 0 32,0 v-22" fill="#7a1fd0"/><ellipse cx="0" cy="0" rx="16" ry="6" fill="#b366ff"/>
  </g>
  <text x="120" y="522" fill="#fff" font-size="15.5" font-weight="800">Catálogo unificado de contratos</text>
  <text x="120" y="541" fill="#c9a8ff" font-size="12">Fuente única de verdad · toda API y todo evento registrados y descubribles</text>
  <!-- register connectors from both lanes -->
  <path d="M300,326 L300,500" stroke="#c98bff" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#aS)" opacity=".6"/>
  <path d="M700,446 L700,500" stroke="#3fe8d4" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#aE)" opacity=".6"/>
  <text x="1170" y="530" text-anchor="middle" fill="#d9bfff" font-size="11" font-style="italic">100% cobertura</text>

  <!-- ============ METRICS TILES ============ -->
  <g>
    <rect x="60" y="574" width="270" height="76" rx="11" fill="url(#body)" stroke="#5a2fa0" stroke-width="1.3"/>
    <text x="80" y="608" fill="#fff" font-size="26" font-weight="800">DORA</text>
    <text x="80" y="632" fill="#b79ae0" font-size="11.5">Frecuencia y lead time de contratos</text>
  </g>
  <g>
    <rect x="345" y="574" width="270" height="76" rx="11" fill="url(#body)" stroke="#5a2fa0" stroke-width="1.3"/>
    <text x="365" y="608" fill="#fff" font-size="26" font-weight="800">SLO</text>
    <text x="365" y="632" fill="#b79ae0" font-size="11.5">Disponibilidad por API y por tópico</text>
  </g>
  <g>
    <rect x="630" y="574" width="270" height="76" rx="11" fill="url(#body)" stroke="#5a2fa0" stroke-width="1.3"/>
    <text x="650" y="608" fill="#00D9C0" font-size="26" font-weight="800">0</text>
    <text x="650" y="632" fill="#b79ae0" font-size="11.5">Cambios rompedores no gobernados</text>
  </g>
  <g>
    <rect x="915" y="574" width="305" height="76" rx="11" fill="url(#body)" stroke="#5a2fa0" stroke-width="1.3"/>
    <text x="935" y="608" fill="#FFB020" font-size="26" font-weight="800">4</text>
    <text x="935" y="632" fill="#b79ae0" font-size="11.5">Quality gates verificables y automatizados</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(60,678)">
    <line x1="0" y1="6" x2="30" y2="6" stroke="#c98bff" stroke-width="3" marker-end="url(#aS)"/>
    <text x="40" y="10" fill="#d9bfff" font-size="12.5" font-weight="600">API · síncrono</text>
    <line x1="200" y1="6" x2="230" y2="6" stroke="#3fe8d4" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#aE)"/>
    <text x="240" y="10" fill="#9fe8dd" font-size="12.5" font-weight="600">Evento · asíncrono</text>
    <path d="M430,0 l14,7 v10 c0,8 -8,12 -14,15 c-6,-3 -14,-7 -14,-15 v-10 Z" fill="none" stroke="#FFB020" stroke-width="1.8" transform="translate(0,-4) scale(.8)"/>
    <text x="452" y="10" fill="#e7c98f" font-size="12.5" font-weight="600">Quality gate (DoD por fase)</text>
    <line x1="700" y1="6" x2="726" y2="6" stroke="#8a72c0" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#aG)"/>
    <text x="736" y="10" fill="#b79ae0" font-size="12.5" font-weight="600">autoridad de gobierno · registro en catálogo</text>
  </g>
</svg>
</div>
</body>
</html>
