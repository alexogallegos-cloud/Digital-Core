  domain: insurance-policy-admin
  industry: seguros
  currency: MXN
platform: ibm-i
languages:
  - rpg            # RPG IV / ILE (free + un programa fixed con indicadores)
  - cl             # Control Language (orquestación)
  - dds            # Physical + Logical Files
  - embedded-sql   # SQLRPGLE
size:
  programs: 6      # 5 vivos + 1 dead code (OLDPRIM)
  loc_target: 2000
complexity:
  cyclomatic_avg: 10
  cyclomatic_max: 18   # POLVAL
  nesting_depth: 4
fidelity: static
planted_defects:
  dead_code: true               # OLDPRIM — sin CALL/CALLB entrante
  shadow_inventory: true        # BCKPOL — solo en CL, sin fuente
  hardcoded_values: true        # IVA 16%, prima minima, factor riesgo, umbral
  comp3_fields: true            # packed (P) en montos
  two_digit_dates: true         # POL-ANIO 2 digitos en POLMAST
  goto_spaghetti: false
  dynamic_calls: true           # RIESGOEV llama al scoring por variable
  indicator_logic: true         # *IN01-*IN99 controlando flujo (RPGTPN fixed)
  logical_file_business_logic: true  # LF POLACT con SELECT/OMIT = regla implicita
business_rules:
  count: 8                       # RN-101 .. RN-108
  regulatory_refs: true          # CNSF / factor de siniestralidad
output:
  emit_answer_key: true
  seed: 77

# Segundo seed del Specialist: cubre IBM i / RPG (el primero, seed-credito-latam,
