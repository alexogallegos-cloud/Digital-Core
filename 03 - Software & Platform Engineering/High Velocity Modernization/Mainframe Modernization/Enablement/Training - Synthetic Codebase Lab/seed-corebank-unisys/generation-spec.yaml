system:
  name: SISTEMA-CORE-UNISYS
  domain: core-banking
  industry: banca
  currency: MXN
platform: clearpath-mcp
languages:
  - cobol          # COBOL85 sobre MCP
  - algol          # utilerias de sistema
  - wfl            # Work Flow Language (orquestacion batch)
  - dasdl          # DMSII schema
  - copybooks
# --- A esta escala el sistema se modela como GRAFO-COMO-DATO ---
# No se emiten ~800 fuentes a mano: se genera el grafo completo (graph/)
# y se emite source representativo de los hubs y de 1 bounded context.
scale_strategy: graph-as-data
size:
  programs: 800            # objetivo de nodos vivos
  dead_cluster_programs: 30
topology:
  degree_distribution: scale-free      # pocos hubs de fan-in alto, cola larga
  preferential_attachment: 1.4         # exponente del sesgo hacia hubs
  utility_hubs: 14                     # utilerias compartidas (DATECONV, ERRHND, ...)
  layers:                              # capas con fugas
    - WFL        # batch orchestration
    - ONLINE     # COMS / transacciones
    - BL         # business logic
    - DA         # data access (DMSII)
    - UTIL       # utilerias compartidas (los hubs)
  domains:                             # comunidades plantadas (bounded contexts)
    - deposits
    - payments
    - loans
    - cards
    - gl
    - customer
    - reporting
    - channels
  cross_domain_leakage: 0.18           # % de aristas BL->BL que cruzan dominio
  cycles: 6                            # nº de SCCs no triviales a inyectar
  cycle_size_range: [3, 7]             # tamaño de cada ciclo
  dead_clusters: 1                     # islas huerfanas (no alcanzables)
copybook_coupling:
  model_as_separate_layer: true        # el hairball oculto, aparte del call graph
  shared_copybooks: 6                  # CB-CUENTA, CB-CLIENTE, CB-ASIENTO, CB-RETCODE, CB-IMPORTE, CB-ENCABEZADO
  domain_copybooks_per_domain: 3
representative_source:
  hubs: true                           # emitir source de las utilerias hub
  full_bounded_context: deposits       # emitir el dominio deposits completo (muestra)
  samples_per_other_domain: 0
output:
  emit_answer_key: true
  emit_graph_data: true
  seed: 2200