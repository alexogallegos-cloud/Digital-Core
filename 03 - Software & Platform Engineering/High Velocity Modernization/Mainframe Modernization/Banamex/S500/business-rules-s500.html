<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S500 · Reglas de Negocio — Banamex</title>
<style>
:root {
  --bg:#14142b; --bg2:#1A1A2E; --panel:#1f1f3a; --line:#2c2c50;
  --txt:#E8E8F0; --muted:#9a9ab5; --acc:#A100FF;
  --green-bg:#052e16; --green-txt:#86efac; --green-brd:#16a34a;
  --yellow-bg:#431407; --yellow-txt:#fdba74; --yellow-brd:#c2410c;
  --red-bg:#450a0a; --red-txt:#fca5a5; --red-brd:#b91c1c;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5}
code,pre,.mono{font-family:'Cascadia Code','Consolas',monospace}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--acc)}

/* HEADER */
#hdr{
  position:fixed;top:0;left:0;right:0;height:64px;
  background:var(--bg2);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 20px;
  z-index:100;
}
#hdr-title{display:flex;flex-direction:column;gap:2px;min-width:280px}
#hdr-title .t1{font-size:16px;font-weight:700;color:var(--txt);letter-spacing:.02em}
#hdr-title .t2{font-size:10px;color:var(--muted);letter-spacing:.03em}
#hdr-stats{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.stat-pill{
  display:flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;
  border:1px solid;
  -webkit-user-select:none;user-select:none;
}
.stat-all{background:var(--panel);border-color:var(--line);color:var(--muted)}
.stat-conf{background:var(--green-bg);border-color:var(--green-brd);color:var(--green-txt)}
.stat-inf{background:var(--yellow-bg);border-color:var(--yellow-brd);color:var(--yellow-txt)}
.stat-gap{background:var(--red-bg);border-color:var(--red-brd);color:var(--red-txt)}
#hdr-actions{display:flex;gap:8px}
#hdr-actions button{
  padding:5px 12px;border-radius:6px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-size:11px;font-weight:600;
  cursor:pointer;transition:all .15s;
}
#hdr-actions button:hover{border-color:var(--acc);color:var(--acc)}

/* FILTERBAR */
#fbar{
  position:fixed;top:64px;left:0;right:0;height:36px;
  background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:6px;padding:0 16px;
  z-index:99;overflow-x:auto;
}
#fbar::-webkit-scrollbar{height:3px}
.fb-btn{
  padding:2px 10px;border-radius:12px;border:1px solid var(--line);
  background:transparent;color:var(--muted);font-size:11px;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;
  -webkit-user-select:none;user-select:none;
}
.fb-btn:hover{border-color:var(--acc);color:var(--acc)}
.fb-btn.active{background:var(--acc);border-color:var(--acc);color:#fff}
.fb-sep{width:1px;height:20px;background:var(--line);flex-shrink:0;margin:0 4px}
#fb-search{
  flex:1;min-width:140px;max-width:220px;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  color:var(--txt);padding:2px 8px;font-size:11px;outline:none;
}
#fb-search::placeholder{color:var(--muted)}
#fb-search:focus{border-color:var(--acc)}
#fb-count{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0}

/* BODY LAYOUT */
#body{
  display:flex;margin-top:100px;min-height:calc(100vh - 100px);
}

/* SIDEBAR */
#sb{
  width:200px;flex-shrink:0;
  background:var(--bg2);border-right:1px solid var(--line);
  padding:12px 0;overflow-y:auto;
  position:sticky;top:100px;height:calc(100vh - 100px);
}
.sb-section{margin-bottom:12px}
.sb-label{
  font-size:9px;font-weight:700;letter-spacing:.1em;
  color:var(--muted);text-transform:uppercase;
  padding:0 12px;margin-bottom:6px;
}
.sb-item{
  display:flex;align-items:center;gap:8px;
  padding:5px 12px;cursor:pointer;
  border-left:2px solid transparent;
  transition:all .12s;
  -webkit-user-select:none;user-select:none;
}
.sb-item:hover{background:var(--panel)}
.sb-item.active{background:var(--panel);border-left-color:var(--acc)}
.sb-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.sb-item-label{font-size:11px;color:var(--txt);flex:1;line-height:1.3}
.sb-item-count{font-size:10px;color:var(--muted);font-weight:600}
.sb-divider{height:1px;background:var(--line);margin:8px 12px}
.sb-check{display:flex;align-items:center;gap:7px;padding:4px 12px;cursor:pointer;-webkit-user-select:none;user-select:none;}
.sb-check:hover{background:var(--panel)}
.sb-check input[type=checkbox]{accent-color:var(--acc);width:12px;height:12px;flex-shrink:0}
.sb-check-label{font-size:11px;color:var(--muted)}
.sb-check.active .sb-check-label{color:var(--txt)}
.sb-st-btn{
  display:flex;align-items:center;gap:6px;
  width:100%;padding:4px 12px;border:none;background:transparent;
  cursor:pointer;text-align:left;
  -webkit-user-select:none;user-select:none;
}
.sb-st-btn:hover{background:var(--panel)}
.sb-st-btn.active{background:var(--panel)}
.sb-st-btn span{font-size:11px;color:var(--muted)}
.sb-st-btn.active span{color:var(--txt)}

/* MAIN */
#main{
  flex:1;padding:16px;overflow-y:auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(480px,1fr));
  gap:12px;
  align-content:start;
}

/* CARDS */
.br-card{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  overflow:hidden;transition:border-color .15s;
}
.br-card:hover{border-color:var(--acc)}
.br-card.hidden{display:none}

.card-hdr{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;border-bottom:1px solid var(--line);
}
.card-id{
  font-family:'Cascadia Code','Consolas',monospace;
  font-size:11px;font-weight:700;color:var(--acc);
  background:rgba(161,0,255,.12);padding:2px 7px;border-radius:4px;
  flex-shrink:0;
}
.card-title{flex:1;font-size:13px;font-weight:600;color:var(--txt)}
.card-badges{display:flex;gap:5px;flex-shrink:0;align-items:center}
.badge-status,.badge-dom{
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;border:1px solid;
  -webkit-user-select:none;user-select:none;white-space:nowrap;
}
.status-conf{background:var(--green-bg);border-color:var(--green-brd);color:var(--green-txt)}
.status-inf{background:var(--yellow-bg);border-color:var(--yellow-brd);color:var(--yellow-txt)}
.status-gap{background:var(--red-bg);border-color:var(--red-brd);color:var(--red-txt)}
.badge-dom{background:var(--bg2);border-color:var(--line);color:var(--muted)}

.card-body{padding:10px 14px 8px}
.card-desc{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:8px}

.card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.meta-row{display:flex;align-items:flex-start;gap:6px;width:100%}
.meta-lbl{font-size:10px;color:var(--muted);font-weight:600;flex-shrink:0;padding-top:1px}
.meta-chips{display:flex;flex-wrap:wrap;gap:4px}
.chip-ds{
  font-size:10px;font-family:'Cascadia Code','Consolas',monospace;
  background:rgba(161,0,255,.10);color:#c4b5fd;
  border:1px solid rgba(161,0,255,.25);border-radius:4px;padding:1px 6px;
}
.tag{
  font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;border:1px solid;
  -webkit-user-select:none;user-select:none;
}

.card-footer{
  display:flex;align-items:center;border-top:1px solid var(--line);
  padding:4px 14px;
}
.detail-btn{
  font-size:11px;color:var(--muted);background:none;border:none;
  cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:4px;
  transition:color .12s;width:100%;text-align:left;
}
.detail-btn:hover{color:var(--acc)}
.detail-btn .arrow{font-size:10px;transition:transform .2s;display:inline-block}
.detail-btn.open .arrow{transform:rotate(90deg)}

.card-detail{
  display:none;padding:10px 14px;border-top:1px solid var(--line);
  background:var(--bg2);
}
.card-detail.open{display:block}
.card-detail p{font-size:12px;color:var(--muted);line-height:1.6}
.card-detail .fields{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.chip-field{
  font-size:10px;font-family:'Cascadia Code','Consolas',monospace;
  background:rgba(6,78,59,.3);color:#6ee7b7;
  border:1px solid rgba(6,78,59,.6);border-radius:4px;padding:1px 6px;
}

/* NO RESULTS */
#no-results{
  display:none;grid-column:1/-1;
  text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;
}
</style>
</head>
<body>

<!-- HEADER -->
<header id="hdr">
  <div id="hdr-title">
    <div class="t1">S500 · Reglas de Negocio</div>
    <div class="t2">Banamex · Unisys ClearPath MCP · DRAFT — inferidas de análisis estático · pendiente validación HITL</div>
  </div>
  <div id="hdr-stats">
    <span class="stat-pill stat-all">10 Dominios</span>
    <span class="stat-pill stat-all">37 Reglas</span>

    <span class="stat-pill stat-inf">⚠ 16 Inferidas</span>

  <div id="hdr-actions">
    <button type="button" onclick="toggleAll()">Expandir todo</button>
    <button type="button" onclick="exportCsv()">Exportar CSV</button>

<!-- FILTERBAR -->
<div id="fbar">
  <button type="button" class="fb-btn active" id="dom-ALL" onclick="setDom('ALL')">DOM-ALL</button>
  <button type="button" class="fb-btn" id="dom-DOM-01" onclick="setDom('DOM-01')">DOM-01</button>
  <button type="button" class="fb-btn" id="dom-DOM-02" onclick="setDom('DOM-02')">DOM-02</button>
  <button type="button" class="fb-btn" id="dom-DOM-03" onclick="setDom('DOM-03')">DOM-03</button>
  <button type="button" class="fb-btn" id="dom-DOM-04" onclick="setDom('DOM-04')">DOM-04</button>
  <button type="button" class="fb-btn" id="dom-DOM-05" onclick="setDom('DOM-05')">DOM-05</button>
  <button type="button" class="fb-btn" id="dom-DOM-06" onclick="setDom('DOM-06')">DOM-06</button>
  <button type="button" class="fb-btn" id="dom-DOM-07" onclick="setDom('DOM-07')">DOM-07</button>
  <button type="button" class="fb-btn" id="dom-DOM-08" onclick="setDom('DOM-08')">DOM-08</button>
  <button type="button" class="fb-btn" id="dom-DOM-09" onclick="setDom('DOM-09')">DOM-09</button>
  <button type="button" class="fb-btn" id="dom-DOM-10" onclick="setDom('DOM-10')">DOM-10</button>
  <div class="fb-sep"></div>
  <button type="button" class="fb-btn" id="st-ALL" onclick="setSt('ALL')">TODOS</button>
  <button type="button" class="fb-btn" id="st-conf" onclick="setSt('conf')">✅</button>
  <button type="button" class="fb-btn" id="st-inf" onclick="setSt('inf')">⚠</button>
  <button type="button" class="fb-btn" id="st-gap" onclick="setSt('gap')">❌</button>
  <div class="fb-sep"></div>
  <input type="text" id="fb-search" placeholder="Buscar…" oninput="applyFilters()">
  <span id="fb-count">37 de 37 reglas</span>
</div>

<!-- BODY -->
<div id="body">

  <!-- SIDEBAR -->
  <nav id="sb">
    <div class="sb-section">
      <div class="sb-label">Dominios</div>
      <div id="sb-domains"></div>
    </div>
    <div class="sb-divider"></div>
    <div class="sb-section">
      <div class="sb-label">Regulatorio</div>
      <div id="sb-reg"></div>
    </div>
    <div class="sb-divider"></div>
    <div class="sb-section">
      <div class="sb-label">Estado</div>
      <button type="button" class="sb-st-btn active" id="sbst-ALL" onclick="setSt('ALL')"><span>Todos</span></button>
      <button type="button" class="sb-st-btn" id="sbst-conf" onclick="setSt('conf')"><span>✅ Confirmada</span></button>
      <button type="button" class="sb-st-btn" id="sbst-inf" onclick="setSt('inf')"><span>⚠ Inferida</span></button>

  <!-- MAIN -->
  <main id="main">
    <div id="no-results">No se encontraron reglas con los filtros seleccionados.</div>
  </main>
</div>

<script>
const DOMAINS = [
  {id:'DOM-01',name:'Core Online',desc:'P010 dispatcher · control del sistema',color:'#1A5A38',txt:'#86efac'},
  {id:'DOM-02',name:'Gestión Cuenta',desc:'Lifecycle de contratos · saldos',color:'#2A507A',txt:'#93c5fd'},
  {id:'DOM-03',name:'Movimientos',desc:'OLTP diario · B07→B04 · claves',color:'#803060',txt:'#f9a8d4'},
  {id:'DOM-04',name:'Lote Nocturno',desc:'Batch · shadow BD02 · cierre ciclo',color:'#2A6E7A',txt:'#67e8f9'},
  {id:'DOM-05',name:'Pagos/SPEI',desc:'Pendientes · CECOBAN · SPEI',color:'#503280',txt:'#c4b5fd'},
  {id:'DOM-06',name:'Productos CPE/TEF',desc:'Instrumentos · comisiones · CPE',color:'#7A6018',txt:'#fde68a'},
  {id:'DOM-07',name:'Tarjetas BD04',desc:'Pre-altas · BIN · antifraude',color:'#1E6868',txt:'#5eead4'},
  {id:'DOM-08',name:'Comisiones',desc:'CONDUSEF · 7 tablas · DEPP',color:'#431407',txt:'#fdba74'},
  {id:'DOM-09',name:'Tesorería/Réplica',desc:'Ligas · cash pooling · BD03',color:'#1A4A4A',txt:'#a5f3fc'},
  {id:'DOM-10',name:'Control/Utilerías',desc:'Maker-Checker · MAPLI · BD07',color:'#3b1c8c',txt:'#c4b5fd'},
];

const RULES = [
  {id:'BR-001',dom:'DOM-01',title:'P010 como dispatcher LINEA',status:'inf',
   desc:'P010 (174K LOC) es el punto de entrada único de todas las transacciones LINEA. Lee B01CONTROL para verificar el estado del sistema antes de despachar cualquier transacción. Ninguna operación online accede a DMSII sin pasar por P010.',
   datasets:['B01CONTROL','B02CONTROL','B03CONTRATOS','B07MOVDIA'],fields:[],
   tags:['CRÍTICO','ARQUITECTURA'],
   detail:'P010 implementa el patrón Front Controller. Verifica fecha LINEA vs fecha LOTE antes de cada operación. Si el sistema está en modo de cierre nocturno, rechaza transacciones con código de error específico.'},
  {id:'BR-002',dom:'DOM-01',title:'Ventanas horarias de operación',status:'inf',
   desc:'B02CONTROL almacena ventanas horarias de disponibilidad para submódulos SBC, CASC y SDOS. Transacciones fuera de ventana son rechazadas o diferidas según configuración del instrumento.',
   datasets:['B02CONTROL'],fields:[],tags:['DISPONIBILIDAD','CONFIGURACIÓN'],
   detail:'Las ventanas horarias se configuran en B02CONTROL y se leen en cada transacción online para validar si el submódulo está disponible. Ejemplo: SBC puede tener ventana 06:00-23:00.'},
  {id:'BR-003',dom:'DOM-01',title:'Control de fechas del sistema',status:'conf',
   desc:'B01CONTROL (18 registros) contiene fecha LINEA y fecha LOTE. Toda transacción valida que fecha LINEA ≥ fecha LOTE. Si divergen más de 1 día, el sistema entra en modo de alerta. También almacena última autorización S151 y S408.',
   datasets:['B01CONTROL'],fields:['B01-FECHA-LINEA','B01-FECHA-LOTE','B01-ULT-AUT-S151','B01-ULT-AUT-S408'],
   tags:['CRÍTICO','CNBV'],
   detail:'La coherencia entre fecha LINEA y fecha LOTE es el corazón del control operativo. Una divergencia indica que el LOTE no completó o que el sistema de fechas falló. S151 y S408 son los sistemas de contabilidad general y SPEI respectivamente.'},
  {id:'BR-004',dom:'DOM-01',title:'Slots de archivos aplicados (30 slots)',status:'gap',
   desc:'B02CONTROL mantiene 30 slots (B02-ULT-ARCH-APLI-01 a 30) con los últimos archivos externos aplicados. Solo 12 de 30 slots tienen descripción conocida. Los 18 restantes son riesgo de migración no cuantificado.',
   datasets:['B02CONTROL'],fields:['B02-ULT-ARCH-APLI-01..30'],
   tags:['GAP-04','INTEGRACIÓN','CRÍTICO'],
   detail:'Cada slot representa un archivo externo diferente (S087 cheques, S016 bloqueos, S111 tarjetas, S408 SPEI, etc.). Los slots sin documentar pueden corresponder a interfaces activas o históricas. Requiere inventario completo con SME Banamex.'},

  {id:'BR-010',dom:'DOM-02',title:'Estados de contrato y transiciones',status:'conf',
   desc:'B03-STATUS controla el lifecycle del contrato: 0=Activo→1=Bloqueado→0, 0→2=Cancelado sin corte, 0→3=Cancelado con corte, sistema→4=Cancelado automático (inactividad/saldo cero), 0→5=Precancelado→3. Status 2-5 bloquean nuevos movimientos.',
   datasets:['B03CONTRATOS'],fields:['B03-STATUS'],
   tags:['LIFECYCLE','CNBV','CRÍTICO'],
   detail:'Status 4 es generado automáticamente por el sistema — el cliente no lo inicia. Status 5 (Precancelado) es un estado intermedio que permite cobrar comisiones pendientes antes del cierre definitivo. Las transiciones son validadas en P010 antes de procesar cualquier movimiento.'},
  {id:'BR-011',dom:'DOM-02',title:'Tipos de cuenta concentradora',status:'conf',
   desc:'B03-CTA-CONCENT: 0=Normal (retail), 5=Nómina (dispersión masiva), 8=Recaudadora (cobra de otras cuentas), 11=Concentradora (agrega saldos subsidiarias), 60-63=TESOFE (Gobierno Federal/SHCP). Las cuentas TESOFE tienen restricciones de acceso y reglas regulatorias adicionales.',
   datasets:['B03CONTRATOS'],fields:['B03-CTA-CONCENT'],
   tags:['CNBV','TESOFE','REGULATORIO'],
   detail:'TESOFE (60-63) son cuentas del Gobierno Federal administradas por la SHCP. Tienen auditoría reforzada y reglas específicas de generación de estado de cuenta. Las concentradoras (11) consolidan saldos de cuentas subsidiarias para gestión de liquidez corporativa.'},
  {id:'BR-012',dom:'DOM-02',title:'Esquema tarifario del contrato',status:'conf',
   desc:'B03-ESQ-TARIFARIO: 0=Tradicional (comisión fija por evento), 1=Por renta (cuota mensual fija), 2=Por transacción (variable por volumen). El esquema se hereda del producto B05INSTRUMEN pero puede personalizarse por contrato.',
   datasets:['B03CONTRATOS','B05INSTRUMEN'],fields:['B03-ESQ-TARIFARIO','B05-CLAVE-TARIF×60'],
   tags:['COMISIONES','CONDUSEF'],
   detail:'El esquema tarifario determina cómo se accede al array de 60 comisiones de B05INSTRUMEN. En modo Tradicional cada evento busca su comisión por CLAVE-MOVTO. En modo Por Renta se cobra una cuota al cierre del ciclo independientemente del número de transacciones.'},
  {id:'BR-013',dom:'DOM-02',title:'Medios de acceso asignados al contrato',status:'conf',
   desc:'B03-MDA-ASIGNADOS: 0=Ninguno (solo ventanilla), 1=Solo chequera, 2=Solo tarjeta, 3=Ambos. Se actualiza cuando el sistema registra entrega de chequera (P050 ACTIVA MEDIOS) o tarjeta (BD04). Determina los canales disponibles para el contrato.',
   datasets:['B03CONTRATOS','BD04 B03PREALTAS'],fields:['B03-MDA-ASIGNADOS'],
   tags:['CANALES','ONBOARDING'],
   detail:'El proceso P050 (ACTIVA MEDIOS) actualiza este campo cuando se entrega la chequera o se activa la tarjeta. Un contrato recién abierto empieza en 0 hasta que se completa el proceso de medios.'},
  {id:'BR-014',dom:'DOM-02',title:'Generación de estado de cuenta',status:'conf',
   desc:'B03-GEN-EDOCTA: 0=Sin información, 1=Mensual (default), 2=No genera, 3=Bimestral. Cuentas TESOFE (CTA-CONCENT 60-63) típicamente tienen valor 2. La periodicidad determina con qué frecuencia el LOTE actualiza B06HISTORICO para corte.',
   datasets:['B03CONTRATOS','B06HISTORICO'],fields:['B03-GEN-EDOCTA','B03-DIA-CORTE'],
   tags:['EDOCTA','CONDUSEF'],
   detail:'DIA-CORTE (1-31) define el día del mes en que se genera el estado de cuenta. Combinado con GEN-EDOCTA, el LOTE nocturno decide si ejecuta el proceso de cierre de ciclo. Valor 0 en GEN-EDOCTA es un estado transitorio que se resuelve en el primer ciclo completo.'},
  {id:'BR-015',dom:'DOM-02',title:'Ubicación de pagos pendientes (IND-PAGOPEND)',status:'conf',
   desc:'B03-IND-PAGOPEND: 01=Solo B24PAGOSPEND (estándar), 02=Solo B25PGOSPENDPE (periódicos externos), 03=En ambas tablas. Al consultar pagos pendientes, el sistema lee este indicador antes del acceso DMSII para evitar lecturas innecesarias.',
   datasets:['B03CONTRATOS','B24PAGOSPEND','B25PGOSPENDPE'],fields:['B03-IND-PAGOPEND'],
   tags:['PAGOS','RENDIMIENTO','OPTIMIZACIÓN'],
   detail:'Este campo es una optimización de acceso DMSII: en sistemas DMSII los full-scan son costosos. Saber dónde buscar los pagos antes de buscarlos reduce el tiempo de respuesta de las transacciones online.'},
  {id:'BR-016',dom:'DOM-02',title:'TEF — asignación y descalificación',status:'conf',
   desc:'B03-NUM-TEF: 0=Sin TEF, valor normal=TEF activo, todos-noves=Descalificado (TEF revocado). Una vez descalificado, la re-asignación requiere intervención manual. La descalificación puede ocurrir por mora, bloqueo regulatorio, o incumplimiento.',
   datasets:['B03CONTRATOS','B35NUMTEF'],fields:['B03-NUM-TEF'],
   tags:['TEF','CANALES'],
   detail:'El pool de números TEF se administra en B35NUMTEF. P050 toma el siguiente disponible y actualiza B03-NUM-TEF. El patrón de noves es un valor centinela — no es un número TEF válido sino un marcador de estado.'},
  {id:'BR-017',dom:'DOM-02',title:'Saldo protegido contra sobregiro',status:'inf',
   desc:'B03-SDO-PROTEGIDO reserva un monto del saldo disponible que no puede ser debitado por operaciones normales. Se usa para cuentas con SBC o para proteger el cargo mínimo de comisiones del próximo corte.',
   datasets:['B03CONTRATOS','B26SDOSBC'],fields:['B03-SDO-PROTEGIDO','B03-SDO-SBC'],
   tags:['SBC','CRÉDITO'],
   detail:'La interacción exacta entre SDO-PROTEGIDO, SDO-ACTUAL y SDO-SBC es una de las reglas más complejas del sistema. El saldo disponible efectivo para el cliente es SDO-ACTUAL - SDO-PROTEGIDO + SDO-SBC. Requiere validación HITL.'},
  {id:'BR-018',dom:'DOM-02',title:'Acumulados históricos en ciclo (B06HISTORICO)',status:'conf',
   desc:'Al cierre de cada ciclo, el LOTE escribe el estado del contrato en B06HISTORICO: depósitos y retiros por cada día del ciclo (arrays de 31 elementos), tasa bruta aplicada, ISR retenido, y acumulados anuales. Es la base para generar el estado de cuenta.',
   datasets:['B03CONTRATOS','B06HISTORICO'],fields:['B06-DEPS-DIA×31','B06-RETS-DIA×31','B06-TASA-BRUTA','B06-IMPUESTO-RET'],
   tags:['EDOCTA','ISR','CNBV'],
   detail:'Los arrays de 31 elementos indexan por día del mes. El cierre de ciclo activa la tasa del instrumento (B05INSTRUMEN) para calcular rendimientos sobre el saldo promedio. El ISR se retiene automáticamente según CVE-RETIMP del instrumento.'},

  {id:'BR-020',dom:'DOM-03',title:'Buffer diario OLTP → Batch (B07→B04)',status:'conf',
   desc:'Toda transacción online se escribe en B07MOVDIA (buffer del día). El LOTE NOCTURNO purga B07 hacia B04MOVIMIENTO (historia permanente) y recalcula saldos en B03. Los saldos en B03 reflejan B04+B07 en tiempo real. Este patrón es el corazón de la concurrencia del sistema.',
   datasets:['B07MOVDIA','B04MOVIMIENTO','B03CONTRATOS'],fields:[],
   tags:['CRÍTICO','ARQUITECTURA','OLTP'],
   detail:'LINEA escribe en B07, LOTE lee B07 y escribe B04 sin conflicto. Esta separación elimina la contención entre procesos online y batch — patrón estándar en sistemas DMSII de alta disponibilidad. La purga de B07 al cierre de cada día es el mecanismo de archivado transaccional.'},
  {id:'BR-021',dom:'DOM-03',title:'Origen del movimiento (Local vs Foráneo)',status:'conf',
   desc:'B04-ORIGEN-MOVTO / B07-ORIGEN-MOVTO: 1=Local (misma región), 3=Foráneo (otra región o banco). Impacta el cálculo de fecha valor y las comisiones de compensación interbancaria. Los movimientos foráneos tienen fecha valor +1 día hábil por default (configurable en B11FVALOR).',
   datasets:['B04MOVIMIENTO','B07MOVDIA','B11FVALOR'],fields:['B04-ORIGEN-MOVTO'],
   tags:['COMPENSACIÓN','CECOBAN'],
   detail:'La fecha valor se calcula en el momento de la transacción usando B11FVALOR como tabla de días hábiles por instrumento y plaza. Los movimientos foráneos generan además una entrada en B09CIFRAS para acumulación CECOBAN.'},
  {id:'BR-022',dom:'DOM-03',title:'Canal de acceso por movimiento (TIPO-MEDACCES)',status:'conf',
   desc:'B07-TIPO-MEDACCES: 0=Solo número de contrato (ventanilla), 1=Chequera (número de cheque), 2=Tarjeta de débito (PAN), 3=PIN (cajero ATM). Determina las comisiones aplicables y los límites de operación (bucket en BD04).',
   datasets:['B07MOVDIA','B04MOVIMIENTO','BD04 B15PCTLBUCKET'],fields:['B07-TIPO-MEDACCES'],
   tags:['CANALES','COMISIONES'],
   detail:'El canal determina qué índice del array de 60 comisiones de B05INSTRUMEN se usa para cobrar la comisión. Canal 2 (tarjeta) y canal 3 (PIN/ATM) también validan contra B15PCTLBUCKET en BD04 para verificar límites diarios.'},
  {id:'BR-023',dom:'DOM-03',title:'IVA sobre comisiones (IND-IVA)',status:'conf',
   desc:'B07-IND-IVA: 0=No aplica, 1=10% (zona fronteriza), 2=15% (resto del país — tasa histórica; actual 16% puede requerir validación). El IVA se registra en B07-2DO-IMPORTE separado del cargo principal en B07-IMPORTE.',
   datasets:['B07MOVDIA','B05INSTRUMEN'],fields:['B07-IND-IVA','B07-IMPORTE','B07-2DO-IMPORTE'],
   tags:['IVA','SAT','REGULATORIO'],
   detail:'La tasa del 15% en el campo sugiere que este instrumento fue configurado con la tasa histórica anterior a la reforma fiscal. La tasa actual en México es 16% (8% frontera). Requiere validar si el cálculo se actualiza vía configuración o si el código tiene la tasa hardcoded.'},
  {id:'BR-024',dom:'DOM-03',title:'Tipos de giros interbancarios (TIPO-CGIROS)',status:'conf',
   desc:'B07-TIPO-CGIROS clasifica el depósito/retiro interbancario: 1=Dep BNM (Banxico), 2=Dep otros bancos, 3=Mixto, 4=Bonificación, 5=Dev BNM, 6=Dev otros bancos. Determina la cuenta contable en S151 y la ruta CECOBAN.',
   datasets:['B07MOVDIA','B09CIFRAS'],fields:['B07-TIPO-CGIROS'],
   tags:['CECOBAN','SPEI','S151'],
   detail:'El tipo de giro es crítico para la contabilidad: cada categoría mapea a una cuenta contable diferente en S151. Los tipos 1 y 5 (Banxico) tienen tratamiento especial en el reporte R04 de CNBV.'},
  {id:'BR-025',dom:'DOM-03',title:'Uso de línea SBC — sobregiro autorizado',status:'conf',
   desc:'B07-MOV-SOBREGIRO: 0=No, 1=Usó línea Stand By Credit. Cuando vale 1, el débito supera el SDO-ACTUAL y se cubre con SDO-SBC. Se genera entrada paralela en B27MOVSBC para registrar la disposición. CONDUSEF exige reportar el interés SBC por separado.',
   datasets:['B07MOVDIA','B26SDOSBC','B27MOVSBC'],fields:['B07-MOV-SOBREGIRO','B03-SDO-SBC'],
   tags:['SBC','CRÉDITO','CONDUSEF'],
   detail:'El interés SBC se calcula sobre el monto dispuesto y los días de uso. El cobro del interés se procesa en el LOTE nocturno con una CLAVE-MOVTO específica de SBC (desconocida — GAP-01). CONDUSEF requiere que el cobro de interés SBC sea transparente en el estado de cuenta.'},
  {id:'BR-026',dom:'DOM-03',title:'Catálogo de claves de transacción (CLAVE-MOVTO)',status:'gap',
   desc:'B04/B07-CLAVE-MOVTO es el clasificador principal de tipos de transacción (~200 códigos en B17CVESXFUN + B18CVESXINST). Sin este catálogo no es posible mapear los tipos de movimiento para la arquitectura target. Es la regla más crítica pendiente de documentar.',
   datasets:['B04MOVIMIENTO','B07MOVDIA','B17CVESXFUN','B18CVESXINST'],fields:['B04-CLAVE-MOVTO','B07-CLAVE-MOVTO'],
   tags:['GAP-01','CRÍTICO','CATÁLOGO'],
   detail:'El catálogo CLAVE-MOVTO es equivalente al "tipo de transacción" en cualquier sistema bancario moderno. Sin mapearlo no es posible implementar el dominio de Movimientos en la arquitectura target. Prioridad 1 para el HITL con SME Banamex.'},
  {id:'BR-027',dom:'DOM-03',title:'ISR retenido acumulado anual',status:'conf',
   desc:'B03-IMPUESTO-RET acumula el ISR sobre rendimientos durante el año fiscal. Al cierre de ciclo se replica en B06-IMPUESTO-RET. Al cierre del año se usa para el reporte anual SAT. La tasa se configura en B05-CVE-RETIMP por instrumento.',
   datasets:['B03CONTRATOS','B06HISTORICO','B05INSTRUMEN'],fields:['B03-IMPUESTO-RET','B06-IMPUESTO-RET','B05-CVE-RETIMP'],
   tags:['ISR','SAT','REGULATORIO'],
   detail:'La retención de ISR sobre intereses bancarios es obligatoria en México (LISR Art. 58). La tasa varía por tipo de persona (física/moral) y año fiscal. El campo CVE-RETIMP en B05INSTRUMEN apunta a una tabla de tasas que no fue documentada.'},

  {id:'BR-030',dom:'DOM-04',title:'Patrón shadow BD02 AUXILIAR',status:'conf',
   desc:'BD02 AUXILIAR es espejo de datasets críticos de BD01 (B03→B03AUXCTOS, B04→B04AUXMOVTOS, B21→B21AUXINTBCO, etc.). LOTE trabaja sobre BD02 mientras LINEA opera sobre BD01. Al terminar LOTE, saldos de BD02 se reconcilian y promueven a BD01. Mecanismo de disponibilidad 24/7.',
   datasets:['BD01 (todos)','BD02 (espejos)'],fields:[],
   tags:['CRÍTICO','ARQUITECTURA','DISPONIBILIDAD'],
   detail:'Este patrón es el más importante de la arquitectura S500. Sin él, el LOTE nocturno bloquearía las operaciones online. La reconciliación BD02→BD01 al final del LOTE es el punto de mayor riesgo — si falla, los saldos quedan inconsistentes. El proceso P142/P144 probablemente gestiona parte de esta reconciliación (GAP-08).'},
  {id:'BR-031',dom:'DOM-04',title:'Control de pasos del LOTE (B00CTRLPASO)',status:'inf',
   desc:'B00CTRLPASO (8 registros) registra los pasos completados del LOTE NOCTURNO. Si el LOTE falla, el sistema lee B00 para hacer RESTART desde el último paso exitoso. S038B91REINICIO (BD05 MAPLI) gestiona el punto técnico de reinicio.',
   datasets:['B00CTRLPASO','BD05 S038B91REINICIO'],fields:['B00-NUM-PASO-01/02/03','B00-CARGA-MOTOR','B00-FECH-ART61'],
   tags:['BATCH','RESTART','CONTINUIDAD'],
   detail:'La población de 8 registros sugiere 8 pasos principales en el LOTE: posiblemente purga B07→B04, cierre ciclo, reconciliación BD02, CECOBAN, SPEI, Art.61, archivado y control. El campo B00-FECH-ART61 controla la última ejecución del proceso de cuentas abandonadas CONDUSEF.'},
  {id:'BR-032',dom:'DOM-04',title:'Cierre de ciclo y actualización B06HISTORICO',status:'conf',
   desc:'Al alcanzar DIA-CORTE, LOTE: (1) calcula promedio diario del ciclo, (2) aplica tasa bruta del instrumento, (3) retiene ISR, (4) acumula en B06-ACUM-PROMANU, (5) actualiza SDO-ANTERIOR al nuevo saldo base, (6) activa generación de estado de cuenta si GEN-EDOCTA ≠ 2.',
   datasets:['B03CONTRATOS','B06HISTORICO','B05INSTRUMEN'],fields:['B06-DIAS-CICLO','B06-ACUM-PROMANU','B06-ACUM-INTSANU'],
   tags:['CICLO','EDOCTA','ISR'],
   detail:'El ciclo no es necesariamente mensual — DIA-CORTE puede ser cualquier día 1-31. Productos bimestrales tienen DIA-CORTE que se activa cada 2 meses (GEN-EDOCTA=3). El cálculo de promedio diario usa los arrays DEPS-DIA/RETS-DIA de B06HISTORICO.'},
  {id:'BR-033',dom:'DOM-04',title:'Naming swap WFL LINEA/LOTE',status:'conf',
   desc:'ANOMALÍA DOCUMENTADA: S500_WFL_LOTE.txt contiene el job LINEA (operación diaria online 24MTP005). S500_WFL_LINEA.txt contiene el job de REORG de CAPTACION. Los nombres están invertidos respecto al contenido. No corregir sin validar con SME Banamex.',
   datasets:['(WFL — no DMSII)'],fields:[],
   tags:['ANOMALÍA','CRÍTICO','ETAPA0'],
   detail:'Documentado en ETAPA 0 del discovery. Esta inversión de nombres puede confundir en cualquier análisis automatizado del código. Todos los análisis posteriores deben considerar esta anomalía. El job real del LOTE NOCTURNO debe identificarse leyendo el contenido del WFL, no por el nombre del archivo.'},

  {id:'BR-040',dom:'DOM-05',title:'Pagos pendientes estándar (B24PAGOSPEND)',status:'conf',
   desc:'B24PAGOSPEND (5M registros, PK: CONTRATO+TIPO-PAGO+REFERENCIA) almacena domiciliaciones y cobros diferidos. B24-HORA-LTECOBRO define la hora límite de cobro; si no se ejecuta antes, el pago se cancela o difiere según B24-STATUS.',
   datasets:['B24PAGOSPEND','B03CONTRATOS'],fields:['B24-TIPO-PAGO','B24-REFERENCIA','B24-HORA-LTECOBRO','B24-STATUS'],
   tags:['PAGOS','DOMICILIACIÓN'],
   detail:'La capacidad de 5M registros indica un uso intensivo de domiciliaciones. La llave compuesta CONTRATO+TIPO-PAGO+REFERENCIA permite a un contrato tener múltiples pagos pendientes de distintos tipos activos simultáneamente. HORA-LTECOBRO es el SLA de cobro comprometido con el proveedor externo.'},
  {id:'BR-041',dom:'DOM-05',title:'Devoluciones mensuales rolling (B20DEVMENSUAL)',status:'conf',
   desc:'B20DEVMENSUAL (1.8M registros) lleva contador rolling de devoluciones: DEV-MES (actual), DEV-MES-ANT (anterior), DEV-MESANTANT (hace 2 meses). Superar el umbral activa bloqueo del medio de acceso o descalificación TEF. Umbral configurable por instrumento.',
   datasets:['B20DEVMENSUAL','B03CONTRATOS','B08DEVOLUCION'],fields:['B20-DEV-MES','B20-DEV-MES-ANT','B20-DEV-MESANTANT'],
   tags:['DEVOLUCIONES','ANTIFRAUDE'],
   detail:'El rolling de 3 meses permite evaluar tendencias de devolución. Un cliente con 2+ devoluciones en el mes actual puede tener su chequera bloqueada preventivamente. El umbral no fue documentado — requiere HITL.'},
  {id:'BR-042',dom:'DOM-05',title:'Devoluciones de cheques interbancarios (B08)',status:'conf',
   desc:'B08DEVOLUCION (500K): status 0=Devolución activa (cargo al emisor pendiente), 1=Rescatado (librador cubrió antes del cierre CECOBAN), 9=Eliminado (procesado). Causa de devolución usa códigos CECOBAN estándar.',
   datasets:['B08DEVOLUCION','B03CONTRATOS'],fields:['B08-STATUS-DEV','B08-CAUSA-DEVOL','B08-SUBCAUSA-DEVO','B08-BANCO-PRESENT'],
   tags:['DEVOLUCIONES','CECOBAN','REGULATORIO'],
   detail:'El proceso de rescate (status 1) permite al librador cubrir el cheque antes de que CECOBAN ejecute la compensación de la devolución. Esto reduce el cargo por devolución interbancaria. La ventana de rescate es la misma ventana horaria de CECOBAN del día.'},
  {id:'BR-043',dom:'DOM-05',title:'Mensajes interbancarios SPEI (B21INTERBANC)',status:'inf',
   desc:'B21INTERBANC (DIRECT): B21-AUTORIZACION(14)= SUC-TRANS(4)+CAJ-TRANS(2)+AUTORIZ(8). B21-AUT-INTERBANC(6) es la clave de correlación con el mensaje BANXICO. Relación exacta con número externo BANXICO requiere HITL (GAP-05).',
   datasets:['B21INTERBANC','B09CIFRAS'],fields:['B21-AUT-INTERBANC(6)','B21-AUTORIZACION(14)'],
   tags:['SPEI','BANXICO','GAP-05'],
   detail:'La composición SUC+CAJ+AUTORIZ en el número de autorización es el esquema interno de S500. El número externo BANXICO (clave de rastreo SPEI) debe mapearse a este esquema para la conciliación. Sin este mapeo no es posible rastrear una transferencia SPEI de extremo a extremo.'},
  {id:'BR-044',dom:'DOM-05',title:'Réplica a sistemas externos (B53/B54)',status:'gap',
   desc:'B53ENVREPLICA (~10M, DIRECT) y B54RECREPLICA replican estado de cuentas a sistemas externos. El receptor de B53 es desconocido — probable S151 (contabilidad) pero sin confirmación. Crítico para coherencia S500↔S151 en modernización.',
   datasets:['B53ENVREPLICA','B54RECREPLICA'],fields:[],
   tags:['RÉPLICA','GAP-09','CRÍTICO','S151'],
   detail:'Si el receptor es S151, este flujo es el mecanismo de sincronización contable más importante del sistema. La arquitectura target debe reemplazarlo con un patrón de eventos (event-driven) o CDC antes de poder descomisionar S500.'},

  {id:'BR-050',dom:'DOM-06',title:'Catálogo de productos e instrumentos (B05INSTRUMEN)',status:'conf',
   desc:'B05INSTRUMEN: catálogo master con llave PRODUCTO+INSTRUMENTO+MONEDA. Define: pago de rendimiento, día de corte, emisión chequera/tarjeta, y hasta 60 tipos de comisiones por combinación. Un mismo producto puede tener variantes por moneda.',
   datasets:['B05INSTRUMEN','B03CONTRATOS'],fields:['B05-IND-PAGOREND','B05-IND-DIACORTE','B05-MA-CHEQUERA','B05-CLAVE-TARIF×60'],
   tags:['CATÁLOGO','COMISIONES','PRODUCTOS'],
   detail:'La estructura de 60 comisiones es el mecanismo de pricing del sistema. El array de 60 elementos indexed por tipo de evento (CLAVE-MOVTO) permite una configuración muy granular de tarifas. La legibilidad de este catálogo depende de conocer el catálogo CLAVE-MOVTO (GAP-01).'},
  {id:'BR-051',dom:'DOM-06',title:'CPE — Cuentas Pago Empresa',status:'gap',
   desc:'B37GRUPOCPE + B38SUBGPOS + B39CTASCPE conforman la estructura CPE. No determinado si CPE es producto regulado CNBV (requiere tratamiento CONDUSEF) o producto interno de tesorería corporativa. Impacta el alcance regulatorio de la modernización.',
   datasets:['B37GRUPOCPE','B38SUBGPOS','B39CTASCPE'],fields:[],
   tags:['CPE','GAP-10','REGULATORIO'],
   detail:'Si CPE es una cuenta de pago regulada (CNBV Circular Única de Bancos), requiere: CLABE asignada, estados de cuenta, reporte CONDUSEF de comisiones, y cumplimiento de prevención de lavado. Si es producto interno de tesorería, el alcance regulatorio es menor. La distinción es crítica para el diseño del dominio target.'},
  {id:'BR-052',dom:'DOM-06',title:'Esquema de 60 comisiones por instrumento',status:'conf',
   desc:'B05INSTRUMEN tiene arrays CLAVE-TARIF×60 y CLAVE-COMIS×60. Cada posición corresponde a un tipo de evento. El esquema tarifario del contrato (BR-012) determina cómo se accede al array. Sin el catálogo CLAVE-MOVTO (GAP-01) el mapeo posición→evento es desconocido.',
   datasets:['B05INSTRUMEN','B17CVESXFUN','B18CVESXINST'],fields:['B05-CLAVE-TARIF×60','B05-CLAVE-COMIS×60'],
   tags:['COMISIONES','CONDUSEF','GAP-01'],
   detail:'La capacidad de 60 tipos de comisión es significativa — la mayoría de sistemas bancarios core tienen 10-20 tipos. Esto sugiere una granularidad tarifaria muy alta que será difícil de replicar en un sistema moderno sin un análisis exhaustivo de cuántos de los 60 slots están realmente en uso.'},

  {id:'BR-060',dom:'DOM-07',title:'Pre-alta de tarjetas (B03PREALTAS BD04)',status:'conf',
   desc:'BD04 B03PREALTAS (~15M registros, PK: PAN(16)) registra tarjetas pre-asignadas antes de su activación. El sistema de personalización externo crea el registro; el cliente activa en cajero o sucursal. Producto 66-11.',
   datasets:['BD04 B03PREALTAS','B03CONTRATOS','BD04 B04PTEF'],fields:['B03P-TARJETA','B03P-CONTRATO','B03P-FEC-PREALTA'],
   tags:['TARJETAS','CANALES','ONBOARDING'],
   detail:'La población de 15M sugiere que la mayoría de los contratos activos (~30M) tienen pre-alta de tarjeta. La brecha (15M vs 30M) puede indicar contratos sin tarjeta (solo chequera, cuentas TESOFE, etc.) o tarjetas aún no pre-personalizadas. Requiere validación GAP-07.'},
  {id:'BR-061',dom:'DOM-07',title:'Detección de clonación de tarjetas (B12PCLONNING)',status:'inf',
   desc:'B12PCLONNING detecta patrones de clonación: múltiples transacciones en localidades distintas en ventana corta, o PAN usado simultáneamente en dos terminales. Al detectar el patrón, bloquea el PAN y genera alerta en B17PCTLALERTA.',
   datasets:['BD04 B12PCLONNING','BD04 B17PCTLALERTA'],fields:[],
   tags:['ANTIFRAUDE','TARJETAS','SEGURIDAD'],
   detail:'Las reglas exactas del algoritmo de detección no fueron leídas del código ALGOL/COBOL. El patrón geográfico (transacciones en localidades distintas en ventana corta) es el más común en sistemas antifraude de tarjetas. La ventana temporal exacta requiere HITL.'},
  {id:'BR-062',dom:'DOM-07',title:'Límites operativos por tarjeta (bucket)',status:'inf',
   desc:'B15PCTLBUCKET limita operaciones diarias/mensuales por tarjeta: máximo retiros ATM, compras POS, transferencias. Superar el límite rechaza la transacción. Límites configurables por BIN/producto y ajustables por perfil de cliente.',
   datasets:['BD04 B15PCTLBUCKET','BD04 B03PREALTAS'],fields:[],
   tags:['TARJETAS','LÍMITES','ANTIFRAUDE'],
   detail:'El concepto de "bucket" (cubeta) es el control de límites acumulativos: cada transacción resta del bucket diario. Al inicio del día el bucket se resetea. Los límites exactos (montos máximos por tipo de operación) requieren HITL.'},
  {id:'BR-063',dom:'DOM-07',title:'Art. 61 CONDUSEF — cuentas abandonadas',status:'inf',
   desc:'B05PHISCTAGLB (BD04) registra histórico de traspasos de saldos de cuentas abandonadas a cuenta global de beneficencia (Art. 61 CONDUSEF). Cuenta abandonada: sin movimientos en 3 años y no reclamada. B00-FECH-ART61 controla la última ejecución.',
   datasets:['BD04 B05PHISCTAGLB','B00CTRLPASO'],fields:['B00-FECH-ART61'],
   tags:['CONDUSEF','ART61','REGULATORIO'],
   detail:'El Art. 61 de la LGOAAC obliga a transferir los saldos de cuentas inactivas a un fondo de beneficencia de CONDUSEF. El proceso se ejecuta periódicamente en el LOTE y se registra en B05PHISCTAGLB para auditoría regulatoria.'},

  {id:'BR-070',dom:'DOM-08',title:'7 tablas de comisiones cobradas CONDUSEF',status:'conf',
   desc:'B28-B34COMICOB (BD01) registran comisiones cobradas en 7 categorías regulatorias CONDUSEF. El desglose en 7 tablas responde a la estructura del reporte regulatorio mensual. Los tipos exactos por tabla están vinculados al catálogo CLAVE-MOVTO (GAP-01 parcial).',
   datasets:['B28COMICOB','B29COMICOB','B30COMICOB','B31COMICOB','B32COMICOB','B33COMICOB','B34COMICOB'],fields:[],
   tags:['CONDUSEF','REGULATORIO','COMISIONES'],
   detail:'CONDUSEF exige un desglose específico de comisiones cobradas por tipo. Las 7 tablas probablemente corresponden a: manejo de cuenta, retiro ATM propio, retiro ATM foráneo, transferencia nacional, transferencia SPEI, cheque devuelto, otros. Requiere confirmación HITL.'},
  {id:'BR-071',dom:'DOM-08',title:'DEPP — Depósitos en efectivo personas físicas',status:'inf',
   desc:'B49COMPENDEPP acumula depósitos en efectivo de personas físicas para el reporte DEPP (CNBV). Depósitos >$15,000 MXN/mes por persona física deben reportarse. Permite generar el archivo periódico a CNBV.',
   datasets:['B49COMPENDEPP'],fields:[],
   tags:['CNBV','DEPP','ANTILAVADO','REGULATORIO'],
   detail:'El reporte DEPP es mensual. El umbral de $15,000 MXN es configurable regulatoriamente. B49 acumula por RFC para consolidar depósitos de un mismo titular en múltiples sucursales.'},

  {id:'BR-080',dom:'DOM-09',title:'Ligas de tesorería y cash pooling (B50)',status:'inf',
   desc:'B50LIGASTESO define relaciones entre contratos para cash pooling y sweep accounts. Una cuenta concentradora (CTA-CONCENT=11) puede tener N cuentas ligadas cuyos saldos se consolidan. El barrido (sweep) se ejecuta en el LOTE NOCTURNO.',
   datasets:['B50LIGASTESO','B51RCTAORI','B03CONTRATOS'],fields:[],
   tags:['TESORERÍA','CASH-POOLING'],

   desc:'B03CONTRATOS tiene campos BANCA (tipo de banca) y SECTOR (sector económico SCIAN) para reportes estadísticos CNBV (R04-C, R04-D). El catálogo de valores no fue documentado — crítico para los reportes regulatorios mensuales a CNBV.',

const TAG_COLORS = {
  'CRÍTICO':      {bg:'#450a0a',txt:'#fca5a5',brd:'#b91c1c'},
  'ARQUITECTURA': {bg:'#2d0a6b',txt:'#c4b5fd',brd:'#7c3aed'},
  'CONDUSEF':     {bg:'#431407',txt:'#fdba74',brd:'#c2410c'},
  'CNBV':         {bg:'#1e3a5f',txt:'#93c5fd',brd:'#2563eb'},
  'SPEI':         {bg:'#3b0764',txt:'#e9d5ff',brd:'#7c3aed'},
  'BANXICO':      {bg:'#3b0764',txt:'#e9d5ff',brd:'#7c3aed'},
  'ISR':          {bg:'#052e16',txt:'#86efac',brd:'#16a34a'},
  'SAT':          {bg:'#052e16',txt:'#86efac',brd:'#16a34a'},
  'CECOBAN':      {bg:'#0c4a6e',txt:'#7dd3fc',brd:'#0284c7'},
  'ANTIFRAUDE':   {bg:'#422006',txt:'#fef3c7',brd:'#d97706'},
  'TESOFE':       {bg:'#1c1917',txt:'#e7e5e4',brd:'#78716c'},
  'ANTILAVADO':   {bg:'#450a0a',txt:'#fca5a5',brd:'#b91c1c'},
  'S151':         {bg:'#1e3a5f',txt:'#93c5fd',brd:'#2563eb'},
  'ANOMALÍA':     {bg:'#450a0a',txt:'#fca5a5',brd:'#b91c1c'},
  'ART61':        {bg:'#431407',txt:'#fdba74',brd:'#c2410c'},
  'DEPP':         {bg:'#1e3a5f',txt:'#93c5fd',brd:'#2563eb'},
};
const TAG_DEFAULT = {bg:'#1f1f3a',txt:'#9a9ab5',brd:'#2c2c50'};
const GAP_COLOR   = {bg:'#450a0a',txt:'#fca5a5',brd:'#b91c1c'};

const REG_TAGS = ['CRÍTICO','CONDUSEF','CNBV','SPEI','ISR','CECOBAN','ANTIFRAUDE','GAP'];

// State
let activeDom = 'ALL';
let activeSt  = 'ALL';
let activeTags = new Set();
let allExpanded = false;

function tagStyle(t){
  if(t.startsWith('GAP')) return GAP_COLOR;
  return TAG_COLORS[t] || TAG_DEFAULT;
}

function statusLabel(s){
  if(s==='conf') return ['✅ DOC','status-conf'];
  if(s==='inf')  return ['⚠ INF','status-inf'];
  return ['❌ GAP','status-gap'];
}

function buildDomainCounts(){
  const counts = {};
  DOMAINS.forEach(d=>counts[d.id]=0);
  RULES.forEach(r=>{ if(counts[r.dom]!==undefined) counts[r.dom]++; });
  return counts;
}

function buildSidebar(){
  const counts = buildDomainCounts();
  const sbDom = document.getElementById('sb-domains');
  sbDom.innerHTML = DOMAINS.map(d=>`
    <div class="sb-item" id="sbdom-${d.id}" onclick="setDom('${d.id}')">
      <span class="sb-dot" style="background:${d.color}"></span>
      <span class="sb-item-label">${d.name}</span>
      <span class="sb-item-count">${counts[d.id]}</span>
    </div>
  `).join('');

  const sbReg = document.getElementById('sb-reg');
  sbReg.innerHTML = REG_TAGS.map(t=>{
    const s=tagStyle(t);
    return `<div class="sb-check" id="sbreg-${t}" onclick="toggleTag('${t}')">
      <input type="checkbox" id="chk-${t}" onchange="toggleTag('${t}')">
      <label class="sb-check-label" for="chk-${t}" style="color:${s.txt}">${t}</label>
    </div>`;
  }).join('');
}

function renderCards(){
  const main = document.getElementById('main');
  const nr = document.getElementById('no-results');
  main.innerHTML = '';
  main.appendChild(nr);

  RULES.forEach(r=>{
    const [slabel,scls] = statusLabel(r.status);
    const dom = DOMAINS.find(d=>d.id===r.dom);
    const domStyle = dom ? `color:${dom.txt}` : '';

    const dsChips = (r.datasets||[]).map(d=>`<span class="chip-ds">${d}</span>`).join('');
    const tagChips = (r.tags||[]).map(t=>{
      const s=tagStyle(t);
      return `<span class="tag" style="background:${s.bg};color:${s.txt};border-color:${s.brd}">${t}</span>`;
    }).join('');
    const fieldChips = (r.fields||[]).length>0
      ? `<div class="fields">${r.fields.map(f=>`<span class="chip-field">${f}</span>`).join('')}</div>` : '';

    const card = document.createElement('div');
    card.className='br-card';
    card.id=`card-${r.id}`;
    card.dataset.dom=r.dom;
    card.dataset.status=r.status;
    card.dataset.tags=(r.tags||[]).join(',');
    card.dataset.text=(r.id+' '+r.title+' '+r.desc+' '+(r.tags||[]).join(' ')).toLowerCase();

    card.innerHTML=`
      <div class="card-hdr">
        <span class="card-id">${r.id}</span>
        <span class="card-title">${r.title}</span>
        <div class="card-badges">
          <span class="badge-status ${scls}">${slabel}</span>
          <span class="badge-dom" style="${domStyle}">${r.dom}</span>
        </div>
      </div>
      <div class="card-body">
        <p class="card-desc">${r.desc}</p>
        <div class="card-meta">
          ${dsChips ? `<div class="meta-row"><span class="meta-lbl">Datasets:</span><div class="meta-chips">${dsChips}</div></div>` : ''}
          ${tagChips ? `<div class="meta-row"><span class="meta-lbl">Tags:</span><div class="meta-chips">${tagChips}</div></div>` : ''}
        </div>
      </div>
      <div class="card-footer">
        <button type="button" class="detail-btn" onclick="toggleDetail(this)">
          <span class="arrow">▶</span> Ver detalle técnico
        </button>
      </div>
      <div class="card-detail">
        <p>${r.detail||''}</p>
        ${fieldChips}
      </div>`;
    main.appendChild(card);
  });
}

function applyFilters(){
  const q = document.getElementById('fb-search').value.toLowerCase().trim();
  let visible=0;
  document.querySelectorAll('.br-card').forEach(card=>{
    const domMatch = activeDom==='ALL' || card.dataset.dom===activeDom;
    const stMatch = activeSt==='ALL' || card.dataset.status===activeSt;
    const tags = card.dataset.tags ? card.dataset.tags.split(',') : [];
    let tagMatch = true;
    if(activeTags.size>0){
      tagMatch = [...activeTags].some(at=>{
        if(at==='GAP') return tags.some(t=>t.startsWith('GAP'));
        return tags.includes(at);
      });
    }
    const textMatch = !q || card.dataset.text.includes(q);
    const show = domMatch && stMatch && tagMatch && textMatch;
    card.classList.toggle('hidden',!show);
    if(show) visible++;
  });
  document.getElementById('fb-count').textContent=`${visible} de ${RULES.length} reglas`;
  document.getElementById('no-results').style.display = visible===0?'block':'none';
}

function setDom(id){
  activeDom=id;
  document.querySelectorAll('.fb-btn[id^="dom-"]').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('dom-'+id);
  if(btn) btn.classList.add('active');
  document.querySelectorAll('.sb-item[id^="sbdom-"]').forEach(b=>b.classList.remove('active'));
  const sbItem=document.getElementById('sbdom-'+id);
  if(sbItem) sbItem.classList.add('active');
  applyFilters();
}

function setSt(st){
  activeSt=st;
  ['ALL','conf','inf','gap'].forEach(s=>{
    const fb=document.getElementById('st-'+s);
    if(fb) fb.classList.toggle('active',s===st);
    const sb=document.getElementById('sbst-'+s);
    if(sb) sb.classList.toggle('active',s===st);
  });
  applyFilters();
}

function toggleTag(tag){
  if(activeTags.has(tag)){
    activeTags.delete(tag);
  } else {
    activeTags.add(tag);
  }
  const chk=document.getElementById('chk-'+tag);
  if(chk) chk.checked=activeTags.has(tag);
  const sbItem=document.getElementById('sbreg-'+tag);
  if(sbItem) sbItem.classList.toggle('active',activeTags.has(tag));
  applyFilters();
}

function toggleDetail(btn){
  btn.classList.toggle('open');
  const detail=btn.closest('.br-card').querySelector('.card-detail');
  detail.classList.toggle('open');
}

function toggleAll(){
  allExpanded=!allExpanded;
  document.querySelectorAll('.detail-btn').forEach(btn=>{
    if(allExpanded){
      btn.classList.add('open');
      btn.closest('.br-card').querySelector('.card-detail').classList.add('open');
    } else {
      btn.classList.remove('open');
      btn.closest('.br-card').querySelector('.card-detail').classList.remove('open');
    }
  });
  const hdrBtn=document.querySelector('#hdr-actions button');
  if(hdrBtn) hdrBtn.textContent=allExpanded?'Colapsar todo':'Expandir todo';
}

function exportCsv(){
  const rows=[['id','dominio','titulo','estado','tags','datasets']];
  RULES.forEach(r=>{
    rows.push([
      r.id,
      r.dom,
      '"'+r.title.replace(/"/g,'""')+'"',
      r.status,
      '"'+(r.tags||[]).join('|')+'"',
      '"'+(r.datasets||[]).join('|')+'"'
    ]);
  });
  const csv=rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='business-rules-s500.csv';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Init
buildSidebar();
renderCards();
applyFilters();
</script>
</body>
</html>
