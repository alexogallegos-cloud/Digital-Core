openapi: "3.1.0"

info:
  title: "GL Account Service"
  version: "0.1.0-seed"
  summary: "API del libro mayor general — modernización S151 Banamex"
  description: |
    Contrato sembrado desde el Gemelo Cognitivo GemCog v2.2.

    **Bounded Context**: BC-05 General Ledger
    **Sistema origen**: S151 (Unisys ClearPath MCP · COBOL + ALGOL)
    **Wave de transpilación**: Wave 2

    Expone las operaciones del libro mayor GL de Banamex:
    saldos contables, libros contables, claves de trayectoria,
    posición financiera y control del lote diario.

    **NO incluye**: posteo de asientos GL — eso es BC-04 GL-Posting-Service
    (Specialist - Encapsulation, Wave 0).
    **NO incluye**: movimientos diarios (BD10MOVDIA151) — eso es BC-06.
    **NO incluye**: ajustes contables — eso es BC-09.

    **Colisiones resueltas en este BC**:
    - SALDO S151 → `SaldoContable` ≠ `SaldoCuenta` (BC-01). Ver UL §3.1.
    - CONTROL S151 → `ControlLoteGL` ≠ `ControlBatchCaptacion` (BC-02). Ver UL §3.2.
    - LOTE S151 → `ProcesoDiarioGL` ≠ `CierreBatchCaptacion` (BC-01). Ver UL §3.4.

x-gemcog-source:
  sistema: "S151"
  bounded_context: "BC-05"
  bc_name: "General Ledger"
  vocab_version: "v2.2"
  capa: 6
  programas_origen:
    - "S151/P050 (ADSALDOS 15K LOC — online más grande S151)"
    - "S151/P052 (ACCIVAL 13K LOC — acumulación/validación saldos)"
    - "S151/P109 (cierre diario principal 19K LOC · Flag CNBV)"
    - "S151/P130 (Concentrador GL 13K LOC)"
    - "S151/P199 (Migración saldos S500 2.7K LOC)"
    - "S151/L040 (TOTXCVETRA COBOL 4.1K LOC)"
    - "S151/L011 (Consulta BD10 ALGOL 7.2K LOC · CRONOS2K · Flag CNBV)"
    - "S151/L030 (mayor librería COBOL 19.2K LOC · BD10MOVDIA151)"
  equivalencia_objetivo: "≥ 99.99%"
  notas:
    - "P109 es el mayor batch (19K LOC), Flag CNBV — Wave 2 con revisión humana obligatoria."
    - "L011 tiene CRONOS2K — revisar lógica de fechas antes de cutover."
    - "DISEÑO-GENERICO S151: L030 y P015 son 1 componente instanciado 19 veces (19 sistemas). Requiere ADR antes de implementar en target."

servers:
  - url: "http://localhost:8085"
    description: "Local dev"
  - url: "https://api-dev.banamex-internal.mx/gl/v0"
    description: "DEV"

tags:
  - name: "cuentas-gl"
    description: "Cuentas del libro mayor general"
  - name: "saldos-contables"
    description: "Saldos contables por cuenta GL"
  - name: "libros-contables"
    description: "Libros contables (catálogo MC001)"
  - name: "claves-trayectoria"
    description: "Claves de trayectoria contable (CVETRA)"
  - name: "posicion-financiera"
    description: "Posición financiera multi-sistema (BD13BIFIN)"
  - name: "proceso-diario"
    description: "Control del proceso diario GL (batch S151)"

paths:

  # ── Cuentas GL ─────────────────────────────────────────────────────────────

  /cuentas-gl:
    get:
      operationId: "listarCuentasGL"
      summary: "Listar cuentas del libro mayor"
      tags: ["cuentas-gl"]
      parameters:
        - name: "libro"
          in: "query"
          required: false
          schema:
            type: string
        - name: "page"
          in: "query"
          schema:
            type: integer
            default: 0
        - name: "size"
          in: "query"
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: "Lista de cuentas GL"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaCuentasGL"

  /cuentas-gl/{cuentaGL}:
    get:
      operationId: "consultarCuentaGL"
      summary: "Consultar una cuenta del libro mayor"
      tags: ["cuentas-gl"]
      description: |
        Devuelve los datos de una cuenta contable del GL.
        **Origen**: S151/P050 (ADSALDOS) · BD02ADSALDO
      x-gemcog-programa: "S151/P050"
      parameters:
        - name: "cuentaGL"
          in: "path"
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Datos de la cuenta GL"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuentaGL"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  # ── Saldos Contables ────────────────────────────────────────────────────────

  /cuentas-gl/{cuentaGL}/saldo-contable:
    get:
      operationId: "consultarSaldoContable"
      summary: "Consultar saldo contable de una cuenta GL"
      tags: ["saldos-contables"]
      description: |
        Devuelve el SaldoContable de una cuenta del libro mayor.

        **Colisión resuelta**: SALDO S151 → `SaldoContable` ≠ `SaldoCuenta` (BC-01).
        Ver ubiquitous-language-target.md §3.1.

        El `SaldoContable` refleja la posición en el libro mayor GL,
        actualizada por P052 (ACCIVAL) y el ciclo de cierre P109/P130.
        **Origen**: S151/P050 + P052 · BD02ADSALDO + BD11SDOS151
      x-regulatory-flags: ["CNBV"]
      x-gemcog-programa: "S151/P050"
      parameters:
        - name: "cuentaGL"
          in: "path"
          required: true
          schema:
            type: string
        - name: "fecha"
          in: "query"
          required: false
          schema:
            type: string
            format: date
          description: "Saldo a fecha específica (default: hoy)"
      responses:
        "200":
          description: "Saldo contable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaldoContable"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  # ── Libros Contables ────────────────────────────────────────────────────────

  /libros-contables:
    get:
      operationId: "listarLibrosContables"
      summary: "Listar libros contables (catálogo MC001)"
      tags: ["libros-contables"]
      description: |
        Devuelve los libros contables del catálogo MC001 de S151.
        **Origen**: BD12MC001S151
        **vocab**: BOOK → LibroContable (UL §4 BC-05)
      x-gemcog-programa: "S151/BD12MC001S151"
      responses:
        "200":
          description: "Lista de libros contables"
          content:
            application/json:
              schema:
                type: object
                properties:
                  libros:
                    type: array
                    items:
                      $ref: "#/components/schemas/LibroContable"

  /libros-contables/{idLibro}:
    get:
      operationId: "consultarLibroContable"
      summary: "Consultar un libro contable"
      tags: ["libros-contables"]
      parameters:
        - name: "idLibro"
          in: "path"
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Datos del libro contable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibroContable"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  # ── Claves de Trayectoria (CVETRA) ──────────────────────────────────────────

  /claves-trayectoria:
    get:
      operationId: "listarClavesTrayectoria"
      summary: "Listar claves de trayectoria contable"
      tags: ["claves-trayectoria"]
      description: |
        Devuelve el catálogo de claves de trayectoria (CVETRA).
        **Origen**: S151/L040 (TOTXCVETRA COBOL 4.1K LOC)
        **vocab**: CVETRA → ClaveTrayectoria (UL §4 BC-05)
      x-gemcog-programa: "S151/L040"
      responses:
        "200":
          description: "Catálogo de claves de trayectoria"
          content:
            application/json:
              schema:
                type: object
                properties:
                  claves:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClaveTrayectoria"

  /claves-trayectoria/{cvetra}/totales:
    get:
      operationId: "consultarTotalesPorCVETRA"
      summary: "Consultar totales agrupados por clave de trayectoria"
      tags: ["claves-trayectoria"]
      description: |
        Devuelve los totales de movimientos agrupados por CVETRA para el cierre diario.
        **Origen**: S151/L040 TOTXCVETRA
      x-regulatory-flags: ["CNBV"]
      x-gemcog-programa: "S151/L040"
      parameters:
        - name: "cvetra"
          in: "path"
          required: true
          schema:
            type: string
        - name: "fecha"
          in: "query"
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "Totales por CVETRA"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotalesCVETRA"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  # ── Posición Financiera (BD13BIFIN) ─────────────────────────────────────────

  /posicion-financiera:
    get:
      operationId: "consultarPosicionFinanciera"
      summary: "Consultar posición financiera multi-sistema"
      tags: ["posicion-financiera"]
      description: |
        Devuelve la posición financiera por sistema desde BD13BIFIN.
        **Origen**: S151/BD13BIFIN (B02POSICION) · L014
        **vocab**: POSICION → PosicionFinanciera (UL §4 BC-05)
        Incluye saldo inicial y final de cargos/abonos por sistema.
      x-gemcog-programa: "S151/L014 (B02POSICION)"
      parameters:
        - name: "sistema"
          in: "query"
          required: false
          schema:
            type: string
          description: "Filtrar por sistema (S500, C402, C600, S804, etc.)"
        - name: "fecha"
          in: "query"
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "Posición financiera"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosicionFinanciera"

  # ── Proceso Diario GL ────────────────────────────────────────────────────────

  /procesos-diario:
    get:
      operationId: "listarProcesosDiario"
      summary: "Listar historial de procesos diarios GL"
      tags: ["proceso-diario"]
      parameters:
        - name: "fechaDesde"
          in: "query"
          schema:
            type: string
            format: date
        - name: "fechaHasta"
          in: "query"
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "Historial de procesos diarios"
          content:
            application/json:
              schema:
                type: object
                properties:
                  procesos:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProcesoDiarioGL"

  /procesos-diario/{fecha}:
    get:
      operationId: "consultarProcesoDiario"
      summary: "Consultar estado del proceso diario GL"
      tags: ["proceso-diario"]
      description: |
        Devuelve el estado del Proceso Diario (PD) de cierre GL.
        **Colisión resuelta**: LOTE S151 → ProcesoDiarioGL ≠ CierreBatchCaptacion (BC-01). UL §3.4.
        **Colisión resuelta**: CONTROL S151 → ControlLoteGL ≠ ControlBatchCaptacion (BC-02). UL §3.2.
        **Origen**: S151/LIBCONTROL · BD99CONTROL · WFL LOTE S151
      x-regulatory-flags: ["CNBV"]
      x-gemcog-programa: "S151/LIBCONTROL BD99CONTROL"
      parameters:
        - name: "fecha"
          in: "path"
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "Estado del proceso diario GL"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcesoDiarioGL"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  /proceso-diario/trigger:
    post:
      operationId: "dispararProcesoDiario"
      summary: "Disparar el proceso diario GL"
      tags: ["proceso-diario"]
      description: |
        Inicia el cierre diario contable del GL (WFL LOTE S151 / PD).
        Operación privilegiada — solo operaciones autorizadas.
        Secuencia: P005 → P130 → P131 → P150/P151 → P158 → P109 → P199.
      x-regulatory-flags: ["CNBV"]
      security:
        - BearerAuth: ["ops:gl:proceso-diario:trigger"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerProcesoDiarioRequest"
      responses:
        "202":
          description: "Proceso diario iniciado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcesoDiarioGL"
        "409":
          description: "Proceso diario ya en ejecución para esa fecha"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /proceso-diario/reproceso:
    post:
      operationId: "forzarReprocesoDiario"
      summary: "Forzar reproceso del proceso diario GL"
      tags: ["proceso-diario"]
      description: |
        Ejecuta el PD ya corrido, saltando validaciones de doble ejecución.
        **Colisión resuelta**: FORZA S151 → ReprocesoForzadoGL ≠ ReprocesoForzadoCaptacion (BC-02). UL §3.5.
        ⚠ Operación regulatoria CNBV — bitácora de auditoría obligatoria.
      x-regulatory-flags: ["CNBV"]
      security:
        - BearerAuth: ["ops:gl:reproceso"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReprocesoForzadoGLRequest"
      responses:
        "202":
          description: "Reproceso forzado iniciado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcesoDiarioGL"
        "403":
          description: "Scope insuficiente"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:

  responses:
    NoEncontrado:
      description: "Recurso no encontrado"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    ImporteMonetario:
      type: string
      pattern: "^[0-9]+\\.[0-9]{4}$"
      description: "Importe monetario como string con 4 decimales (BigDecimal backend)"

    CuentaGL:
      type: object
      description: "Cuenta del libro mayor general"
      required: ["cuentaGL", "descripcion", "libro"]
      properties:
        cuentaGL:
          type: string
        descripcion:
          type: string
        libro:
          type: string
          description: "Libro contable al que pertenece"
        moneda:
          type: string
          enum: ["MXN", "USD"]
        activa:
          type: boolean
      # [GEMCOG-SOURCE: S151/BD02ADSALDO · vocab: CONTABILIDAD]

    SaldoContable:
      type: object
      description: |
        Saldo contable GL.
        COLISIÓN RESUELTA: SALDO S151 → SaldoContable ≠ SaldoCuenta (BC-01).
        Ver ubiquitous-language-target.md §3.1.
      required: ["cuentaGL", "saldoAcumulado", "moneda", "fecha"]
      properties:
        cuentaGL:
          type: string
        saldoAcumulado:
          $ref: "#/components/schemas/ImporteMonetario"
        saldoPeriodo:
          $ref: "#/components/schemas/ImporteMonetario"
          description: "Saldo del período (BD11SDOS151)"
        moneda:
          type: string
          enum: ["MXN", "USD"]
        fecha:
          type: string
          format: date
        sistema:
          type: string
          description: "Sistema origen del saldo (S500, C402, etc.)"
      # [GEMCOG-SOURCE: S151/P050 P052 · BD02ADSALDO BD11SDOS151 · vocab: SALDO (S151)]

    LibroContable:
      type: object
      description: "Libro contable del catálogo MC001"
      required: ["idLibro", "descripcion"]
      properties:
        idLibro:
          type: string
        descripcion:
          type: string
        tipo:
          type: string
      # [GEMCOG-SOURCE: S151/BD12MC001S151 · vocab: BOOK]

    ClaveTrayectoria:
      type: object
      description: "Clave de trayectoria contable (CVETRA)"
      required: ["cvetra", "descripcion"]
      properties:
        cvetra:
          type: string
        descripcion:
          type: string
          description: "Tipo de asiento GL: par débito/crédito"
        sistema:
          type: string
      # [GEMCOG-SOURCE: S151/L040 TOTXCVETRA · vocab: CVETRA]

    TotalesCVETRA:
      type: object
      properties:
        cvetra:
          type: string
        fecha:
          type: string
          format: date
        totalDebito:
          $ref: "#/components/schemas/ImporteMonetario"
        totalCredito:
          $ref: "#/components/schemas/ImporteMonetario"
        cantidadMovimientos:
          type: integer

    PosicionFinanciera:
      type: object
      description: |
        Posición financiera por sistema (BD13BIFIN/B02POSICION).
        vocab: POSICION → PosicionFinanciera
      properties:
        fecha:
          type: string
          format: date
        posiciones:
          type: array
          items:
            type: object
            required: ["sistema", "saldoInicial", "saldoFinal", "estadoEnvio"]
            properties:
              sistema:
                type: string
              csi:
                type: string
              producto:
                type: string
              moneda:
                type: string
              saldoInicial:
                $ref: "#/components/schemas/ImporteMonetario"
              saldoFinal:
                $ref: "#/components/schemas/ImporteMonetario"
              cantidadCargos:
                type: integer
              cantidadAbonos:
                type: integer
              estadoEnvio:
                type: string
                enum: ["NO_ENVIADO", "ENVIADO"]
                description: "STA-ENVIO: 0=NO_ENVIADO, 1=ENVIADO"
      # [GEMCOG-SOURCE: S151/L014 B02POSICION · BD13BIFIN · vocab: POSICION, BIFIN]

    ProcesoDiarioGL:
      type: object
      description: |
        Estado del Proceso Diario GL (PD = Proceso Diario).
        COLISIÓN RESUELTA: LOTE S151 → ProcesoDiarioGL · CONTROL S151 → ControlLoteGL.
        Ver UL §3.2, §3.4.
      required: ["fechaProceso", "estado", "ultimaActualizacion"]
      properties:
        fechaProceso:
          type: string
          format: date
        estado:
          type: string
          enum: ["PENDIENTE", "EN_EJECUCION", "COMPLETADO", "ERROR", "REPROCESO"]
        pasoActual:
          type: string
          description: "Paso WFL LOTE activo: P005, P130, P131, P150, P151, P158, P109, P199"
        ultimaActualizacion:
          type: string
          format: date-time
        errorDetalle:
          type: string
        estadisticas:
          type: object
          properties:
            totalMovimientos:
              type: integer
            totalSistemasIntegrados:
              type: integer
              description: "Número de sistemas que reportaron al GL (máx 19)"
      # [GEMCOG-SOURCE: S151/LIBCONTROL · BD99CONTROL · vocab: CONTROL(S151), LOTE(S151), PD]

    TriggerProcesoDiarioRequest:
      type: object
      required: ["fechaProceso"]
      properties:
        fechaProceso:
          type: string
          format: date
        forzado:
          type: boolean
          default: false

    ReprocesoForzadoGLRequest:
      type: object
      required: ["fechaProceso", "motivoReproceso"]
      properties:
        fechaProceso:
          type: string
          format: date
        motivoReproceso:
          type: string
          minLength: 20
          description: "Justificación para bitácora de auditoría CNBV"
        idAutorizacion:
          type: string
      # [GEMCOG-SOURCE: S151/FORZA flag · vocab: FORZA (colisión resuelta UL §3.5)]

    PaginaCuentasGL:
      type: object
      properties:
        contenido:
          type: array
          items:
            $ref: "#/components/schemas/CuentaGL"
        paginaActual:
          type: integer
        totalPaginas:
          type: integer
        totalElementos:
          type: integer

    ErrorResponse:
      type: object
      required: ["codigo", "mensaje", "timestamp"]
      properties:
        codigo:
          type: string
        mensaje:
          type: string
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
