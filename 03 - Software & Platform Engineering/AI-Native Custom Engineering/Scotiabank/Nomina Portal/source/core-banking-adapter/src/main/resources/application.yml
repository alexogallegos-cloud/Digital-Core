# =============================================================================
# Core Banking Adapter · SPE-ANCE-003 · perfil mock
# Stub determinista. nomina-api lo consume en http://localhost:8081
# =============================================================================
spring:
  application:
    name: core-banking-adapter
  threads:
    virtual:
      enabled: true

server:
  port: 8081

# Parametros del stub (deterministas para el mock)
corebanking:
  stub:
    # Saldo disponible fijo devuelto por consultarSaldo (alto para no bloquear dispersiones demo)
    saldo-disponible: "100000000.00"
    # Prefijo de CLABE sintetica generada al abrir cuenta (placeholder de banco)
    clabe-prefijo: "0440000"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    mx.scotiabank.nomina.corebanking: DEBUG
  # NUNCA loguear CLABE ni montos en claro.
