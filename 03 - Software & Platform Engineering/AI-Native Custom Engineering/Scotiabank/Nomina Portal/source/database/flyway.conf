# =============================================================================
# flyway.conf — Portal Empresas Nómina · Scotiabank México · SPE-ANCE-005
# Flyway CLI config para el mock local (SQL Server 2022).
# Sobre-escribir con variables de entorno / -D flags en QA/STG/PROD.
# NUNCA commitear credenciales reales: en no-mock usar FLYWAY_* env vars o vault.
# =============================================================================

# --- Conexión (mock local; ajustar host/puerto/DB según docker-compose) --------
flyway.url=jdbc:sqlserver://localhost:1433;databaseName=NominaPortal;encrypt=true;trustServerCertificate=true
flyway.user=sa
flyway.password=Local_Dev_Only_ChangeMe1

# --- Ubicación de migraciones (estructura Maven/Gradle estándar) ---------------
flyway.locations=filesystem:src/main/resources/db/migration

# --- Convenciones --------------------------------------------------------------
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.defaultSchema=dbo
flyway.encoding=UTF-8

# --- Seguridad de migración ----------------------------------------------------
# baselineOnMigrate: false en greenfield (la DB arranca vacía).
flyway.baselineOnMigrate=false
# cleanDisabled: true SIEMPRE fuera de mock (evita DROP accidental del schema).
flyway.cleanDisabled=true
# validateOnMigrate: verifica checksums antes de aplicar.
flyway.validateOnMigrate=true
# outOfOrder: false — respeta el orden de versión estricto.
flyway.outOfOrder=false
