# =============================================================================
# SPEI Adapter · SPE-ANCE-006 · perfil mock
# Stub determinista. nomina-api lo consume en http://localhost:8082
# =============================================================================
spring:
  application:
    name: spei-adapter
  threads:
    virtual:
      enabled: true

server:
  port: 8082

# Parametros del stub (deterministas para el mock)
spei:
  stub:
    # Regla de rechazo: CLABE destino que termina en este sufijo es rechazada
    # (materializa TC-DISP-012 · dispersion rechazada por SPEI).
    sufijo-rechazo: "00"
    # Codigo de rechazo Banxico simulado para el caso de rechazo.
    codigo-rechazo: "07"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    mx.scotiabank.nomina.spei: DEBUG
  # NUNCA loguear CLABE destino ni importe en claro.
