# Data Contract — transaction
data_contract: transaction
version: 1.0.0
status: draft
domain: transaction
layer: gold
table: bank_gold.fact_transaction
owner: Data Steward - Deposits (FS-AM)
description: Movimientos de cuenta (BKKIT). Grano: movimiento. Alto volumen.

sources:
  - bank_silver.transaction      # de SAP BKKIT
  - bank_bronze.sap_tcurx        # decimales por moneda (conversion de monto)

schema:
  - name: account_sk    type: INT64
  - name: customer_sk   type: INT64
  - name: post_date     type: DATE
  - name: amount        type: NUMERIC  description: "NETWR/AMOUNT / 10^TCURX(currency) — NUNCA /100 fijo"
  - name: currency      type: STRING
  - name: dc_indicator  type: STRING   description: S=cargo H=abono

rules:
  - id: curr_tcurx
    desc: "amount = raw / POW(10, TCURX.CURRDEC[currency]). Trampa: JPY/CLP = 0 decimales."
  - id: dedup
    desc: dedup por (account_id, item_no) keep-first.
  - id: fk_validate
    desc: account_id debe existir en account; si no -> cuarentena.

sla:
  freshness: "< 1h post-source (CDC) para datos del día"
  completeness: ">= 99.5% de movimientos del periodo"

dq:
  - not_null: [amount, currency, post_date]
  - reconciliation: "SUM(amount) por moneda cuadra vs source aplicando TCURX (ver answer key)"
  - range: "amount outliers alertados, no eliminados"

pii: []
partition_by: post_date
cluster_by: customer_sk
consumers: [analytics, reporting regulatorio CNBV, agg_customer_balance]
