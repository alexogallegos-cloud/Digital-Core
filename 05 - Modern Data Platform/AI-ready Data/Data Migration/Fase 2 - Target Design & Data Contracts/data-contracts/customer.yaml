# Data Contract — customer (Customer 360)
data_contract: customer
version: 1.0.0
status: draft
domain: customer
layer: gold
table: bank_gold.dim_customer
owner: Data Steward - Customer (Banking)
description: >
  Golden record de cliente mastereado. SAP Business Partner es el system of record;
  el CRM enriquece (segmento, comercial) vía entity resolution. 1 fila por cliente.

sources:
  - bank_silver.party            # de SAP BUT000 (SoR)
  - bank_silver.crm_account      # enriquecimiento CRM

schema:
  - name: customer_sk      type: INT64    required: true   description: surrogate key
  - name: party_id         type: STRING   required: true   unique: true   description: business key (BUT000.PARTNER, ALPHA-stripped)
  - name: name             type: STRING   required: true
  - name: party_type       type: STRING                    description: 1=persona 2=organizacion
  - name: country          type: STRING   description: ISO-2
  - name: segment          type: STRING   description: del CRM si hubo match
  - name: crm_matched      type: BOOL
  - name: crm_account_ids  type: ARRAY<STRING>  description: cuentas CRM resueltas (merge de duplicados)
  - name: golden_record_source  type: STRING   description: "SAP+CRM | SAP-only"

rules:
  - id: entity_resolution
    desc: >
      Match exacto si crm_account.sap_partner_ref resuelve en BUT000; si no, fuzzy por
      (norm_name + country). Multiples cuentas CRM del mismo party -> merge a 1 golden record.
      Casos ambiguos -> revision de Data Steward (HITL). Ver ADR-MDP-MIG-003.
  - id: alpha_strip
    desc: party_id = ALPHA_strip(BUT000.PARTNER) antes de cualquier join.

sla:
  freshness: "< 4h post-source (batch diario); < 1h si CDC"
  completeness: "party_id 100% · name >= 99.5%"
  availability: ">= 99.5% mensual"

dq:
  - unique: [party_id]
  - not_null: [customer_sk, party_id, name]
  - referential: "toda account.party_id y loan.party_id existe en customer"

pii:
  - field: name      handling: tokenizacion + column-level security
  - field: country   handling: -
  retention: "CNBV 10 años; LFPDPPP aplicable"

consumers:
  - bank_gold.dim_account
  - bank_gold.fact_transaction
  - bank_gold.fact_loan
  - analytics / reporting regulatorio
  - "02 AI Enabled Enterprise (features de cliente)"
