version: 2
models:
  - name: dim_customer
    description: Customer 360 mastereado (SAP + entity resolution CRM).
    columns:
      - name: customer_sk
        tests: [not_null, unique]
      - name: party_id
        tests: [not_null, unique]
  - name: dim_account
    columns:
      - name: account_sk
        tests: [not_null, unique]
  - name: fact_transaction
    columns:
      - name: currency
        tests:
          - accepted_values: {values: ['MXN','USD','JPY','CLP']}
