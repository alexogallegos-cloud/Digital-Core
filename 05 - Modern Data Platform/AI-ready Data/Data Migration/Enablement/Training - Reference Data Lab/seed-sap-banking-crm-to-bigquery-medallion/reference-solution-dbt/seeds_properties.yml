version: 2
# Bronze = raw 1:1. STRING en columnas criticas para preservar ceros ALPHA,
# fechas DATS 'YYYYMMDD', montos en minor units y flags. El tipado ocurre en Silver.
seeds:
  - name: but000
    config:
      column_types: {MANDT: string, PARTNER: string, TYPE: string, NAME_ORG1: string, NAME_FIRST: string, NAME_LAST: string, LAND1: string, XDELE: string, CRDAT: string}
  - name: bkk_acct
    config:
      column_types: {MANDT: string, ACCT: string, PARTNER: string, PRODUCT: string, WAERS: string, OPEN_DATE: string, STATUS: string, LOEVM: string}
  - name: bkkit
    config:
      column_types: {MANDT: string, ACCT: string, ITEM_NO: string, POST_DATE: string, VALUT: string, AMOUNT: string, WAERS: string, DC_IND: string, TEXT: string}
  - name: vdarl
    config:
      column_types: {MANDT: string, DARLEHEN: string, PARTNER: string, PRINCIPAL: string, WAERS: string, RATE: string, START_DATE: string, TERM_MONTHS: string}
  - name: tcurx
    config:
      column_types: {CURRKEY: string, CURRDEC: string}
  - name: crm_account
    config:
      column_types: {id: string, account_name: string, country: string, city: string, segment: string, sap_partner_ref: string, is_active: string, created_at: string}
  - name: crm_opportunity
    config:
      column_types: {id: string, account_id: string, stage: string, amount: string, currency: string, close_date: string}
