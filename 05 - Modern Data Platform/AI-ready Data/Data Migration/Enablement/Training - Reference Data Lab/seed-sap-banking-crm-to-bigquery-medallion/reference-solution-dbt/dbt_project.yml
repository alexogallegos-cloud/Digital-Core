name: 'banking_sap_crm_medallion'
version: '0.1.0'
config-version: 2
profile: 'banking_medallion'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
# Los CSV de referencia del seed se cargan como dbt seeds (= capa Bronze raw).
seed-paths: ["../source/sap", "../source/crm"]

models:
  banking_sap_crm_medallion:
    silver:
      +materialized: table
      +schema: silver
    intermediate:
      +materialized: ephemeral
    gold:
      +materialized: table
      +schema: gold

seeds:
  banking_sap_crm_medallion:
    +schema: bronze
    +quote_columns: false
