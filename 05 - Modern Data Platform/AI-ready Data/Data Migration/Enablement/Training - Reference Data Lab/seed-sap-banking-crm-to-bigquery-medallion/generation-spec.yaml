# Generation Spec — seed-sap-banking-crm-to-bigquery-medallion
# Reference Data Lab (AI-ready Data · Digital Core)
# Caso: core bancario en SAP ECC (modulo Banking / FS) + un CRM generico,
# integrados en un medallion BigQuery con cliente mastereado (Customer 360).
# Reto estrella: ENTITY RESOLUTION SAP<->CRM (mismo cliente, sistemas distintos).
# Regenerar con: python generator/generate.py

system:
  name: BANKING-SAP-CRM-LATAM
  industry: banca
  sources:
    - id: sap_ecc_banking          # sistema de registro (system of record) bancario
      family: sap
      module: banking-fs           # FS: Business Partner + Deposits Mgmt + Loans (FS-CML)
      tables: [BUT000, BUT0BK, BKK_ACCT, BKKIT, VDARL, TCURX]
    - id: crm_generic              # CRM generico (NO SAP): 360 comercial
      family: crm
      tables: [crm_account, crm_contact, crm_opportunity]
  default_currency: MXN

target:
  platform: bigquery
  model: medallion
  dataset_bronze: bank_bronze
  dataset_silver: bank_silver
  dataset_gold:   bank_gold
  mastering: entity-resolution     # dim_customer mastereado = SAP (SoR) enriquecido con CRM

currencies:                        # moneda -> decimales (TCURX); JPY/CLP = 0 (trampa)
  MXN: 2
  USD: 2
  JPY: 0
  CLP: 0

volumes:
  real_customers: 300              # clientes "reales" (la verdad); base de la resolucion de entidad
  crm_coverage: 0.70               # fraccion de clientes reales presentes en el CRM
  crm_only_prospects: 40           # cuentas CRM sin contraparte SAP (prospectos)
  crm_duplicate_accounts: 25       # clientes reales con DOS cuentas CRM (problema MDM)
  crm_ref_populated: 0.55          # fraccion de cuentas CRM con sap_partner_ref correcto (match exacto)
  accounts_per_customer_avg: 1.7   # cuentas de deposito por cliente
  txns_per_account_avg: 12
  loans_fraction: 0.5              # fraccion de clientes con al menos un credito (FS-CML)

planted_dq_defects:
  sap_alpha_leading_zeros: true    # PARTNER/ACCT con ceros ALPHA; BKKIT.ACCT a veces sin ceros
  sap_invalid_dates: true          # DATS '00000000'
  sap_deletion_flags: true         # BUT000.XDELE / BKK_ACCT.LOEVM = 'X'
  sap_currency_decimal_trap: true  # JPY/CLP cargados como si tuvieran 2 decimales
  sap_referential_orphans: true    # BKKIT.ACCT inexistente; VDARL.PARTNER inexistente
  sap_null_mandatory: true         # BKK_ACCT.PARTNER vacio
  crm_country_inconsistent: true   # 'Mexico' / 'MX' / 'Mexico' (acentos) para el mismo pais
  crm_malformed_email: true        # email sin @ o con espacios
  crm_duplicate_accounts: true     # ver crm_duplicate_accounts
  crm_missing_ref: true            # sap_partner_ref nulo -> obliga fuzzy match por nombre+pais
  entity_resolution_fuzzy: true    # variantes de nombre ('S.A.' vs 'SA', mayusculas, acentos)

defect_density: 0.04

output:
  emit_answer_key: true
  emit_target_ddl: true
  format: csv
  seed: 73