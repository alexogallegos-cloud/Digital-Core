# Data Contract — account
data_contract: account
version: 1.0.0
status: draft
domain: account
layer: gold
table: bank_gold.dim_account
owner: Data Steward - Deposits (FS-AM)
description: Cuenta de depósito (BCA / Deposits Mgmt). FK a customer.

sources:
  - bank_silver.account          # de SAP BKK40/BKKIT family

schema:
  - name: account_sk    type: INT64    required: true
  - name: account_id    type: STRING   required: true   unique: true   description: ACCT ALPHA-stripped
  - name: customer_sk   type: INT64    required: true   description: FK -> dim_customer
  - name: product       type: STRING
  - name: currency      type: STRING   description: CUKY
  - name: open_date     type: DATE
  - name: status        type: STRING

rules:
  - id: fk_validate
    desc: account.party_id debe existir en customer; si no -> cuarentena (no entra a Gold).
  - id: filter_deleted
    desc: excluir cuentas con LOEVM='X'.

sla:
  freshness: "< 4h post-source"
  completeness: "account_id 100% · customer_sk 100% (post-quarantine)"

dq:
  - unique: [account_id]
  - not_null: [account_sk, account_id, customer_sk]
  - referential: "account.customer_sk existe en dim_customer"

pii: []
consumers: [bank_gold.fact_transaction, analytics]
