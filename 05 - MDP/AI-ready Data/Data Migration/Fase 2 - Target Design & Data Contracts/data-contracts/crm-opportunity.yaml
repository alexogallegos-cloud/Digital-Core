# Data Contract — crm_opportunity
data_contract: crm_opportunity
version: 1.0.0
status: draft
domain: commercial
layer: gold
table: bank_gold.fact_crm_opportunity
owner: Data Steward - Commercial (CRM)
description: Oportunidades comerciales del CRM, ligadas al cliente mastereado.

sources:
  - bank_silver.crm_opportunity
  - bank_gold.dim_customer       # via entity resolution (cuenta CRM -> party)

schema:
  - name: crm_opp_id    type: STRING   required: true   unique: true
  - name: customer_sk   type: INT64    description: "puede ser NULL si la cuenta CRM es prospecto sin SAP"
  - name: stage         type: STRING
  - name: amount        type: NUMERIC
  - name: currency      type: STRING
  - name: close_date    type: DATE

rules:
  - id: link_via_entity_resolution
    desc: customer_sk se resuelve via el crosswalk del contrato customer; crm_only -> NULL (prospecto).

sla:
  freshness: "< 12h post-source"
  completeness: "crm_opp_id 100%"

dq:
  - unique: [crm_opp_id]
  - accepted_values: {stage: [Prospecting, Proposal, Won, Lost]}

pii: []
consumers: [analytics comercial, 360 de cliente]
