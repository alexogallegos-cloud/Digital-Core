# Copiar a ~/.dbt/profiles.yml (o usar --profiles-dir .) y completar.
# Target BigQuery (el caso). Para correr local sin BQ, adaptar a dbt-duckdb.
banking_medallion:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: TU-GCP-PROJECT
      dataset: bank
      location: US
      threads: 4
      priority: interactive
