version: 2
models:
  - name: silver_party
    description: Business Partner conformado (SAP SoR). 1 fila por cliente no borrado.
    columns:
      - name: party_id
        tests: [not_null, unique]
  - name: silver_account
    columns:
      - name: account_id
        tests: [not_null, unique]
      - name: party_id
        tests:
          - not_null
          - relationships: {to: ref('silver_party'), field: party_id}
  - name: silver_transaction
    description: Movimientos deduplicados, FK validada, monto via TCURX.
    columns:
      - name: amount
        tests: [not_null]
      - name: currency
        tests:
          - accepted_values: {values: ['MXN','USD','JPY','CLP']}
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [account_id, item_no]
  - name: silver_loan
    columns:
      - name: party_id
        tests:
          - relationships: {to: ref('silver_party'), field: party_id}
  - name: silver_crm_account
    columns:
      - name: crm_id
        tests: [not_null, unique]
      - name: country
        tests:
          - accepted_values: {values: ['MX','US','CL']}
