# Generation Spec — seed-sap-to-bigquery-medallion
# Reference Data Lab (AI-ready Data · Digital Core)
# Genera un data estate SAP SD + master data de referencia y su modelo medallion target
# en BigQuery, con answer key (lineage + reglas + DQ + reconciliacion).
# Defaults marcados [SPEC]; ajustar y regenerar con: python generator/generate.py

system:
  name: SAP-SD-LATAM
  source_family: sap                 # [SPEC] sap | core-banking | seguros | retail
  schema: sd-plus-master             # SD (VBAK/VBAP) + master data (KNA1/MARA/MAKT) + check (TCURX)
  industry: retail                   # [SPEC] banca | seguros | retail | manufactura
  source_release: ecc-6.0            # convencion de nombres de tabla tipo ECC
  default_currency: MXN

target:
  platform: bigquery                 # [SPEC] bigquery | databricks | snowflake
  model: medallion
  dataset_bronze: sap_bronze
  dataset_silver: sap_silver
  dataset_gold:   sap_gold
  bronze: raw-1to1                   # ingestion cruda 1:1, todo STRING, conserva LOEKZ/MANDT
  silver: conformed-typed            # tipado, conformado, deduplicado, FK validadas
  gold:   dimensional                # dim_customer, dim_material, fact_sales_order_item, agg

volumes:
  customers: 200
  materials: 150
  orders: 1000
  order_items_per_order_avg: 3       # items por orden (distribucion 1..6)

currencies:                          # moneda -> decimales (replica TCURX); JPY/CLP = 0 decimales
  MXN: 2
  USD: 2
  EUR: 2
  JPY: 0
  CLP: 0

languages:                           # idiomas en MAKT (textos de material); canonico en silver = S
  - S                                # espanol (SPRAS='S')
  - E                                # ingles (SPRAS='E')
canonical_language: S

planted_dq_defects:                  # ver CLAUDE.md §4 — cada uno queda en planted-defects.md
  referential_orphans: true          # VBAP sin VBAK; VBAK sin KNA1; VBAP sin MARA
  duplicate_keys: true               # (MANDT,VBELN,POSNR) duplicado en VBAP
  invalid_dates: true                # ERDAT = '00000000'
  deletion_flags: true               # KNA1.LOEKZ / MARA.LVORM = 'X' (filtrar en silver)
  currency_decimal_mismatch: true    # monto JPY/CLP cargado como si tuviera 2 decimales
  null_mandatory: true               # VBAK.KUNNR o VBAP.NETWR vacio
  leading_zero_inconsistency: true   # MATNR con/sin ceros a la izquierda mezclados
  amount_outlier: true               # NETWR con magnitud absurda (range check)

defect_density: 0.03                 # fraccion objetivo de filas afectadas por defecto

output:
  emit_answer_key: true              # siempre true en este Lab
  emit_target_ddl: true              # DDL BigQuery por capa
  format: csv                        # [SPEC] csv | jsonl
  field_delimiter: ","
  seed: 42                           # semilla para reproducibilidad determinista