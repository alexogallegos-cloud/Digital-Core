openapi: 3.1.0
# =============================================================================
# Portal Empresas Nómina · Scotiabank México · SPE-ANCE-001
# Contrato ejecutable (contract-first) · seed de ADR-ANCE-002
# SME: Spec Design & Standards
# Cubre la ruta crítica (auth · empleados · nóminas · dispersión · cfdi).
# Los grupos restantes (empresas · centros-trabajo · registros · admin · dashboard)
# siguen IDÉNTICAS convenciones: operationId camelCase, additionalProperties:false,
# ejemplos por operación, errores RFC 9457, dinero como string-decimal, idempotencia.
# =============================================================================
info:
  title: Portal Empresas Nómina API
  version: 1.0.0
  description: |
    API B2B para que empresas clientes de Scotiabank México gestionen el ciclo de
    nómina bancaria: empleados, nóminas, dispersión vía SPEI y CFDI de nómina.

    Versioning: URI (`/api/v1`). Errores: RFC 9457 (Problem Details).
    Dinero: string-encoded decimal (nunca float). Idempotencia: header `Idempotency-Key`
    obligatorio en operaciones con efecto financiero.
  contact:
    name: Swarm SPE-ANCE-001 · dt-solution-architect
  license:
    name: Internal — Accenture MX / Scotiabank México

servers:
  - url: https://api-nomina.scotiabank.com.mx/api/v1
    description: Producción (placeholder — DATO-REQUERIDO)
  - url: https://api-nomina-qa.scotiabank.com.mx/api/v1
    description: QA
  - url: http://localhost:8080/api/v1
    description: Mock local

tags:
  - name: auth
    description: Autenticación y segundo factor (IAM propio en mock · OIDC en prod)
  - name: empleados
    description: Alta, consulta, actualización y baja de empleados
  - name: nominas
    description: Creación de nómina, carga y validación de layout
  - name: dispersiones
    description: Instrucción, autorización y seguimiento de dispersiones SPEI
  - name: cfdi
    description: Consulta y descarga de CFDI de nómina

security:
  - BearerAuth: []

# =============================================================================
# PATHS
# =============================================================================
paths:

  # ---------------------------------------------------------------- AUTH (M1)
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Autentica un usuario y emite un JWT (mock) / inicia OIDC (prod)
      security: []   # endpoint público
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              operador:
                value:
                  email: operador@empresa.mx
                  password: "Demo1234!"
      responses:
        '200':
          description: Autenticación exitosa (puede requerir 2FA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                requiere2fa:
                  value:
                    status: PENDING_2FA
                    challengeId: "chg_9a1b"
                    accessToken: null
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/2fa/verify:
    post:
      operationId: verify2fa
      tags: [auth]
      summary: Verifica el segundo factor y emite el JWT de sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorRequest'
            examples:
              codigo:
                value:
                  challengeId: "chg_9a1b"
                  code: "483920"
      responses:
        '200':
          description: 2FA válido — sesión emitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionToken'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ----------------------------------------------------------- EMPLEADOS (M4)
  /empleados:
    get:
      operationId: listEmpleados
      tags: [empleados]
      summary: Lista empleados de la empresa con filtros y paginación cursor
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: estadoCuenta
          in: query
          schema:
            $ref: '#/components/schemas/EstadoCuentaEmpleado'
        - name: q
          in: query
          description: Búsqueda por nombre, RFC o número de empleado
          schema:
            type: string
      responses:
        '200':
          description: Página de empleados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpleadoPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createEmpleado
      tags: [empleados]
      summary: Alta individual de un empleado (solicita apertura de cuenta nómina)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpleadoCreate'
            examples:
              alta:
                value:
                  numeroEmpleado: "E-00123"
                  nombres: "María"
                  primerApellido: "López"
                  segundoApellido: "García"
                  rfc: "LOGM900101ABC"
                  curp: "LOGM900101MDFPRR03"
                  genero: FEMENINO
                  nacionalidad: MEXICANA
                  estadoCivil: SOLTERO
                  fechaIngreso: "2026-01-15"
                  ingresoMensualNeto: "18500.00"
                  idCentroTrabajo: "5f1c-ct-01"
      responses:
        '201':
          description: Empleado registrado; apertura de cuenta en proceso
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleado'
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          $ref: '#/components/responses/BusinessRuleError'

  /empleados/{idEmpleado}:
    parameters:
      - $ref: '#/components/parameters/IdEmpleadoParam'
    get:
      operationId: getEmpleado
      tags: [empleados]
      summary: Detalle de un empleado (PII/PCI enmascarados según rol)
      responses:
        '200':
          description: Empleado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleado'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: bajaEmpleado
      tags: [empleados]
      summary: Baja lógica de un empleado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fechaEfectiva]
              properties:
                fechaEfectiva: { type: string, format: date }
      responses:
        '200':
          description: Empleado dado de baja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empleado'

  /empleados/carga-masiva:
    post:
      operationId: cargaMasivaEmpleados
      tags: [empleados]
      summary: Carga masiva de empleados desde archivo (Excel/TXT)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
                idCentroTrabajoDefault:
                  type: string
      responses:
        '202':
          description: Archivo aceptado; procesamiento asíncrono
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargaMasivaResultado'

  # ------------------------------------------------------------- NOMINAS (M6)
  /nominas:
    post:
      operationId: createNomina
      tags: [nominas]
      summary: Crea la cabecera de una nómina
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NominaCreate'
            examples:
              quincena:
                value:
                  tipo: QUINCENAL
                  periodoInicio: "2026-07-01"
                  periodoFin: "2026-07-15"
                  descripcion: "Primera quincena julio"
      responses:
        '201':
          description: Nómina creada en estado BORRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nomina'

  /nominas/{idNomina}/layout:
    parameters:
      - $ref: '#/components/parameters/IdNominaParam'
    post:
      operationId: cargarLayoutNomina
      tags: [nominas]
      summary: Carga el layout con los importes por empleado
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [archivo]
              properties:
                archivo: { type: string, format: binary }
      responses:
        '200':
          description: Layout cargado; usar /validar para verificar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nomina'

  /nominas/{idNomina}/validar:
    parameters:
      - $ref: '#/components/parameters/IdNominaParam'
    post:
      operationId: validarNomina
      tags: [nominas]
      summary: Valida el layout (CLABEs, importes, límites) y devuelve errores por fila
      responses:
        '200':
          description: Resultado de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidacionNomina'
              examples:
                conErrores:
                  value:
                    estado: LAYOUT_CARGADO
                    totalRenglones: 120
                    validos: 118
                    errores:
                      - fila: 3
                        campo: clabeDestino
                        mensaje: "CLABE inválida (dígito verificador)"
                      - fila: 57
                        campo: importe
                        mensaje: "Importe excede límite por empleado"

  /nominas/{idNomina}/resumen:
    parameters:
      - $ref: '#/components/parameters/IdNominaParam'
    get:
      operationId: getResumenNomina
      tags: [nominas]
      summary: Resumen previo a dispersar (total, empleados, saldo disponible)
      responses:
        '200':
          description: Resumen de nómina
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenNomina'

  # -------------------------------------------------------- DISPERSIONES (M6)
  /nominas/{idNomina}/dispersar:
    parameters:
      - $ref: '#/components/parameters/IdNominaParam'
    post:
      operationId: instruirDispersion
      tags: [dispersiones]
      summary: Instruye la dispersión de una nómina validada (irreversible)
      description: |
        Requiere 2FA y nómina en estado VALIDADA. Si el monto total supera el
        umbral de la empresa, la dispersión queda EN_AUTORIZACION (doble firma).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, code]
              properties:
                challengeId: { type: string }
                code: { type: string, description: "Código 2FA" }
                fechaProgramada:
                  type: string
                  format: date-time
                  description: Opcional; si se omite, dispersión inmediata
      responses:
        '202':
          description: Dispersión aceptada para procesamiento
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispersion'
        '409':
          description: Nómina no está en estado dispersable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/BusinessRuleError'

  /dispersiones/{idDispersion}/estado:
    parameters:
      - name: idDispersion
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getEstadoDispersion
      tags: [dispersiones]
      summary: Estado de la dispersión y detalle por empleado (polling)
      responses:
        '200':
          description: Estado de dispersión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispersionDetalle'

  # -------------------------------------------------------------- CFDI (M7)
  /cfdi:
    get:
      operationId: listCfdi
      tags: [cfdi]
      summary: Lista CFDI por empleado y periodo
      parameters:
        - name: idEmpleado
          in: query
          schema: { type: string, format: uuid }
        - name: periodo
          in: query
          schema: { type: string, example: "2026-07" }
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Página de CFDI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CfdiPage'

  /cfdi/{idCfdi}/xml:
    parameters:
      - name: idCfdi
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadCfdiXml
      tags: [cfdi]
      summary: Descarga el XML del CFDI
      responses:
        '200':
          description: XML del CFDI
          content:
            application/xml:
              schema: { type: string }

# =============================================================================
# COMPONENTS
# =============================================================================
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CursorParam:
      name: cursor
      in: query
      description: Cursor de paginación (opaco)
      schema: { type: string }
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave de idempotencia (UUID) para operaciones con efecto financiero
      schema: { type: string, format: uuid }
    IdEmpleadoParam:
      name: idEmpleado
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdNominaParam:
      name: idNomina
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Credenciales inválidas o token ausente/expirado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationError:
      description: Error de validación de formato (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            rfcInvalido:
              value:
                type: "https://api-nomina.scotiabank.com.mx/errors/validation"
                title: "Error de validación"
                status: 400
                detail: "El RFC no cumple la estructura SAT"
                errors:
                  - campo: rfc
                    mensaje: "RFC inválido"
    BusinessRuleError:
      description: Violación de regla de negocio (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            limiteExcedido:
              value:
                type: "https://api-nomina.scotiabank.com.mx/errors/business-rule"
                title: "Regla de negocio violada"
                status: 422
                detail: "El monto total excede el límite de dispersión de la empresa"
                code: RN-05

  schemas:

    # ---- Tipos base ----
    Money:
      type: string
      description: >
        Monto monetario como decimal codificado en string (nunca float).
        Formato: dígitos con punto decimal y 2 decimales. MXN por default.
      pattern: '^\d+\.\d{2}$'
      example: "18500.00"

    ProblemDetails:
      type: object
      description: Error conforme RFC 9457 (Problem Details)
      additionalProperties: true
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: "Código de regla de negocio (RN-xx)" }
        errors:
          type: array
          items:
            type: object
            properties:
              campo: { type: string }
              mensaje: { type: string }

    PageInfo:
      type: object
      properties:
        nextCursor: { type: string, nullable: true }
        total: { type: integer }

    # ---- Auth ----
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      properties:
        status:
          type: string
          enum: [AUTHENTICATED, PENDING_2FA]
        challengeId: { type: string, nullable: true }
        accessToken: { type: string, nullable: true }
    TwoFactorRequest:
      type: object
      additionalProperties: false
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code: { type: string }
    SessionToken:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: "Segundos (≤ 3600)" }
        rol:
          type: string
          enum: [ADMIN_EMPRESA, OPERADOR_NOMINA, AUDITOR, ADMIN_SCO]

    # ---- Enums de dominio ----
    EstadoCuentaEmpleado:
      type: string
      enum: [NO_INICIADA, EN_PROCESO, DOCUMENTADA, FINALIZADA, VINCULADA, BLOQUEADA, ELIMINADA]
    EstadoNomina:
      type: string
      enum: [BORRADOR, LAYOUT_CARGADO, VALIDADA, EN_AUTORIZACION, AUTORIZADA, DISPERSANDO, CONFIRMADA, RECHAZADA_PARCIAL, CANCELADA]
    EstadoDispersion:
      type: string
      enum: [PENDIENTE, PROCESANDO, CONFIRMADA, RECHAZADA_PARCIAL]
    EstadoMovimiento:
      type: string
      enum: [ENVIADO, CONFIRMADO, RECHAZADO]

    # ---- Empleado ----
    EmpleadoCreate:
      type: object
      additionalProperties: false
      required: [numeroEmpleado, nombres, primerApellido, rfc, curp, fechaIngreso, ingresoMensualNeto, idCentroTrabajo]
      properties:
        numeroEmpleado: { type: string }
        nombres: { type: string }
        primerApellido: { type: string }
        segundoApellido: { type: string }
        rfc:
          type: string
          pattern: '^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$'
        curp:
          type: string
          pattern: '^[A-Z]{4}\d{6}[HM][A-Z]{5}[A-Z0-9]{2}$'
        genero: { type: string, enum: [MASCULINO, FEMENINO] }
        nacionalidad: { type: string }
        estadoCivil: { type: string, enum: [SOLTERO, CASADO, OTRO] }
        fechaIngreso: { type: string, format: date }
        ingresoMensualNeto: { $ref: '#/components/schemas/Money' }
        idCentroTrabajo: { type: string }
    Empleado:
      type: object
      properties:
        idEmpleado: { type: string, format: uuid }
        numeroEmpleado: { type: string }
        nombreCompleto: { type: string }
        rfc: { type: string, description: "Enmascarado según rol" }
        curp: { type: string, description: "Enmascarado según rol" }
        clabe: { type: string, description: "PCI — enmascarado (últimos 6)" }
        numeroTarjeta: { type: string, description: "PCI — enmascarado (últimos 4)" }
        estadoCuenta: { $ref: '#/components/schemas/EstadoCuentaEmpleado' }
        idCentroTrabajo: { type: string }
    EmpleadoPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Empleado' }
        page: { $ref: '#/components/schemas/PageInfo' }

    CargaMasivaResultado:
      type: object
      properties:
        idCarga: { type: string, format: uuid }
        estado: { type: string, enum: [PROCESANDO, COMPLETADO] }
        totalRegistros: { type: integer }
        exitosos: { type: integer }
        conError: { type: integer }
        errores:
          type: array
          items:
            type: object
            properties:
              fila: { type: integer }
              campo: { type: string }
              mensaje: { type: string }

    # ---- Nómina ----
    NominaCreate:
      type: object
      additionalProperties: false
      required: [tipo, periodoInicio, periodoFin]
      properties:
        tipo: { type: string, enum: [SEMANAL, QUINCENAL, MENSUAL, EXTRAORDINARIA] }
        periodoInicio: { type: string, format: date }
        periodoFin: { type: string, format: date }
        descripcion: { type: string }
    Nomina:
      type: object
      properties:
        idNomina: { type: string, format: uuid }
        tipo: { type: string }
        periodoInicio: { type: string, format: date }
        periodoFin: { type: string, format: date }
        estado: { $ref: '#/components/schemas/EstadoNomina' }
        montoTotal: { $ref: '#/components/schemas/Money' }
        totalEmpleados: { type: integer }
    ValidacionNomina:
      type: object
      properties:
        estado: { $ref: '#/components/schemas/EstadoNomina' }
        totalRenglones: { type: integer }
        validos: { type: integer }
        errores:
          type: array
          items:
            type: object
            properties:
              fila: { type: integer }
              campo: { type: string }
              mensaje: { type: string }
    ResumenNomina:
      type: object
      properties:
        idNomina: { type: string, format: uuid }
        totalEmpleados: { type: integer }
        montoTotal: { $ref: '#/components/schemas/Money' }
        saldoDisponibleOrigen: { $ref: '#/components/schemas/Money' }
        fondosSuficientes: { type: boolean }

    # ---- Dispersión ----
    Dispersion:
      type: object
      properties:
        idDispersion: { type: string, format: uuid }
        idNomina: { type: string, format: uuid }
        estado: { $ref: '#/components/schemas/EstadoDispersion' }
        montoDispersado: { $ref: '#/components/schemas/Money' }
        referenciaInterna: { type: string }
        fechaInstruccion: { type: string, format: date-time }
    DispersionDetalle:
      allOf:
        - $ref: '#/components/schemas/Dispersion'
        - type: object
          properties:
            movimientos:
              type: array
              items: { $ref: '#/components/schemas/MovimientoDispersion' }
    MovimientoDispersion:
      type: object
      properties:
        idEmpleado: { type: string, format: uuid }
        importe: { $ref: '#/components/schemas/Money' }
        clabeDestino: { type: string, description: "PCI — enmascarado" }
        estado: { $ref: '#/components/schemas/EstadoMovimiento' }
        referenciaSPEI: { type: string, description: "Clave de rastreo 18 dígitos" }
        codigoRechazoBanxico: { type: string, nullable: true }

    # ---- CFDI ----
    Cfdi:
      type: object
      properties:
        idCfdi: { type: string, format: uuid }
        idEmpleado: { type: string, format: uuid }
        uuidSAT: { type: string }
        estadoTimbrado: { type: string, enum: [PENDIENTE, TIMBRADO, ERROR] }
        codigoErrorSAT: { type: string, nullable: true }
        fechaTimbrado: { type: string, format: date-time, nullable: true }
    CfdiPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Cfdi' }
        page: { $ref: '#/components/schemas/PageInfo' }
