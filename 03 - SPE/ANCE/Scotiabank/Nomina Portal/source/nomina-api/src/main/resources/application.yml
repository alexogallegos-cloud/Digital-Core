# =============================================================================
# Portal Empresas Nomina · Scotiabank Mexico · SPE-ANCE-002 (Nomina API)
# Perfil por defecto: mock. Config 12-factor: todo secreto/URL via env var.
# =============================================================================
spring:
  application:
    name: nomina-api
  profiles:
    default: mock

  # --- Java 21 Virtual Threads (Project Loom) · NO negociable ---------------
  threads:
    virtual:
      enabled: true

  # --- Datasource SQL Server 2022 (SPE-ANCE-005) ----------------------------
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=nomina;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:nomina_app}
    password: ${DB_PASSWORD:NominaMock#2026!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      # El schema y las migraciones los gobierna Flyway (modulo database/). Nunca ddl-auto=update en banca.
      ddl-auto: validate
      naming:
        # Preserva PascalCase de los @Table(name=...) sin convertir a snake_case.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: America/Mexico_City
        dialect: org.hibernate.dialect.SQLServerDialect

  # --- Flyway · las migraciones viven en el modulo database/ (SPE-ANCE-005) --
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # --- Resource Server · el JwtDecoder se define en SecurityConfig (bean) ----
  # En mock: NimbusJwtDecoder HS256 con secreto de auth.jwt.secret.
  # En prod: reemplazar por issuer-uri OIDC del IdP Scotiabank (una linea de config,
  #          sin tocar controllers ni @PreAuthorize · ADR-ANCE-004).
  #   security.oauth2.resourceserver.jwt.issuer-uri: https://idp.scotiabank.com.mx/...

server:
  port: 8080
  forward-headers-strategy: framework   # respeta X-Forwarded-* tras el gateway/portal

# --- IAM propio del mock (ADR-ANCE-004) --------------------------------------
auth:
  jwt:
    # HS256. Secreto >= 32 bytes. En mock viene de env; en prod NO existe (OIDC).
    secret: ${AUTH_JWT_SECRET:mock-development-secret-change-me-please-32b}
    issuer: nomina-portal-mock
    # Expiracion <= 1h (requisito de seguridad bancaria · dt-security-engineer)
    ttl-seconds: ${AUTH_JWT_TTL:3600}

# --- Adaptadores externos (stubs en mock) ------------------------------------
integration:
  core-banking:
    base-url: ${CORE_BANKING_URL:http://localhost:8081}
  spei:
    base-url: ${SPEI_URL:http://localhost:8082}

# --- Idempotencia · TTL de claves de operaciones con efecto financiero -------
idempotency:
  ttl-hours: 24

# --- Reglas de negocio · valores default de mock (en prod vienen de Empresa) -
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    mx.scotiabank.nomina: DEBUG
  # NUNCA loguear CLABE/RFC/CURP/tarjeta/importe en texto claro (MaskingUtil).
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} traceId=%X{traceId} - %msg%n"
