# Nginx del frontend · sirve la SPA Angular y proxya /api al nomina-api.
server {
    listen 80;
    server_name _;

    # Seguridad basica de headers (el embebido en el portal existente ajusta CSP/X-Frame en prod).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # API -> nomina-api (nombre de servicio en la red de compose)
    location /api/ {
        proxy_pass http://nomina-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA · fallback a index.html para el router de Angular
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
