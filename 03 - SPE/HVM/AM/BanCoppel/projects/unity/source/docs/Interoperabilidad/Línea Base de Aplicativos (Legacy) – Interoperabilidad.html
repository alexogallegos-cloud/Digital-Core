const COLORS = {
  'Invertir (Innovar)':   { color: '#16a34a', bg: '#dcfce7', dot: '🟢' },
  'Tolerar (Mantener)':   { color: '#d97706', bg: '#fef3c7', dot: '🟡' },
  'Migrar (Transformar)': { color: '#2563eb', bg: '#dbeafe', dot: '🔵' },
  'Eliminar (Deprecar)':  { color: '#dc2626', bg: '#fee2e2', dot: '🔴' },
  'Sin Definir':          { color: '#6b7280', bg: '#f3f4f6', dot: '⚪' },
};

// Numeric sort: extracts leading number from "1.0 Seguridad" → 1.0
function numericPrefix(s) {
  const m = s.match(/^(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : Infinity;
}
function numericSort(arr) {
  return [...arr].sort((a, b) => numericPrefix(a) - numericPrefix(b));
}

// State
let selDominio    = null;
let selSubdominio = null;
let selCapacidad  = null;
let activeFilters = [];
let searchText    = '';

// Index arrays for safe lookup by position (avoids string-in-onclick issues)
const dominioIndex    = [];
const subdominioIndex = [];
const capacidadIndex  = [];

const allDominios = numericSort([...new Set(APPS.filter(a => a.dominio !== 'N/A').map(a => a.dominio))]);

function getFiltered() {
  return APPS.filter(a => {
    if (searchText) {
      const q = searchText;
      if (!a.name.toLowerCase().includes(q) && !a.desc.toLowerCase().includes(q) && !a.funcs.toLowerCase().includes(q)) return false;
    }
    if (activeFilters.length && !activeFilters.includes(a.estrategia)) return false;
    if (selDominio    !== null && a.dominio    !== selDominio)    return false;
    if (selSubdominio !== null && a.subdominio !== selSubdominio) return false;
    if (selCapacidad  !== null && a.capacidad  !== selCapacidad)  return false;
    return true;
  });
}

function render() {
  renderDominios();
  renderSubdominios();
  renderCapacidades();
  renderCards();
  renderBreadcrumb();
}

function renderDominios() {
  const el = document.getElementById('list-dominio');
  dominioIndex.length = 0;
  let html = `<div class="panel-item ${selDominio === null ? 'selected' : ''}" data-action="dominio" data-idx="-1" style="font-style:italic;color:#64748b">
    <span class="label">Todos</span><span class="badge">${APPS.length}</span></div>`;

  allDominios.forEach((d, i) => {
    dominioIndex.push(d);
    const cnt = APPS.filter(a => a.dominio === d
      && (!activeFilters.length || activeFilters.includes(a.estrategia))
      && (!searchText || a.name.toLowerCase().includes(searchText) || a.desc.toLowerCase().includes(searchText) || a.funcs.toLowerCase().includes(searchText))
    ).length;
    html += `<div class="panel-item ${selDominio === d ? 'selected' : ''}" data-action="dominio" data-idx="${i}">
      <span class="label">${escHtml(d)}</span><span class="badge">${cnt}</span></div>`;
  });
  el.innerHTML = html;
}

function renderSubdominios() {
  const el = document.getElementById('list-subdominio');
  if (selDominio === null) { el.innerHTML = '<div class="empty"><div class="empty-icon">👆</div>Selecciona un dominio</div>'; return; }

  const subs = numericSort([...new Set(APPS.filter(a => a.dominio === selDominio && a.subdominio !== 'N/A').map(a => a.subdominio))]);
  subdominioIndex.length = 0;
  if (!subs.length) { el.innerHTML = '<div class="empty">Sin sub-dominios</div>'; return; }

  const filtered = getFiltered();
  let html = '';
  subs.forEach((s, i) => {
    subdominioIndex.push(s);
    const cnt = filtered.filter(a => a.subdominio === s).length;
    html += `<div class="panel-item ${selSubdominio === s ? 'selected' : ''}" data-action="subdominio" data-idx="${i}">
      <span class="label" style="font-size:0.82rem">${escHtml(s)}</span><span class="badge">${cnt}</span></div>`;
  });
  el.innerHTML = html;
}

function renderCapacidades() {
  const el = document.getElementById('list-capacidad');
  if (selSubdominio === null) { el.innerHTML = '<div class="empty"><div class="empty-icon">👆</div>Selecciona un sub-dominio</div>'; return; }

  const caps = numericSort([...new Set(APPS.filter(a => a.subdominio === selSubdominio && a.capacidad !== 'N/A').map(a => a.capacidad))]);
  capacidadIndex.length = 0;
  if (!caps.length) { el.innerHTML = '<div class="empty">Sin capacidades</div>'; return; }

  const filtered = getFiltered();
  let html = '';
  caps.forEach((c, i) => {
    capacidadIndex.push(c);
    const cnt = filtered.filter(a => a.capacidad === c).length;
    html += `<div class="panel-item ${selCapacidad === c ? 'selected' : ''}" data-action="capacidad" data-idx="${i}">
      <span class="label" style="font-size:0.80rem">${escHtml(c)}</span><span class="badge">${cnt}</span></div>`;
  });
  el.innerHTML = html;
}

function renderCards() {
  const filtered = getFiltered();
  const el = document.getElementById('cards-grid');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🔍</div><p>No se encontraron aplicativos con los filtros actuales.</p></div>';
    return;
  }
  el.innerHTML = filtered.map(a => {
    const c = COLORS[a.estrategia] || COLORS['Sin Definir'];
    const funcsHtml = a.funcs ? a.funcs.split('\n').filter(l => l.trim()).slice(0, 12).map(escHtml).join('<br>') : 'Sin información';
    const descShort = a.desc.length > 180 ? a.desc.slice(0, 180) + '…' : a.desc;
    return `<div class="card">
      <div class="card-header">
        <div>
          <div class="card-name">${escHtml(a.name)}</div>
          ${a.short ? `<div class="card-short">${escHtml(a.short)}</div>` : ''}
        </div>
        <div class="semaforo" style="background:${c.bg};color:${c.color}">${c.dot} ${escHtml(a.estrategia)}</div>
      </div>
      <div class="card-desc">${escHtml(descShort) || 'Sin descripción'}</div>
      ${a.funcs ? `<div class="card-funcs"><div class="card-funcs-title">⚙️ Principales funciones</div>${funcsHtml}</div>` : ''}
    </div>`;
  }).join('');
}

function renderBreadcrumb() {
  const el = document.getElementById('breadcrumb');
  const cnt = getFiltered().length;
  let html = selDominio
    ? `<span class="bc-link" data-action="dominio" data-idx="-1">Todos</span> › <strong>${escHtml(selDominio)}</strong>`
    : `<strong>Todos los dominios</strong>`;
  if (selSubdominio) html += ` › <strong>${escHtml(selSubdominio)}</strong>`;
  if (selCapacidad)  html += ` › <strong>${escHtml(selCapacidad)}</strong>`;
  html += `<span class="cnt-badge">${cnt} aplicativos</span>`;
  el.innerHTML = html;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Event delegation
document.addEventListener('click', function(e) {
  const item = e.target.closest('[data-action]');
  if (!item) return;
  const action = item.dataset.action;
  const idx = parseInt(item.dataset.idx, 10);

  if (action === 'dominio') {
    const val = idx === -1 ? null : dominioIndex[idx];
    selDominio    = (selDominio === val) ? null : val;
    selSubdominio = null;
    selCapacidad  = null;
    if (idx === -1) selDominio = null;
    render();
  } else if (action === 'subdominio') {
    const val = subdominioIndex[idx];
    selSubdominio = (selSubdominio === val) ? null : val;
    selCapacidad  = null;
    render();
  } else if (action === 'capacidad') {
    const val = capacidadIndex[idx];
    selCapacidad = (selCapacidad === val) ? null : val;
    render();
  }
});

document.querySelectorAll('.legend-item[data-filter]').forEach(el => {
  el.addEventListener('click', function() {
    const f = this.dataset.filter;
    const i = activeFilters.indexOf(f);
    if (i >= 0) activeFilters.splice(i, 1); else activeFilters.push(f);
    this.classList.toggle('active', activeFilters.includes(f));
    render();
  });
});

document.getElementById('searchInput').addEventListener('input', function() {
  searchText = this.value.toLowerCase().trim();
  render();
});

render();
</script>
