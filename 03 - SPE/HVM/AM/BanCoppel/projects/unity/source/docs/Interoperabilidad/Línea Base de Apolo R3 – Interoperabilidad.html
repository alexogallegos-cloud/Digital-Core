","sol":"No identificado en Apolo R3","tipo":"N/A","estado":"❌ No identificado","ilv":"L1","obs":"Sin evidencia en documentación de arquitectura Apolo R3.","desc":"Shared document generation, capture, storage, retrieval and retention services supporting customer and regulatory documentation across all products.","area":"N/A"},{"niv":"3","pid":"10.5.1","es":"Generación y Composición de Documentos","en":"Document Generation & Composition","sol":"No identificado en Apolo R3","tipo":"N/A","estado":"❌ No identificado","ilv":"L2","obs":"Sin evidencia en documentación de arquitectura Apolo R3.","desc":"Template-driven generation of customer and regulatory documents from business events.","area":"N/A"},{"niv":"3","pid":"10.5.2","es":"Captura, Almacenamiento y Recuperación de Documentos","en":"Document Capture, Storage & Retrieval","sol":"No identificado en Apolo R3","tipo":"N/A","estado":"❌ No identificado","ilv":"L2","obs":"Sin evidencia en documentación de arquitectura Apolo R3.","desc":"Capture, indexing, secure storage and retrieval of documents with retention policy.","area":"N/A"},{"niv":"2","pid":"10.6","es":"Servicios de Control y Confianza","en":"Control & Trust Services","sol":"No identificado en Apolo R3","tipo":"N/A","estado":"❌ No identificado","ilv":"L1","obs":"Sin evidencia en documentación de arquitectura Apolo R3.","desc":"Shared control services applied across business journeys: approvals and authorisation hierarchies, and HSM-backed signing and verification of business instructions.","area":"N/A"},{"niv":"3","pid":"10.6.1","es":"Servicios de Aprobación","en":"Approvals Services","sol":"No identificado en Apolo R3","tipo":"N/A","estado":"❌ No identificado","ilv":"L2","obs":"Sin evidencia en documentación de arquitectura Apolo R3.","desc":"Interception of service execution for approval, evaluation of role and rule-based authorisation, and completion or rejection.","area":"N/A"},{"niv":"3","pid":"10.6.2","es":"Servicios de Firma y Verificación","en":"Signing & Verification Services","sol":"No identificado en Apolo R3","tipo":"N/A","estado":"❌ No identificado","ilv":"L2","obs":"Sin evidencia en documentación de arquitectura Apolo R3.","desc":"HSM-backed signing and verification of business instructions and documents as a shared service.","area":"N/A"},{"niv":"RESUMEN DE COBERTURA – Capacidades L2 (Procesos)","pid":"","es":"","en":"","sol":"","tipo":"","estado":"","ilv":"","obs":"","desc":"","area":""},{"niv":"✅ Cubierto","pid":"53","es":"29%","en":"","sol":"","tipo":"","estado":"","ilv":"","obs":"","desc":"","area":""},{"niv":"🟡 Parcial","pid":"39","es":"21%","en":"","sol":"","tipo":"","estado":"","ilv":"","obs":"","desc":"","area":""},{"niv":"🔵 Planificado","pid":"3","es":"2%","en":"","sol":"","tipo":"","estado":"","ilv":"","obs":"","desc":"","area":""},{"niv":"❌ No identificado","pid":"88","es":"48%","en":"","sol":"","tipo":"","estado":"","ilv":"","obs":"","desc":"","area":""}];
const l0s=DATA.filter(n=>n.niv==='1').sort((a,b)=>Number(a.pid)-Number(b.pid));
const l1s=DATA.filter(n=>n.niv==='2');
const l2s=DATA.filter(n=>n.niv==='3');

function pid2(pid){const p=pid.split('.');return p.slice(0,-1).join('.');}
function stk(e){
  if(!e||e.includes('No identificado')) return 'ni';
  if(e.includes('Cubierto')) return 'cu';
  if(e.includes('Parcial'))  return 'pa';
  return 'pl';
}
function stLabel(e){
  if(!e||e.includes('No identificado')) return '❌ No identificado';
  if(e.includes('Cubierto'))  return '✅ Cubierto';
  if(e.includes('Parcial'))   return '🟡 Parcial';
  return '🔵 Planificado';
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ── State ─────────────────────────────────── */
let selDom=null, selSub=null, selCap=null;
let activeFilters=[];
let searchQ='';

/* ── Parent helpers ─────────────────────────── */
function domOfSub(sub){ return l0s.find(d=>d.pid===pid2(sub.pid)); }
function subOfCap(cap){ return l1s.find(s=>s.pid===pid2(cap.pid)); }
function domOfCap(cap){ const s=subOfCap(cap); return s?domOfSub(s):null; }

/* ── Filter logic ───────────────────────────── */
function capVisible(cap){
  if(activeFilters.length && !activeFilters.includes(cap.estado)) return false;
  if(searchQ){
    const q=searchQ.toLowerCase();
    if(!cap.es.toLowerCase().includes(q)&&!cap.pid.toLowerCase().includes(q)
       &&!cap.sol.toLowerCase().includes(q)&&!cap.obs.toLowerCase().includes(q)) return false;
  }
  if(selSub!==null){return subOfCap(cap)?.pid===selSub;}
  if(selDom!==null){return domOfCap(cap)?.pid===selDom;}
  return true;
}

/* ── Stats helper ───────────────────────────── */
function stats(caps){
  const s={cu:0,pa:0,ni:0,pl:0};
  caps.forEach(c=>s[stk(c.estado)]++);
  return s;
}

/* ── Render panels ──────────────────────────── */
function renderAll(){
  renderDom(); renderSub(); renderCap(); renderCards(); renderBreadcrumb();
}

function renderDom(){
  const el=document.getElementById('list-dom');
  let h='';
  const all=l2s;
  const totalVis=selDom?l2s.filter(c=>domOfCap(c)?.pid===selDom).length:l2s.length;

  h+=`<div class="panel-item ${selDom===null&&selSub===null?'selected':''}" onclick="setDom(null)">
    <span class="label" style="font-style:italic;color:#64748b">Todos los dominios</span>
    <span class="badge">${l2s.length}</span></div>`;

  l0s.forEach(d=>{
    const cnt=l2s.filter(c=>domOfCap(c)?.pid===d.pid
      &&(!activeFilters.length||activeFilters.includes(c.estado))
      &&(!searchQ||c.es.toLowerCase().includes(searchQ)||c.pid.toLowerCase().includes(searchQ)||c.sol.toLowerCase().includes(searchQ))
    ).length;
    const sel=selDom===d.pid;
    h+=`<div class="panel-item ${sel?'selected':''}" onclick="setDom('${d.pid.replace(/'/g,"\\'")}')">
      <span class="pid-chip">${esc(d.pid)}</span>
      <span class="label" style="margin-left:6px">${esc(d.es)}</span>
      <span class="badge">${cnt}</span>
    </div>`;
  });
  el.innerHTML=h;
}

function renderSub(){
  const el=document.getElementById('list-sub');
  const pool = selDom ? l1s.filter(s=>domOfSub(s)?.pid===selDom) : l1s;
  let h='';
  if(!selDom){
    h='<div style="padding:20px 14px;font-size:.8rem;color:#94a3b8;text-align:center">Selecciona un dominio</div>';
    el.innerHTML=h; return;
  }
  pool.forEach(s=>{
    const cnt=l2s.filter(c=>subOfCap(c)?.pid===s.pid
      &&(!activeFilters.length||activeFilters.includes(c.estado))
      &&(!searchQ||c.es.toLowerCase().includes(searchQ)||c.pid.toLowerCase().includes(searchQ)||c.sol.toLowerCase().includes(searchQ))
    ).length;
    const sel=selSub===s.pid;
    h+=`<div class="panel-item ${sel?'selected':''}" onclick="setSub('${s.pid.replace(/'/g,"\\'")}')">
      <span class="pid-chip">${esc(s.pid)}</span>
      <span class="label" style="font-size:.8rem;margin-left:6px">${esc(s.es)}</span>
      <span class="badge">${cnt}</span>
    </div>`;
  });
  el.innerHTML=h||'<div style="padding:16px;font-size:.8rem;color:#94a3b8">Sin resultados</div>';
}

function renderCap(){
  const el=document.getElementById('list-cap');
  if(!selSub){
    el.innerHTML='<div style="padding:16px 14px;font-size:.8rem;color:#94a3b8;text-align:center">Selecciona un sub-dominio</div>';
    return;
  }
  const pool=l2s.filter(c=>subOfCap(c)?.pid===selSub);
  let h='';
  pool.forEach(c=>{
    const sk=stk(c.estado);
    const dotC={'cu':'#22c55e','pa':'#f59e0b','ni':'#ef4444','pl':'#3b82f6'}[sk];
    const sel=selCap===c.pid;
    h+=`<div class="panel-item ${sel?'selected':''}" onclick="setCap('${c.pid.replace(/'/g,"\\'")}')">
      <span class="pid-chip">${esc(c.pid)}</span>
      <span class="label" style="font-size:.78rem;margin-left:6px">${esc(c.es)}</span>
      <span class="st-dot" style="background:${dotC}"></span>
    </div>`;
  });
  el.innerHTML=h||'<div style="padding:16px;font-size:.8rem;color:#94a3b8">Sin resultados</div>';
}

function renderCards(){
  const el=document.getElementById('cards-grid');
  const sb=document.getElementById('summary-bar');
  const visibleL2=l2s.filter(capVisible);

  if(!visibleL2.length){
    el.innerHTML='<div class="empty-state" style="grid-column:1/-1"><div class="icon">🔍</div><p>No se encontraron capacidades con los filtros actuales.</p></div>';
    sb.innerHTML=''; return;
  }

  // Summary bar
  const st=stats(visibleL2);
  sb.innerHTML=`
    ${st.cu?`<span class="sum-chip sum-cu"><span class="sum-dot" style="background:#22c55e"></span>✅ Cubierto: <strong>${st.cu}</strong></span>`:''}
    ${st.pa?`<span class="sum-chip sum-pa"><span class="sum-dot" style="background:#f59e0b"></span>🟡 Parcial: <strong>${st.pa}</strong></span>`:''}
    ${st.pl?`<span class="sum-chip sum-pl"><span class="sum-dot" style="background:#3b82f6"></span>🔵 Planificado: <strong>${st.pl}</strong></span>`:''}
    ${st.ni?`<span class="sum-chip sum-ni"><span class="sum-dot" style="background:#ef4444"></span>❌ No identificado: <strong>${st.ni}</strong></span>`:''}
    <span style="font-size:.75rem;color:#94a3b8;margin-left:auto">${visibleL2.length} capacidades L2</span>`;

  const semCls={'cu':'sem-cu','pa':'sem-pa','ni':'sem-ni','pl':'sem-pl'};
  const hasSol=s=>s&&s!=='N/A'&&!s.startsWith('No identificado')&&!s.startsWith('No aplica');
  const isGap=o=>o&&(o.toLowerCase().startsWith('gap')||o.toLowerCase().includes('sin evidencia')||o.toLowerCase().includes('no se evidencia')||o.toLowerCase().includes('no identific'));

  let h='';
  visibleL2.forEach(c=>{
    const sk=stk(c.estado);
    const hlt=selCap===c.pid?' highlighted':'';
    const sol=hasSol(c.sol)?esc(c.sol):`<em style="color:#94a3b8">${esc(c.sol)}</em>`;
    const gapCls=isGap(c.obs)?'gap-box':'';
    h+=`<div class="card${hlt}" id="card-${c.pid.replace(/\./g,'-')}">
      <div class="card-head">
        <div class="card-titles">
          <div class="card-pid">${esc(c.pid)}</div>
          <div class="card-name">${esc(c.es)}</div>
          <div class="card-en">${esc(c.en)}</div>
        </div>
        <div class="semaforo ${semCls[sk]}">${stLabel(c.estado)}</div>
      </div>

      ${hasSol(c.sol)?`
      <div class="card-section">
        <div class="card-section-title">🔧 Componente / Solución Apolo R3</div>
        <div class="card-section-body">${esc(c.sol)}</div>
      </div>
      <div class="card-section">
        <div class="card-section-title">📦 Tipo de Componente</div>
        <div class="card-section-body">${esc(c.tipo)||'<em style=color:#94a3b8>N/A</em>'}</div>
      </div>`:`
      <div class="card-section">
        <div class="card-section-title">🔧 Componente / Solución Apolo R3</div>
        <div class="card-section-body empty">${esc(c.sol)}</div>
      </div>`}

      ${c.obs?`
      <div class="card-section">
        <div class="card-section-title">⚠️ Observaciones / GAP</div>
        <div class="card-section-body ${gapCls}">${esc(c.obs)}</div>
      </div>`:''}
    </div>`;
  });
  el.innerHTML=h;
}

function renderBreadcrumb(){
  const el=document.getElementById('breadcrumb');
  const visibleL2=l2s.filter(capVisible);
  let h=`<span class="bc-link" onclick="setDom(null)">Todos</span>`;
  if(selDom){
    const d=l0s.find(n=>n.pid===selDom);
    h+=` › <strong>${esc(d?.es||selDom)}</strong>`;
  }
  if(selSub){
    const s=l1s.find(n=>n.pid===selSub);
    h+=` › <strong>${esc(s?.es||selSub)}</strong>`;
  }
  if(selCap){
    const c=l2s.find(n=>n.pid===selCap);
    h+=` › <strong>${esc(c?.es||selCap)}</strong>`;
  }
  h+=`<span class="cnt-badge">${visibleL2.length} capacidades L2</span>`;
  el.innerHTML=h;
}

/* ── State setters ─────────────────────────── */
function setDom(pid){
  selDom=pid; selSub=null; selCap=null;
  renderAll();
}
function setSub(pid){
  selSub=pid; selCap=null;
  renderAll();
}
function setCap(pid){
  selCap=pid;
  renderCap(); renderCards(); renderBreadcrumb();
  // Scroll selected card into view
  setTimeout(()=>{
    const id='card-'+pid.replace(/\./g,'-');
    document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'center'});
  },60);
}

/* ── Legend filter ─────────────────────────── */
document.querySelectorAll('.legend-item').forEach(el=>{
  el.addEventListener('click',()=>{
    const f=el.dataset.filter;
    const idx=activeFilters.indexOf(f);
    if(idx>-1){activeFilters.splice(idx,1);el.classList.remove('active');}
    else{activeFilters.push(f);el.classList.add('active');}
    renderAll();
  });
});

/* ── Search ────────────────────────────────── */
document.getElementById('searchInput').addEventListener('input',e=>{
  searchQ=e.target.value.trim().toLowerCase();
  if(searchQ){selDom=null;selSub=null;selCap=null;}
  renderAll();
});

/* ── Init ──────────────────────────────────── */
renderAll();

</script>
</body>
</html>
