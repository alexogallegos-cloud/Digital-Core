<style>

 .wrap{max-width:1180px;margin:0 auto;padding:24px 22px 60px}

 h1{font-size:22px;font-weight:700;margin:0 0 3px;letter-spacing:-.01em}
 .sub{color:var(--muted);font-size:12.5px;margin:0 0 13px}
 .controls{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
 .grp{display:flex;align-items:center;gap:7px}
 .grp .lab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
 .lvbtns{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
 .lvbtns button{border:none;background:#fff;color:var(--ink);font-family:var(--mono);font-weight:600;font-size:12.5px;
  padding:7px 13px;cursor:pointer;border-right:1px solid var(--line)}
 .lvbtns button:last-child{border-right:none}
 .lvbtns button:hover{background:#F3F6FB}
 .lvbtns button.on{background:var(--accent);color:#fff}
 .lvbtns button:disabled{color:#C2C9D6;cursor:not-allowed;background:#FAFBFD}
 .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;color:var(--ink)}
 .btn:hover{background:#F3F6FB}
 .search{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;font-family:var(--sans);min-width:210px;color:var(--ink)}
 .search:focus{outline:2px solid var(--accent-s);border-color:var(--accent)}
 .legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:12px;font-size:11.5px;color:var(--muted)}
 .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
 .dot.base{background:var(--o-base)}.dot.hpb{background:var(--o-hpb)}.dot.pio{background:var(--o-pio)}.dot.grp{background:var(--o-grp)}

 .tree{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
 .node>.children{display:none}
 .node.open>.children{display:block}
 .children{margin-left:15px;border-left:1px solid #E7EBF2;padding-left:8px}
 .row{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:7px;cursor:default}
 .row:hover{background:#F5F7FB}
 .tog{width:18px;height:18px;flex:none;border:none;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--muted);font-size:11px;border-radius:4px}
 .tog:hover{background:#E6ECF5;color:var(--ink)}
 .tog.leaf{visibility:hidden;cursor:default}
 .chev{transition:transform .12s ease;font-family:var(--mono)}
 .node.open>.row .chev{transform:rotate(90deg)}
 .pid{font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:none;min-width:44px}
 .nm{font-size:13px}
 .cnt{font-family:var(--mono);font-size:9.5px;color:#9AA6BD;background:#EEF1F6;border-radius:20px;padding:1px 7px;flex:none}
 .row .dot{margin-left:auto}
 .node[data-lvl="1"]>.row{background:var(--accent-s);border-left:3px solid var(--accent);margin:6px 0 2px;padding:9px 10px}
 .node[data-lvl="1"]>.row .nm{font-weight:700;font-size:14.5px;color:var(--accent)}
 .node[data-lvl="1"]>.row .pid{min-width:40px}
 .node[data-lvl="2"]>.row .nm{font-weight:600}
 .node[data-lvl="3"]>.row .nm{font-size:12.5px}
 .node[data-lvl="4"]>.row .nm,.node[data-lvl="5"]>.row .nm{font-size:12px;color:#3A465E}
 .node.hit>.row{background:#FFF6E0}
 .node.hidden{display:none}
 .empty{color:var(--muted);font-style:italic;padding:6px 10px;font-size:12px}
 @media print{body{background:#fff;background-image:none}.tb{position:static;box-shadow:none}.node>.children{display:block}
  .tog{display:none}@page{size:A3 portrait;margin:10mm}}

const MAXLVL = 5, MAXPRESENT = 4;
const flat = {};
const treeEl = document.getElementById('tree');

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function build(node, parent){
  const el=document.createElement('div');
  el.className='node'; el.dataset.pid=node.pid; el.dataset.lvl=node.lvl;
  const hasCh=node.c && node.c.length>0;
  const row=document.createElement('div'); row.className='row';
  const tog=document.createElement('button'); tog.className='tog'+(hasCh?'':' leaf');
  tog.innerHTML='<span class="chev">▶</span>';
  if(hasCh) tog.addEventListener('click',(e)=>{e.stopPropagation();el.classList.toggle('open');});
  row.appendChild(tog);
  const pid=document.createElement('span'); pid.className='pid'; pid.textContent=node.pid; row.appendChild(pid);
  const nm=document.createElement('span'); nm.className='nm'; nm.textContent=node.name; row.appendChild(nm);
  if(hasCh){const c=document.createElement('span'); c.className='cnt'; c.textContent=node.c.length; row.appendChild(c);}
  const dot=document.createElement('span'); dot.className='dot '+node.o; row.appendChild(dot);
  if(hasCh) row.addEventListener('click',()=>el.classList.toggle('open'));
  el.appendChild(row);
  const ch=document.createElement('div'); ch.className='children';
  el.appendChild(ch);
  parent.appendChild(el);
  flat[node.pid]={el, node, hasCh, lvl:node.lvl, name:node.name.toLowerCase(), pid:node.pid};
  if(hasCh) node.c.forEach(k=>build(k,ch));
}
DATA.forEach(n=>build(n,treeEl));

function clearSearchMarks(){for(const p in flat){flat[p].el.classList.remove('hidden','hit');}}
function setLevel(k){
  document.getElementById('q').value='';
  clearSearchMarks();
  for(const p in flat){const f=flat[p]; if(f.hasCh && f.lvl < k) f.el.classList.add('open'); else f.el.classList.remove('open');}
  [...document.querySelectorAll('#lv button')].forEach(b=>b.classList.toggle('on', +b.dataset.k===k));
  updateStat();
}
function expandAll(){document.getElementById('q').value='';clearSearchMarks();
  for(const p in flat){if(flat[p].hasCh) flat[p].el.classList.add('open');}
  [...document.querySelectorAll('#lv button')].forEach(b=>b.classList.remove('on'));updateStat();}
function collapseAll(){setLevel(1);}
function updateStat(){
  let vis=0; for(const p in flat){if(flat[p].el.offsetParent!==null) vis++;}
  document.getElementById('stat').textContent=vis+' capacidades visibles';
}
function search(q){
  q=q.trim().toLowerCase();
  [...document.querySelectorAll('#lv button')].forEach(b=>b.classList.remove('on'));
  if(!q){clearSearchMarks(); setLevel(3); return;}
  function mark(node){
    const f=flat[node.pid];
    const self=f.name.includes(q)||f.pid.includes(q);
    let childHit=false;
    (node.c||[]).forEach(k=>{childHit = mark(k) || childHit;});
    const vis=self||childHit;
    f.el.classList.toggle('hidden',!vis);
    f.el.classList.toggle('hit',self);
    f.el.classList.toggle('open',childHit);
    return vis;
  }
  DATA.forEach(mark);
  updateStat();
}
// level buttons 1..MAXPRESENT (this model reaches L4)
const lv=document.getElementById('lv');
for(let k=1;k<=MAXPRESENT;k++){
  const b=document.createElement('button'); b.dataset.k=k; b.textContent='L'+k;
  b.addEventListener('click',()=>setLevel(k));
  lv.appendChild(b);
}
document.getElementById('expand').addEventListener('click',expandAll);
document.getElementById('collapse').addEventListener('click',collapseAll);
document.getElementById('q').addEventListener('input',e=>search(e.target.value));
setLevel(3);
