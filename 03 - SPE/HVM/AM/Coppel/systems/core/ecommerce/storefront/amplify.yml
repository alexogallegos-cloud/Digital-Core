version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
  environment:
    variables:
      AWS_REGION: us-east-1
      DYNAMODB_TABLE: coppel-products
# SSR: set platform to WEB_COMPUTE in Amplify console > App settings > General
# or via CLI: aws amplify update-app --app-id <id> --platform WEB_COMPUTE
