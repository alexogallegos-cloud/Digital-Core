<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pseudocódigo (Capa 0) — Enterprise Digital Brain LegacyCore</title>
<style>
:root{
  --red:#A100FF;--gold:#6CC5D8;--ink:#F0F8FA;
  --muted:#7fb8c8;--muted2:#5a98a8;
  --glass:rgba(255,255,255,.055);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;}
body{font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Calibri,sans-serif;
  font-size:14px;color:var(--ink);margin:0;background:#071c23;
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;}
.pbar{position:fixed;top:0;left:0;width:100%;height:3px;
  background:linear-gradient(90deg,var(--gold),#fff);z-index:300}
.aurora{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.aurora div{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;
  animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.a1{width:600px;height:600px;background:radial-gradient(circle,rgba(193,39,45,.45),transparent 70%);
  top:-10%;left:-5%;animation:f1 24s infinite}
.a2{width:500px;height:500px;background:radial-gradient(circle,rgba(108,197,216,.35),transparent 70%);
  bottom:5%;right:5%;animation:f2 28s infinite}
@keyframes f1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(60px,40px) scale(1.15)}}
@keyframes f2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-50px,30px) scale(1.1)}}
nav.sitenav{position:fixed;top:3px;left:0;width:100%;z-index:200;padding:9px 24px;
  display:flex;align-items:center;gap:16px;min-height:48px;
  background:rgba(7,28,35,.75);backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.07)}
.blogo{font-size:18px;font-weight:900;color:var(--red);padding:0 6px;
  background:rgba(193,39,45,.12);border-radius:6px;border:1px solid rgba(193,39,45,.3)}
.nt{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:.02em}
.sp{flex:1}
a.jump{color:var(--muted);font-size:13px;text-decoration:none;
  padding:4px 10px;border-radius:6px;transition:all .2s;white-space:nowrap}
a.jump:hover{color:var(--ink);background:var(--glass)}
/* app wrapper (debajo del nav fijo) */
.app-wrap{flex:1;display:flex;flex-direction:column;min-height:0;margin-top:54px;position:relative;z-index:1;}
.filters{flex-shrink:0;background:rgba(7,28,35,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(108,197,216,.14);padding:9px 24px;display:flex;flex-direction:column;gap:7px;}
.frow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.frow .flab{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  color:#7ca8b8;width:64px;flex-shrink:0;}
.fbtn{background:rgba(14,46,58,.7);color:#9dd8e0;border:1px solid rgba(108,197,216,.2);
  padding:5px 13px;border-radius:16px;font-size:12px;cursor:pointer;font-weight:600;}
.fbtn:hover{border-color:rgba(108,197,216,.5);background:rgba(26,69,85,.8);}
.fbtn.active{background:rgba(18,59,70,.9);color:var(--gold);border-color:var(--gold);}
.fbtn .n{opacity:.65;font-weight:400;margin-left:4px;}
#q{flex:1;min-width:170px;background:rgba(7,28,35,.6);border:1px solid rgba(108,197,216,.2);
  border-radius:8px;color:var(--ink);padding:7px 12px;font-size:12.5px;}
.count{font-size:11.5px;color:#7ca8b8;white-space:nowrap;}
.body{flex:1;display:flex;min-height:0;}
.list{width:282px;flex-shrink:0;border-right:1px solid rgba(108,197,216,.12);overflow-y:auto;
  padding:6px;background:rgba(8,32,42,.78);backdrop-filter:blur(10px);}
.item{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;
  border-radius:6px;padding:7px 10px;text-align:left;color:#dbe9ee;cursor:pointer;
  font-size:12.6px;font-family:Consolas,'Courier New',monospace;}
.item:hover{background:rgba(14,46,58,.8);}
.item.sel{background:rgba(18,59,70,.9);color:#fff;box-shadow:inset 3px 0 0 var(--gold);}
.item .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.item .sis{font-size:10px;color:#7ca8b8;margin-left:auto;font-family:inherit;}
.item.hidden{display:none;}
.detail{flex:1;min-width:0;position:relative;background:rgba(7,20,28,.4);
  display:flex;flex-direction:column;}
.dtoolbar{flex-shrink:0;display:none;align-items:center;gap:10px;padding:6px 12px;
  background:rgba(10,37,48,.85);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(108,197,216,.12);}
.dtoolbar .cur{margin-right:auto;font-size:12px;color:#9dd8e0;
  font-family:Consolas,'Courier New',monospace;font-weight:700;}
.dtoolbar .xbtn{background:rgba(18,59,70,.8);color:var(--gold);
  border:1px solid rgba(108,197,216,.35);border-radius:8px;padding:5px 13px;
  font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;}
.dtoolbar .xbtn:hover{background:rgba(23,80,94,.9);}
.detail iframe{flex:1;width:100%;border:none;}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;color:#7ca8b8;font-size:13px;text-align:center;padding:40px;gap:12px;}
.ph .big{font-size:34px;opacity:.6;}
</style>
</head><body>

  <div class="detail"><div class="dtoolbar" id="dtb"><span class="cur" id="cur"></span><a class="xbtn" id="xfull" href="#" target="_blank" rel="noopener" title="Abrir en pestaña nueva">&#9974; Pantalla completa</a></div><div class="ph" id="ph"><div class="big">&#128220;</div>Selecciona un componente de la lista para ver su pseudocódigo</div><iframe id="frame" style="display:none" title="Pseudocódigo del componente"></iframe></div>
</div>
</div>
<script>
(function(){
  var fsis="", fcat="", q=document.getElementById('q');
  var items=[].slice.call(document.querySelectorAll('.item'));
  var frame=document.getElementById('frame'), ph=document.getElementById('ph'), cnt=document.getElementById('cnt');
  var dtb=document.getElementById('dtb'), xfull=document.getElementById('xfull'), cur=document.getElementById('cur');
  function apply(){
    var v=(q.value||'').trim().toUpperCase(), n=0;
    items.forEach(function(it){
      var ok=(!fsis||it.dataset.sis===fsis)&&(!fcat||it.dataset.cat===fcat)&&(!v||it.dataset.id.indexOf(v)!==-1);
      it.classList.toggle('hidden',!ok); if(ok)n++;
    });
    cnt.textContent=n+' de '+items.length+' componentes';
  }
  function wire(sel,set){
    var b=[].slice.call(document.querySelectorAll(sel));
    b.forEach(function(x){x.addEventListener('click',function(){b.forEach(function(y){y.classList.toggle('active',y===x);});set(x);apply();});});
  }
  wire('.fbtn[data-sis]',function(x){fsis=x.dataset.sis;});
  wire('.fbtn[data-cat]',function(x){fcat=x.dataset.cat;});
  q.addEventListener('input',apply);
  items.forEach(function(it){it.addEventListener('click',function(){
    items.forEach(function(x){x.classList.toggle('sel',x===it);});
    frame.src=it.dataset.src; frame.style.display='block'; if(ph)ph.style.display='none';
    if(dtb)dtb.style.display='flex'; if(xfull)xfull.href=it.dataset.src; if(cur)cur.textContent=it.dataset.id;
  });});
  apply();
})();
</script>
