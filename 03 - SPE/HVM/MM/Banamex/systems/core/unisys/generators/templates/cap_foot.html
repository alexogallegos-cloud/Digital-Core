<script>
const K_{{SLUG_UPPER}}='sme-cap-{{SLUG}}-0811';
function makeR{{SLUG_UPPER}}(r){
  const tr=document.createElement("tr");
  ["fecha","sme","seccion","comentario","estado"].forEach(function(k){
    const td=document.createElement("td");
    td.contentEditable="true";td.textContent=r[k]||"";
    td.style.border="1px solid #1a4555";td.style.padding="6px 8px";td.style.verticalAlign="top";
    if(k!=="fecha"&&k!=="estado")td.style.minWidth="100px";
    td.oninput=save{{SLUG_UPPER}};tr.appendChild(td);
  });
  const tdx=document.createElement("td");
  tdx.style.cssText="border:1px solid #1a4555;padding:3px;text-align:center;vertical-align:middle;";
  const bx=document.createElement("button");
  bx.textContent="\u2715";bx.title="Eliminar esta fila";
  bx.style.cssText="background:#c62828;color:#fff;border:none;border-radius:3px;padding:1px 6px;cursor:pointer;font-size:13px;font-weight:700;line-height:1.4;";
  bx.onclick=function(){if(confirm("Eliminar esta fila?")){tr.remove();save{{SLUG_UPPER}}();}};
  tdx.appendChild(bx);tr.appendChild(tdx);return tr;
}
function addRow{{SLUG_UPPER}}(){
  const tb=document.getElementById("sme-tbody-{{SLUG_UPPER}}");
  tb.appendChild(makeR{{SLUG_UPPER}}({fecha:new Date().toISOString().slice(0,10),sme:"",seccion:"",comentario:"",estado:"PENDIENTE"}));
  save{{SLUG_UPPER}}();
}
function save{{SLUG_UPPER}}(){
  const data=[...document.getElementById("sme-tbody-{{SLUG_UPPER}}").rows].map(function(r){
    return{fecha:r.cells[0].textContent,sme:r.cells[1].textContent,
      seccion:r.cells[2].textContent,comentario:r.cells[3].textContent,estado:r.cells[4].textContent};
  });
  localStorage.setItem(K_{{SLUG_UPPER}},JSON.stringify(data));
}
function exportMD{{SLUG_UPPER}}(){
  const rows=[...document.getElementById("sme-tbody-{{SLUG_UPPER}}").rows];
  var md="## Comentarios SME -- {{CAPTITLE}}\n\n| Fecha | SME | Seccion | Comentario | Estado |\n|---|---|---|---|---|\n";
  rows.forEach(function(r){md+="| "+[...r.cells].slice(0,5).map(function(c){return c.textContent;}).join(" | ")+" |\n";});
  navigator.clipboard.writeText(md).then(function(){alert("Copiado al portapapeles");});
}
function exportTSV{{SLUG_UPPER}}(){
  const rows=[...document.getElementById("sme-tbody-{{SLUG_UPPER}}").rows];
  var t="Fecha\tSME\tSeccion\tComentario\tEstado\n";
  rows.forEach(function(r){t+=[...r.cells].slice(0,5).map(function(c){return c.textContent;}).join("\t")+"\n";});
  navigator.clipboard.writeText(t).then(function(){alert("TSV copiado");});
}
function clear{{SLUG_UPPER}}(){
  if(confirm("Borrar TODOS los comentarios?")){localStorage.removeItem(K_{{SLUG_UPPER}});document.getElementById("sme-tbody-{{SLUG_UPPER}}").innerHTML="";}
}
function load{{SLUG_UPPER}}(){
  try{
    const d=JSON.parse(localStorage.getItem(K_{{SLUG_UPPER}})||"[]");
    const tb=document.getElementById("sme-tbody-{{SLUG_UPPER}}");tb.innerHTML="";
    d.forEach(function(r){tb.appendChild(makeR{{SLUG_UPPER}}(r));});
    if(!tb.children.length)addRow{{SLUG_UPPER}}();
  }catch(e){}
}
load{{SLUG_UPPER}}();
</script>
<script>
(function(){
  if(document.querySelector('nav.gemcog-tabs')) return;
  var h2s = [].slice.call(document.querySelectorAll('h2[id]'));
  if(!h2s.length) return;
  var nav = document.createElement('nav');
  nav.className = 'gemcog-tabs';
  nav.setAttribute('aria-label','Secciones');
  var labels = {
    'ctx':'Contexto','inv':'Inventario','cas':'Casuisticas','seq':'Secuencia',
    'flujo':'Flujo','reg':'Reglas','hal':'Hallazgos',
    'm1':'Blast Radius','m2':'Vocabulario','m3':'Copybooks','m4':'Interfaces','sme':'SME'
  };
  var ampDone=false;
  h2s.forEach(function(h2){
    var id = h2.id;
    if(id.indexOf('amp-')===0){ if(ampDone) return; ampDone=true; }
    var btn = document.createElement('button');
    if(id.indexOf('amp-')===0){ btn.textContent='Ampliaciones'; btn.title='Ampliaciones por programa'; }
    else if(labels[id]){ btn.textContent = labels[id]; btn.title = h2.textContent.trim(); }
    else { var clone=h2.cloneNode(true); var sn=clone.querySelector('.sn,.badge-new'); if(sn)sn.remove();
      btn.textContent=clone.textContent.trim().replace(/\s+/g,' ').slice(0,22); btn.title=h2.textContent.trim(); }
    btn.dataset.target = id;
    btn.addEventListener('click', function(){
      var el=document.getElementById(btn.dataset.target); if(!el)return;
      var y=el.getBoundingClientRect().top+window.pageYOffset-112;
      window.scrollTo({top:y<0?0:y,behavior:'smooth'}); setActive(btn);
    });
    nav.appendChild(btn);
  });
  var hdr=document.querySelector('.header,header,.portal-header');
  if(hdr&&hdr.parentNode){ hdr.parentNode.insertBefore(nav,hdr.nextSibling); } else { document.body.insertBefore(nav,document.body.firstChild); }
  var navH=nav.offsetHeight||40;
  nav.style.setProperty('position','fixed','important');
  nav.style.top='54px';nav.style.left='0';nav.style.right='0';nav.style.zIndex='95';
  function padTop(){ navH=nav.offsetHeight||navH; document.body.style.paddingTop=(navH+54)+'px'; }
  padTop(); window.addEventListener('resize',padTop,{passive:true});
  var btns=[].slice.call(nav.querySelectorAll('button'));
  function setActive(b){ btns.forEach(function(x){ x.classList.toggle('active',x===b); }); }
  function updateActive(){
    var off=(nav.offsetHeight||44)+12; var scrollY=window.pageYOffset+off;
    var activeId=h2s.length?h2s[0].id:null;
    h2s.forEach(function(h2){ if(h2.getBoundingClientRect().top+window.pageYOffset<=scrollY) activeId=h2.id; });
    var ampActive=activeId&&activeId.indexOf('amp-')===0;
    btns.forEach(function(b){ var t=b.dataset.target; b.classList.toggle('active',(t===activeId)||(ampActive&&t.indexOf('amp-')===0)); });
  }
  window.addEventListener('scroll',updateActive,{passive:true});
  window.addEventListener('resize',updateActive,{passive:true});
  updateActive();
})();
</script>
<script>
function initHubTooltips(){
  document.querySelectorAll('.hub-panel').forEach(function(p){ document.body.appendChild(p); });
  var panels=[].slice.call(document.querySelectorAll('.hub-panel'));
  panels.forEach(function(panel){
    var match=panel.getAttribute('data-hub-match')||''; if(!match) return;
    panel.dataset.pinned='0';
    var nodes=[].slice.call(document.querySelectorAll('.mermaid g.node')).filter(function(n){
      return ((n.textContent||'').replace(/\s+/g,' ').indexOf(match)!==-1); });
    if(!nodes.length) return;
    function place(n){
      var r=n.getBoundingClientRect(); var w=panel.offsetWidth||520;
      var left=r.left;
      if(left+w>window.innerWidth-12){ left=window.innerWidth-w-12; }
      panel.style.left=Math.max(8,left)+'px'; panel.style.top=(r.bottom+8)+'px';
    }
    nodes.forEach(function(n){
      n.style.cursor='pointer';
      n.addEventListener('mouseenter',function(){ if(panel.dataset.pinned==='1')return; place(n); panel.style.display='block'; });
      n.addEventListener('mouseleave',function(){ if(panel.dataset.pinned==='1')return; panel.style.display='none'; });
      n.addEventListener('click',function(e){ e.stopPropagation();
        if(panel.dataset.pinned==='1'){ panel.dataset.pinned='0'; panel.style.display='none'; }
        else { panel.dataset.pinned='1'; place(n); panel.style.display='block'; } });
    });
    panel.addEventListener('click',function(e){ e.stopPropagation(); });
  });
  document.addEventListener('click',function(){
    document.querySelectorAll('.hub-panel').forEach(function(p){ if(p.dataset.pinned==='1'){ p.dataset.pinned='0'; p.style.display='none'; } });
  });
}
</script>
<script>
/* Navegación cross-cap: nodos :::xcap cuya etiqueta contiene "cap-XXX" navegan a esa capacidad al clicar. */
(function(){
  function initXcapLinks(){
    document.querySelectorAll('.mermaid g.node').forEach(function(n){
      var t=(n.textContent||'').replace(/\s+/g,' ').trim();
      var m=t.match(/\bcap-([a-z]+)/);   /* tolerante: "(cap-orc)" · "cap-gl (BC-13)" · "(cross-ref cap-sta)" → grupo 1 = código */
      if(!m) return;
      var cap=m[1];
      var target='../modelo capacidades/cap-'+cap+'.html#diag';
      n.style.cursor='pointer';
      n.setAttribute('title','→ '+cap);
      n.addEventListener('click',function(e){ e.stopPropagation(); window.location.href=target; });
    });
  }
  window.initXcapLinks=initXcapLinks;
})();
</script>
<script>
(function(){
  var ro=new IntersectionObserver(function(es){es.forEach(function(e){
    if(e.isIntersecting){e.target.classList.add('visible');ro.unobserve(e.target);}});},{threshold:0.04});
  document.querySelectorAll('.reveal').forEach(function(el){ro.observe(el);});
})();
</script>
<script>
(function(){
  var SEQ_TARGET=8;                 // participantes visibles por vista (objetivo 6–8; columnas desiguales)
  function count(svg){
    var n=svg.querySelectorAll('.actor-line').length;
    if(!n)n=svg.querySelectorAll('line.actor-line').length;
    if(!n)n=svg.querySelectorAll('text.actor').length;   // fallback
    return n;
  }
  function addTopBar(box){
    var top=box.previousElementSibling;
    if(!top||!top.classList||!top.classList.contains('mmscroll-top')){
      top=document.createElement('div'); top.className='mmscroll-top';
      var inner=document.createElement('div'); inner.className='mmscroll-top-inner';
      top.appendChild(inner); box.parentNode.insertBefore(top,box);
      var lock=false;
      top.addEventListener('scroll',function(){ if(lock)return; lock=true; box.scrollLeft=top.scrollLeft; lock=false; });
      box.addEventListener('scroll',function(){ if(lock)return; lock=true; top.scrollLeft=box.scrollLeft; lock=false; });
    }
    top.firstChild.style.width=box.scrollWidth+'px';   // espeja el ancho total desplazable
  }
  function scale(){
    var boxes=[].slice.call(document.querySelectorAll('.mermaid.mmscroll'));
    if(!boxes.length)return;
    var pending=false;
    boxes.forEach(function(box){
      if(box.dataset.seqScaled==='1')return;
      var svg=box.querySelector('svg'); if(!svg){pending=true;return;}
      var n=count(svg);
      var natural=svg.getBoundingClientRect().width;
      var cw=box.clientWidth||box.getBoundingClientRect().width;
      if(!n||!natural||!cw){pending=true;return;}
      var target=(n>SEQ_TARGET)?(cw*n/SEQ_TARGET):cw;  // >8: SEQ_TARGET por vista + scroll · <=8: caben todos en pantalla
      if(target<natural){ svg.style.setProperty('width',target+'px','important'); svg.style.height='auto'; }
      if(n>SEQ_TARGET){ addTopBar(box); }            // >8: doble barra de scroll
      else{ box.style.overflowX='visible'; }          // <=8: cabe en pantalla -> sin barras
      box.dataset.seqScaled='1';
    });
    if(pending)setTimeout(scale,120);
  }
  function reset(){ document.querySelectorAll('.mermaid.mmscroll').forEach(function(b){
    b.dataset.seqScaled=''; var s=b.querySelector('svg'); if(s)s.style.width=''; }); setTimeout(scale,120); }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(scale,250);});
  else setTimeout(scale,250);
  var t; window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(reset,200);});
})();
</script>
