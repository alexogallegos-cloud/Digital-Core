<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Brain — Banamex</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0a18 0%, #12001f 50%, #0a0a18 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: #e0e0e0;
    }
    /* ─── Card ─────────────────────────────────────────────────────────────── */
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 44px 40px;
      width: 100%; max-width: 400px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05) inset;
    }
    /* ─── Logo Banamex ──────────────────────────────────────────────────────── */
    .brand { text-align: center; margin-bottom: 28px; }
    .brand .logo-wrap {
      display: inline-flex; align-items: center; justify-content: center;
      background: #fff; border-radius: 12px;
      padding: 10px 22px; border: 1px solid rgba(255,255,255,0.08);
    }
    .brand .logo-img {
      height: 36px; width: auto; display: block;
    }
    .brand .subtitle {
      margin-top: 16px; font-size: 13px; color: #999;
      letter-spacing: 0.3px;
    }
    /* ─── Tab switcher ──────────────────────────────────────────────────────── */
    .tabs {
      display: grid; grid-template-columns: 1fr 1fr;
      background: rgba(0,0,0,0.3); border-radius: 10px;
      padding: 4px; margin-bottom: 28px;
    }
    .tab {
      padding: 9px; text-align: center; border-radius: 7px;
      font-size: 14px; font-weight: 500; cursor: pointer;
      color: #888; transition: all .2s;
    }
    .tab.active { background: rgba(255,255,255,0.1); color: #fff; }
    /* ─── Forms ─────────────────────────────────────────────────────────────── */
    .view { display: none; }
    .view.active { display: block; }
    label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; margin-top: 18px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 9px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      color: #fff; font-size: 15px; outline: none; transition: border .2s;
    }
    input:focus { border-color: #E31837; box-shadow: 0 0 0 3px rgba(227,24,55,0.12); }
    input.code-input {
      text-align: center; font-size: 26px; font-weight: 700;
      letter-spacing: 10px;
    }
    .hint { font-size: 11px; color: #555; margin-top: 5px; }
    button.primary {
      width: 100%; margin-top: 24px; padding: 13px;
      background: #E31837; color: #fff; border: none; border-radius: 9px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    button.primary:hover   { opacity: .88; }
    button.primary:active  { transform: scale(.98); }
    button.primary:disabled { opacity: .45; cursor: not-allowed; }
    /* ─── Messages ──────────────────────────────────────────────────────────── */
    .msg { margin-top: 14px; font-size: 13px; min-height: 18px; text-align: center; }
    .msg.error { color: #ff6b6b; }
    .msg.ok    { color: #4caf96; }
    /* ─── Verify info box ───────────────────────────────────────────────────── */
    .verify-info {
      background: rgba(227,24,55,0.08); border: 1px solid rgba(227,24,55,0.2);
      border-radius: 9px; padding: 14px 16px; font-size: 13px;
      color: #ccc; line-height: 1.6; margin-bottom: 8px;
    }
    .verify-info strong { color: #fff; }
    /* ─── Links ─────────────────────────────────────────────────────────────── */
    .footer-link {
      text-align: center; margin-top: 20px; font-size: 13px; color: #666;
    }
    .footer-link a { color: #E31837; text-decoration: none; cursor: pointer; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="card">

  <!-- Logo Banamex -->
  <div class="brand">
    <div class="logo-wrap">
      <img class="logo-img" src="Banamex-logo.png" alt="Banamex">
    </div>
    <div class="subtitle">Digital Brain · S500 + S151 — Acceso al sistema de análisis de mainframe</div>
  </div>

  <!-- Tabs Login / Crear cuenta -->
  <div class="tabs" id="tabs">
    <div class="tab active" id="tabLogin"    onclick="showView('login')">Iniciar sesión</div>
    <div class="tab"        id="tabSignup"   onclick="showView('signup')">Crear cuenta</div>
  </div>

  <!-- ── Vista LOGIN ─────────────────────────────────────────────── -->
  <div class="view active" id="viewLogin">
    <form id="loginForm">
      <label for="lEmail">Correo electrónico</label>
      <input type="email" id="lEmail" placeholder="nombre@dominio.com" autocomplete="email" required>
      <label for="lPass">Contraseña</label>
      <input type="password" id="lPass" placeholder="••••••••" autocomplete="current-password" required>
      <button class="primary" type="submit" id="lBtn">Iniciar sesión</button>
    </form>
    <div class="msg" id="lMsg"></div>
  </div>

  <!-- ── Vista SIGNUP ────────────────────────────────────────────── -->
  <div class="view" id="viewSignup">
    <form id="signupForm">
      <label for="sEmail">Correo electrónico</label>
      <input type="email" id="sEmail" placeholder="nombre@dominio.com" autocomplete="email" required>
      <label for="sPass">Contraseña</label>
      <input type="password" id="sPass" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required>
      <div class="hint">Mínimo 8 caracteres · mayúscula · número · símbolo</div>
      <label for="sPass2">Confirmar contraseña</label>
      <input type="password" id="sPass2" placeholder="Repite la contraseña" autocomplete="new-password" required>
      <button class="primary" type="submit" id="sBtn">Crear cuenta y enviar código</button>
    </form>
    <div class="msg" id="sMsg"></div>
  </div>

  <!-- ── Vista VERIFY ────────────────────────────────────────────── -->
  <div class="view" id="viewVerify">
    <div class="verify-info">
      Enviamos un código de 6 dígitos a<br>
      <strong id="vEmailDisplay">tu correo</strong>.<br>
      Puede tardar unos segundos.
    </div>
    <form id="verifyForm">
      <label for="vCode">Código de verificación</label>
      <input type="text" id="vCode" class="code-input" inputmode="numeric"
             maxlength="6" placeholder="000000" autocomplete="one-time-code" required>
      <button class="primary" type="submit" id="vBtn">Verificar</button>
    </form>
    <div class="msg" id="vMsg"></div>
    <div class="footer-link">
      <a id="resendLink">Reenviar código</a>
    </div>
  </div>

</div><!-- /card -->

<script src="cognito-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
<script>
  // ── Cognito pool ────────────────────────────────────────────────────────────
  const cfg  = window.COGNITO_CONFIG;
  const pool = new AmazonCognitoIdentity.CognitoUserPool({
    UserPoolId: cfg.userPoolId,
    ClientId:   cfg.clientId
  });

  let pendingEmail = '';

  // ── View switcher ───────────────────────────────────────────────────────────
  function showView(name) {
    ['login', 'signup', 'verify'].forEach(v => {
      document.getElementById('view' + cap(v)).classList.toggle('active', v === name);
    });
    const hasTabs = name !== 'verify';
    document.getElementById('tabs').style.display = hasTabs ? 'grid' : 'none';
    if (name === 'login' || name === 'signup') {
      document.getElementById('tabLogin').classList.toggle('active', name === 'login');
      document.getElementById('tabSignup').classList.toggle('active', name === 'signup');
    }
  }
  function cap(s) { return s[0].toUpperCase() + s.slice(1); }

  // ── LOGIN ───────────────────────────────────────────────────────────────────
  document.getElementById('loginForm').onsubmit = function(e) {
    e.preventDefault();
    const lMsg = document.getElementById('lMsg');
    const lBtn = document.getElementById('lBtn');
    lMsg.className = 'msg'; lMsg.textContent = '';
    lBtn.disabled = true; lBtn.textContent = 'Verificando…';

    const email = document.getElementById('lEmail').value.trim();
    const pass  = document.getElementById('lPass').value;

    const user = new AmazonCognitoIdentity.CognitoUser({ Username: email, Pool: pool });
    user.authenticateUser(
      new AmazonCognitoIdentity.AuthenticationDetails({ Username: email, Password: pass }),
      {
        onSuccess: function(result) {
          const token   = result.getIdToken().getJwtToken();
          const expires = new Date(Date.now() + 24 * 3600 * 1000).toUTCString();
          document.cookie = `id_token=${token}; path=/; expires=${expires}; SameSite=Lax`;
          window.location.replace('/');
        },
        onFailure: function(err) {
          lBtn.disabled = false; lBtn.textContent = 'Iniciar sesión';
          lMsg.className = 'msg error';
          if (err.code === 'UserNotConfirmedException') {
            pendingEmail = email;
            document.getElementById('vEmailDisplay').textContent = email;
            lMsg.textContent = 'Cuenta sin confirmar — ingresa el código enviado.';
            setTimeout(() => showView('verify'), 900);
          } else if (err.code === 'NotAuthorizedException') {
            lMsg.textContent = 'Correo o contraseña incorrectos.';
          } else {
            lMsg.textContent = err.message || 'Error al iniciar sesión.';
          }
        }
      }
    );
  };

  // ── SIGNUP ──────────────────────────────────────────────────────────────────
  document.getElementById('signupForm').onsubmit = function(e) {
    e.preventDefault();
    const sMsg = document.getElementById('sMsg');
    const sBtn = document.getElementById('sBtn');
    sMsg.className = 'msg'; sMsg.textContent = '';

    const email = document.getElementById('sEmail').value.trim();
    const pass1 = document.getElementById('sPass').value;
    const pass2 = document.getElementById('sPass2').value;

    if (pass1 !== pass2) {
      sMsg.className = 'msg error'; sMsg.textContent = 'Las contraseñas no coinciden.';
      return;
    }
    sBtn.disabled = true; sBtn.textContent = 'Creando cuenta…';

    pool.signUp(email, pass1,
      [new AmazonCognitoIdentity.CognitoUserAttribute({ Name: 'email', Value: email })],
      null,
      function(err) {
        if (err) {
          sBtn.disabled = false; sBtn.textContent = 'Crear cuenta y enviar código';
          sMsg.className = 'msg error';
          sMsg.textContent = err.code === 'UsernameExistsException'
            ? 'Este correo ya está registrado.'
            : (err.message || 'Error al crear la cuenta.');
          return;
        }
        pendingEmail = email;
        document.getElementById('vEmailDisplay').textContent = email;
        sMsg.className = 'msg ok';
        sMsg.textContent = '¡Código enviado! Revisa tu correo.';
        setTimeout(() => showView('verify'), 1000);
      }
    );
  };

  // ── VERIFY ──────────────────────────────────────────────────────────────────
  document.getElementById('vCode').addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '');
  });

  document.getElementById('verifyForm').onsubmit = function(e) {
    e.preventDefault();
    const vMsg = document.getElementById('vMsg');
    const vBtn = document.getElementById('vBtn');
    vMsg.className = 'msg'; vMsg.textContent = '';
    vBtn.disabled = true; vBtn.textContent = 'Verificando…';

    const code = document.getElementById('vCode').value.trim();
    const user = new AmazonCognitoIdentity.CognitoUser({ Username: pendingEmail, Pool: pool });

    user.confirmRegistration(code, true, function(err) {
      if (err) {
        vBtn.disabled = false; vBtn.textContent = 'Verificar';
        vMsg.className = 'msg error';
        vMsg.textContent = err.code === 'CodeMismatchException'
          ? 'Código incorrecto. Inténtalo de nuevo.'
          : (err.code === 'ExpiredCodeException'
            ? 'El código expiró. Solicita uno nuevo.'
            : (err.message || 'Error al verificar.'));
        return;
      }
      vMsg.className = 'msg ok';
      vMsg.textContent = '¡Cuenta verificada! Inicia sesión.';
      setTimeout(() => { showView('login'); }, 1500);
    });
  };

  document.getElementById('resendLink').onclick = function() {
    if (!pendingEmail) return;
    const user = new AmazonCognitoIdentity.CognitoUser({ Username: pendingEmail, Pool: pool });
    user.resendConfirmationCode(function(err) {
      const vMsg = document.getElementById('vMsg');
      vMsg.className = err ? 'msg error' : 'msg ok';
      vMsg.textContent = err
        ? (err.message || 'Error al reenviar.')
        : 'Código reenviado. Revisa tu correo.';
    });
  };
</script>
</body>
</html>
