openapi: "3.1.0"

info:
  title: "Captacion Service"
  version: "0.1.0-seed"
  summary: "API de cuentas de captación bancaria — modernización S500 Banamex"
  description: |
    Contrato sembrado desde el Gemelo Cognitivo GemCog v2.2.

    **Bounded Context**: BC-01 Cuentas de Captación
    **Sistema origen**: S500 (Unisys ClearPath MCP · COBOL + ALGOL)
    **Wave de transpilación**: Wave 1 (LOC < 3K) + Wave 2 (LOC 3K-8K, flag CNBV)

    Este spec es Contract-First: define el comportamiento esperado ANTES del primer
    endpoint productivo. Es el golden-master de Capa 7 (Equivalencia Funcional).

    **Restricciones financieras**:
    - Todos los campos monetarios se serializan como `string` (BigDecimal backend, 4 decimales).
    - Formato decimal: punto como separador, sin separador de miles. Ej: `"15234.5000"`
    - RoundingMode: HALF_EVEN (ver ADR-SPE-MM-002).

    **Regulación**: CNBV Circular Única de Bancos · Banxico.
    Operaciones marcadas con `x-regulatory-flags` requieren sign-off antes de v1.0.0.
  license:
    name: "Accenture Internal — Banamex Mainframe Modernization"
  contact:
    name: "SPE Mainframe Modernization Team"

x-gemcog-source:
  sistema: "S500"
  bounded_context: "BC-01"
  bc_name: "Cuentas de Captación"
  vocab_version: "v2.2"
  capa: 6
  journeys:
    - "journey-captacion-apertura-cuenta"
    - "journey-captacion-consulta-saldo"
    - "journey-captacion-deposito"
    - "journey-captacion-retiro"
    - "journey-captacion-transferencia"
    - "journey-captacion-dispersion-fondos"
    - "journey-captacion-estado-de-cuenta"
    - "journey-captacion-vinculos-cuenta"
    - "journey-captacion-atributos-cuenta"
    - "journey-captacion-cierre-batch"
  reglas:
    - "BR-001"
    - "BR-002"
    - "BR-003"
    - "BR-005"
    - "BR-007"
  programas_origen:
    - "S500/P010 (LINCOMS 26K LOC · ONLINE)"
    - "S500/P020 (LINCOMS 22K LOC · ONLINE)"
    - "S500/P080 (Gestor Cuenta Ordenante 9.2K LOC)"
    - "S500/P130 (batch principal 15K LOC)"
    - "S500/P142 (batch crédito-captación 14K LOC)"
    - "S500/P165 (resultado dispersión 5.6K LOC)"
    - "S500/P330 (cálculos productos especiales 7.8K LOC)"
    - "S500/P400 (estado de cuenta)"
  equivalencia_objetivo: "≥ 99.99%"
  paralell_run_minimo: "3 meses"
  notas:
    - "P010 es ONLINE entrypoint; accedido vía COMS — no tiene aristas en call graph estático. Ver knowledge-base GemCog."
    - "Campos COMP-3 legacy → BigDecimal en Java (ver ADR-SPE-MM-002)."
    - "Código CRONOS2K presente en P130, P142 — revisar lógica de fechas antes de cutover."

servers:
  - url: "http://localhost:8081"
    description: "Local dev"
  - url: "https://api-dev.banamex-internal.mx/captacion/v0"
    description: "DEV"
  - url: "https://api-stg.banamex-internal.mx/captacion/v0"
    description: "STG (parallel-run)"

tags:
  - name: "cuentas"
    description: "Gestión de cuentas de captación — cheques, ahorro, inversión"
  - name: "saldos"
    description: "Consulta de saldos disponibles y contables"
  - name: "movimientos-captacion"
    description: "Depósitos, retiros y transferencias online"
  - name: "dispersiones"
    description: "Dispersión masiva de fondos (nómina, comisiones, becas)"
  - name: "estado-cuenta"
    description: "Estado de cuenta del cliente de captación"
  - name: "vinculos"
    description: "Vínculos lógicos entre cuentas (relaciones padre-hijo)"
  - name: "atributos"
    description: "Atributos y calificaciones de cuenta"
  - name: "batch"
    description: "Control y observabilidad del proceso batch de captación"

paths:

  # ── Cuentas ────────────────────────────────────────────────────────────────

  /cuentas-captacion:
    post:
      operationId: "abrirCuenta"
      summary: "Apertura de cuenta de captación"
      tags: ["cuentas"]
      description: |
        Abre una nueva cuenta de captación en el sistema.
        **Journey**: journey-captacion-apertura-cuenta
        **Origen**: S500/P010 ONLINE · BC-01 · CAPTACION
        **Reglas**: BR-001, BR-002
      x-regulatory-flags: ["CNBV"]
      x-gemcog-programa: "S500/P010"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AperturaCuentaRequest"
            example:
              tipoCuenta: "CHEQUES"
              numeroCuenta: "0012345678901"
              titular:
                nombre: "Juan Pérez García"
                rfc: "PEGJ800101ABC"
              moneda: "MXN"
              sucursal: "0001"
              productoId: "001"
      responses:
        "201":
          description: "Cuenta abierta exitosamente"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuentaCaptacion"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "409":
          description: "Cuenta ya existe con el número proporcionado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Fecha no es día hábil bancario (LOCSUP/S006)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      operationId: "consultarCuentas"
      summary: "Consultar cuentas de captación por titular"
      tags: ["cuentas"]
      description: |
        Consulta las cuentas de captación asociadas a un titular (RFC).
        **Origen**: S500/P010 ONLINE · BC-01 · CAPTACION
      x-regulatory-flags: ["CNBV"]
      x-gemcog-programa: "S500/P010"
      parameters:
        - name: "rfc"
          in: "query"
          required: false
          schema:
            type: string
            pattern: "^[A-Z]{3,4}[0-9]{6}[A-Z0-9]{3}$"
        - name: "tipoCuenta"
          in: "query"
          required: false
          schema:
            $ref: "#/components/schemas/TipoCuenta"
        - name: "sucursal"
          in: "query"
          required: false
          schema:
            type: string
            maxLength: 4
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: "Lista de cuentas"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaCuentas"
        "400":
          $ref: "#/components/responses/ErrorValidacion"

  /cuentas-captacion/{numeroCuenta}:
    parameters:
      - $ref: "#/components/parameters/NumeroCuenta"

    get:
      operationId: "consultarCuenta"
      summary: "Consultar una cuenta de captación"
      tags: ["cuentas"]
      description: |
        Devuelve los datos maestros de una cuenta de captación.
        **Journey**: journey-captacion-consulta-saldo (datos generales)
        **Origen**: S500/P010 ONLINE · BC-01
      x-gemcog-programa: "S500/P010"
      responses:
        "200":
          description: "Datos de la cuenta"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CuentaCaptacion"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  # ── Saldos ─────────────────────────────────────────────────────────────────

  /cuentas-captacion/{numeroCuenta}/saldo:
    parameters:
      - $ref: "#/components/parameters/NumeroCuenta"

    get:
      operationId: "consultarSaldo"
      summary: "Consultar saldo de cuenta de captación"
      tags: ["saldos"]
      description: |
        Devuelve el SaldoCuenta (disponible y contable de captación).

        **Nota de dominio**: `SaldoCuenta` (BC-01) ≠ `SaldoContable` (BC-05 GL).
        El saldo disponible refleja la posición operativa del cliente.
        El saldo contable GL es la posición en el libro mayor (vía BC-04).

        **Journey**: journey-captacion-consulta-saldo
        **Origen**: S500/P010 + P020 ONLINE · BD01CAPTACION
        **Colisión resuelta**: SALDO S500 → `SaldoCuenta` (ver ubiquitous-language-target.md §3.1)
      x-regulatory-flags: ["CNBV"]
      x-gemcog-programa: "S500/P010"
      responses:
        "200":
          description: "Saldo de la cuenta"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaldoCuenta"
              example:
                numeroCuenta: "0012345678901"
                saldoDisponible: "15234.5000"
                saldoContableCaptacion: "15234.5000"
                moneda: "MXN"
                fechaConsulta: "2026-07-14"
                esDiaHabil: true
        "404":
          $ref: "#/components/responses/NoEncontrado"

  # ── Movimientos de captación ────────────────────────────────────────────────

  /cuentas-captacion/{numeroCuenta}/depositos:
    parameters:
      - $ref: "#/components/parameters/NumeroCuenta"

    post:
      operationId: "registrarDeposito"
      summary: "Registrar depósito en cuenta de captación"
      tags: ["movimientos-captacion"]
      description: |
        Deposita un importe en la cuenta de captación.
        **Journey**: journey-captacion-deposito
        **Origen**: S500/P010 ONLINE · BC-01 · flag CNBV
        **Reglas**: BR-003, BR-005
        Post-condición: dispara asiento GL via BC-04 GL-Posting-Service.
      x-regulatory-flags: ["CNBV"]
      x-gemcog-programa: "S500/P010"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperacionCaptacionRequest"
            example:
              importe: "5000.0000"
              moneda: "MXN"
              referencia: "DEP-20260714-001"
              canal: "SUCURSAL"
              sucursal: "0001"
              fechaValor: "2026-07-14"
      responses:
        "201":
          description: "Depósito registrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoOperacion"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "422":
          description: "Fecha no es día hábil · importe negativo o cero · cuenta inactiva"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cuentas-captacion/{numeroCuenta}/retiros:
    parameters:
      - $ref: "#/components/parameters/NumeroCuenta"

    post:
      operationId: "registrarRetiro"
      summary: "Registrar retiro de cuenta de captación"
      tags: ["movimientos-captacion"]
      description: |
        Retira un importe de la cuenta de captación.
        **Journey**: journey-captacion-retiro
        **Origen**: S500/P010 ONLINE · BC-01
        Valida saldo disponible antes de ejecutar.
        Post-condición: dispara asiento GL via BC-04.
      x-regulatory-flags: ["CNBV"]
      x-gemcog-programa: "S500/P010"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperacionCaptacionRequest"
      responses:
        "201":
          description: "Retiro registrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoOperacion"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "409":
          description: "Saldo insuficiente"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Fecha no es día hábil · cuenta bloqueada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transferencias:
    post:
      operationId: "registrarTransferencia"
      summary: "Registrar transferencia entre cuentas de captación"
      tags: ["movimientos-captacion"]
      description: |
        Transfiere fondos entre dos cuentas de captación.
        **Journey**: journey-captacion-transferencia
        **Origen**: S500/P080 (Gestor Cuenta Ordenante 9.2K LOC) · flag CNBV
        La cuenta ordenante es gestionada por P080 referenciando sistema externo S080 (tarifas/UDIS).
        Genera dos asientos GL via BC-04 (débito cuenta origen · crédito cuenta destino).
      x-regulatory-flags: ["CNBV", "BANXICO"]
      x-gemcog-programa: "S500/P080"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferenciaRequest"
      responses:
        "201":
          description: "Transferencia registrada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoOperacion"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "409":
          description: "Saldo insuficiente en cuenta origen"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Fecha no es día hábil · cuentas de sistemas diferentes"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Dispersión de fondos ────────────────────────────────────────────────────

  /dispersiones:
    post:
      operationId: "iniciarDispersion"
      summary: "Iniciar dispersión masiva de fondos"
      tags: ["dispersiones"]
      description: |
        Distribuye fondos desde una cuenta origen a múltiples cuentas destino
        (nómina, comisiones, becas).
        **Journey**: journey-captacion-dispersion-fondos
        **Origen**: S500/P015 ONLINE (routing COMS captación) + P165 BATCH (resultado)
        El proceso es asíncrono: la respuesta 202 incluye un ID de seguimiento.
        El resultado final se consulta en GET /dispersiones/{idDispersion}.
      x-gemcog-programa: "S500/P015"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispersionFondosRequest"
      responses:
        "202":
          description: "Dispersión iniciada — proceso asíncrono"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispersionFondosAceptada"
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "422":
          description: "Saldo insuficiente · cuenta origen bloqueada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dispersiones/{idDispersion}:
    get:
      operationId: "consultarDispersion"
      summary: "Consultar resultado de dispersión"
      tags: ["dispersiones"]
      description: |
        Devuelve el estado y resultado de una dispersión masiva de fondos.
        **Journey**: journey-captacion-dispersion-fondos (resultado)
        **Origen**: S500/P165 (RESULTADO-DISPERSION 5.6K LOC)
      x-gemcog-programa: "S500/P165"
      parameters:
        - name: "idDispersion"
          in: "path"
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Estado de la dispersión"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoDispersion"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  # ── Estado de cuenta ────────────────────────────────────────────────────────

  /cuentas-captacion/{numeroCuenta}/estado-cuenta:
    parameters:
      - $ref: "#/components/parameters/NumeroCuenta"

    get:
      operationId: "generarEstadoCuenta"
      summary: "Generar estado de cuenta de captación"
      tags: ["estado-cuenta"]
      description: |
        Genera el estado de cuenta del cliente: movimientos y saldos del período.
        **Journey**: journey-captacion-estado-de-cuenta
        **Origen**: S500/P400 (PID=P335-EDOCTA) · BD01CAPTACION
        ANO-002: filename cruzado P400/P335 en código fuente — verificar en transpilación.
      x-gemcog-programa: "S500/P400"
      parameters:
        - name: "fechaInicio"
          in: "query"
          required: true
          schema:
            type: string
            format: date
        - name: "fechaFin"
          in: "query"
          required: true
          schema:
            type: string
            format: date
        - name: "formato"
          in: "query"
          required: false
          schema:
            type: string
            enum: ["JSON", "PDF"]
            default: "JSON"
      responses:
        "200":
          description: "Estado de cuenta generado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoCuenta"
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ErrorValidacion"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  # ── Vínculos de cuenta ──────────────────────────────────────────────────────

  /cuentas-captacion/{numeroCuenta}/vinculos:
    parameters:
      - $ref: "#/components/parameters/NumeroCuenta"

    get:
      operationId: "consultarVinculos"
      summary: "Consultar vínculos lógicos de una cuenta"
      tags: ["vinculos"]
      description: |
        Devuelve las relaciones padre-hijo entre cuentas (cuenta maestra y subcuentas).
        **Journey**: journey-captacion-vinculos-cuenta
        **Origen**: S500/L040 (LIGAS · ALGOL 371 LOC) · BD01CAPTACION
      x-gemcog-programa: "S500/L040"
      responses:
        "200":
          description: "Vínculos de la cuenta"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VinculosCuenta"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  # ── Atributos de cuenta ─────────────────────────────────────────────────────

  /cuentas-captacion/{numeroCuenta}/atributos:
    parameters:
      - $ref: "#/components/parameters/NumeroCuenta"

    get:
      operationId: "consultarAtributos"
      summary: "Consultar atributos y calificaciones de una cuenta"
      tags: ["atributos"]
      description: |
        Devuelve los atributos de calificación especiales de la cuenta.
        **Journey**: journey-captacion-atributos-cuenta
        **Origen**: BD07ATRIBUCTAS (DMSII S500BD07ATRIBUCTAS)
      x-gemcog-programa: "S500/BD07ATRIBUCTAS"
      responses:
        "200":
          description: "Atributos de la cuenta"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtributoCuenta"
        "404":
          $ref: "#/components/responses/NoEncontrado"

  # ── Días hábiles (via S006/LOCSUP) ─────────────────────────────────────────

  /dias-habiles/{fecha}:
    get:
      operationId: "consultarDiaHabil"
      summary: "Verificar si una fecha es día hábil bancario"
      tags: ["batch"]
      description: |
        Consulta el calendario de días hábiles bancarios via S006/LOCSUP.
        **Origen**: S006 (LOCSUP) — servicio compartido BC-01 + BC-05
        Utilizado por todos los endpoints que validan fechaValor.
      x-gemcog-programa: "S006/LOCSUP"
      parameters:
        - name: "fecha"
          in: "path"
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "Resultado de consulta"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultaDiaHabil"

  # ── Proceso batch de captación ──────────────────────────────────────────────

  /cierre-batch/captacion:
    get:
      operationId: "consultarEstadoBatch"
      summary: "Consultar estado del proceso batch de captación"
      tags: ["batch"]
      description: |
        Devuelve el estado actual del proceso batch nocturno de captación.
        **Journey**: journey-captacion-cierre-batch
        **Origen**: S500 WFL LOTE · BD02AUXILIAR (ControlBatchCaptacion)
        **Colisión resuelta**: CONTROL S500 → ControlBatchCaptacion (ver UL §3.2)
        **Colisión resuelta**: LOTE S500 → CierreBatchCaptacion (ver UL §3.4)
      x-regulatory-flags: ["CNBV"]
      x-gemcog-programa: "S500/WFL_LOTE"
      responses:
        "200":
          description: "Estado del batch"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlBatchCaptacion"

    post:
      operationId: "iniciarCierreBatch"
      summary: "Iniciar cierre batch de captación"
      tags: ["batch"]
      description: |
        Dispara el cierre del día para el proceso batch de captación.
        Operación privilegiada — requiere scope `ops:batch:trigger`.
      x-regulatory-flags: ["CNBV"]
      x-gemcog-programa: "S500/WFL_LOTE"
      security:
        - BearerAuth: ["ops:batch:trigger"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerBatchRequest"
      responses:
        "202":
          description: "Cierre batch iniciado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlBatchCaptacion"
        "409":
          description: "Batch ya en ejecución"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cierre-batch/captacion/reproceso:
    post:
      operationId: "forzarReproceso"
      summary: "Forzar reproceso del cierre batch de captación"
      tags: ["batch"]
      description: |
        Ejecuta el batch ya corrido, saltando validaciones de doble ejecución.
        **Colisión resuelta**: FORZA S500 → ReprocesoForzadoCaptacion (ver UL §3.5)
        ⚠ Operación regulatoria CNBV: el reproceso queda en bitácora de auditoría.
        Requiere scope `ops:reproceso`.
      x-regulatory-flags: ["CNBV"]
      x-gemcog-programa: "S500/WFL_LOTE (FORZA flag)"
      security:
        - BearerAuth: ["ops:reproceso"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReprocesoForzadoRequest"
      responses:
        "202":
          description: "Reproceso forzado iniciado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlBatchCaptacion"
        "403":
          description: "Scope insuficiente para reproceso forzado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ── Componentes ───────────────────────────────────────────────────────────────

components:

  parameters:
    NumeroCuenta:
      name: "numeroCuenta"
      in: "path"
      required: true
      description: "Número de cuenta de captación (13 dígitos)"
      schema:
        type: string
        pattern: "^[0-9]{13}$"
        example: "0012345678901"
    Page:
      name: "page"
      in: "query"
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: "size"
      in: "query"
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    ErrorValidacion:
      description: "Error de validación de entrada"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NoEncontrado:
      description: "Recurso no encontrado"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ── Enums ─────────────────────────────────────────────────────────────────

    TipoCuenta:
      type: string
      enum: ["CHEQUES", "AHORRO", "PLAZO_FIJO", "MAESTRA"]
      description: "Tipo de cuenta de captación"
      # [GEMCOG-SOURCE: S500/BD01CAPTACION · vocab: CAPTACION]

    EstadoCuentaEnum:
      type: string
      enum: ["ACTIVA", "BLOQUEADA", "CANCELADA", "INACTIVA"]
      description: "Estado operativo de la cuenta"

    Canal:
      type: string
      enum: ["SUCURSAL", "ATM", "ONLINE", "MOVIL", "BANCA_TELEFONICA"]
      description: "Canal de operación"

    EstadoBatch:
      type: string
      enum: ["PENDIENTE", "EN_EJECUCION", "COMPLETADO", "ERROR", "REPROCESO"]
      description: "Estado del proceso batch de captación"
      # [GEMCOG-SOURCE: S500/WFL_LOTE · vocab: LOTE, CONTROL]

    # ── Value Objects ─────────────────────────────────────────────────────────

    ImporteMonetario:
      type: string
      pattern: "^[0-9]+\\.[0-9]{4}$"
      description: |
        Importe monetario serializado como string con exactamente 4 decimales.
        Backend: BigDecimal(4, RoundingMode.HALF_EVEN) — ver ADR-SPE-MM-002.
        PROHIBIDO usar double o float para importes financieros.
      example: "15234.5000"
      # [GEMCOG-SOURCE: S500 COMP-3 fields → BigDecimal target]

    NumeroCuentaSchema:
      type: string
      pattern: "^[0-9]{13}$"
      description: "Número de cuenta de captación (13 dígitos numéricos)"
      example: "0012345678901"

    RfcSchema:
      type: string
      pattern: "^[A-Z]{3,4}[0-9]{6}[A-Z0-9]{3}$"
      description: "RFC con homoclave (12 o 13 caracteres)"
      example: "PEGJ800101ABC"

    FechaValor:
      type: string
      format: date
      description: |
        Fecha valor de la operación.
        Validada contra CalendarioDiasHabiles (S006/LOCSUP).
        Código CRONOS2K legacy → usar ISO 8601 en target.
      example: "2026-07-14"

    # ── Aggregates y Entidades ────────────────────────────────────────────────

    Titular:
      type: object
      required: ["nombre", "rfc"]
      properties:
        nombre:
          type: string
          maxLength: 100
        rfc:
          $ref: "#/components/schemas/RfcSchema"
      # [GEMCOG-SOURCE: S500/BD01CAPTACION · vocab: CAPTACION]

    SaldoCuenta:
      type: object
      description: |
        Saldo de cuenta de captación.
        COLISIÓN RESUELTA: SALDO S500 → SaldoCuenta ≠ SaldoContable (BC-05 GL).
        Ver ubiquitous-language-target.md §3.1.
      required: ["numeroCuenta", "saldoDisponible", "moneda", "fechaConsulta"]
      properties:
        numeroCuenta:
          $ref: "#/components/schemas/NumeroCuentaSchema"
        saldoDisponible:
          $ref: "#/components/schemas/ImporteMonetario"
          description: "Posición disponible para operaciones del cliente"
        saldoContableCaptacion:
          $ref: "#/components/schemas/ImporteMonetario"
          description: "Saldo contable de captación (antes de posteo GL)"
        moneda:
          type: string
          enum: ["MXN", "USD"]
          default: "MXN"
        fechaConsulta:
          type: string
          format: date
        esDiaHabil:
          type: boolean
          description: "Si la fecha de consulta es día hábil bancario (LOCSUP/S006)"
      # [GEMCOG-SOURCE: S500/P010 · BC-01 · vocab: SALDO (S500)]

    CuentaCaptacion:
      type: object
      description: "Cuenta de captación bancaria — aggregate root de BC-01"
      required: ["numeroCuenta", "tipoCuenta", "estado", "titular", "moneda", "fechaApertura"]
      properties:
        numeroCuenta:
          $ref: "#/components/schemas/NumeroCuentaSchema"
        tipoCuenta:
          $ref: "#/components/schemas/TipoCuenta"
        estado:
          $ref: "#/components/schemas/EstadoCuentaEnum"
        titular:
          $ref: "#/components/schemas/Titular"
        moneda:
          type: string
          enum: ["MXN", "USD"]
          default: "MXN"
        sucursal:
          type: string
          maxLength: 4
        productoId:
          type: string
          description: "Identificador del producto (001=cheques, 066=maestra, etc.)"
        fechaApertura:
          type: string
          format: date
        saldo:
          $ref: "#/components/schemas/SaldoCuenta"
        atributos:
          $ref: "#/components/schemas/AtributoCuenta"
      # [GEMCOG-SOURCE: S500/BD01CAPTACION · BC-01 · vocab: CAPTACION, SALDO]
      # [REGLAS: BR-001, BR-002] [FLAGS: CNBV]

    AtributoCuenta:
      type: object
      description: "Atributos de calificación especiales de la cuenta de captación"
      properties:
        calificaciones:
          type: array
          items:
            type: string
        flagsEspeciales:
          type: array
          items:
            type: string
        metadatos:
          type: object
          additionalProperties:
            type: string
      # [GEMCOG-SOURCE: S500/BD07ATRIBUCTAS · vocab: ATRIBUCTA]

    VinculoCuenta:
      type: object
      description: "Vínculo lógico entre cuentas de captación (relación padre-hijo)"
      required: ["cuentaOrigen", "cuentaDestino", "tipoVinculo"]
      properties:
        cuentaOrigen:
          $ref: "#/components/schemas/NumeroCuentaSchema"
        cuentaDestino:
          $ref: "#/components/schemas/NumeroCuentaSchema"
        tipoVinculo:
          type: string
          enum: ["MAESTRA_SUBCUENTA", "INVERSION", "AHORRO_PROGRAMADO"]
      # [GEMCOG-SOURCE: S500/L040 LIGAS · BC-01 · vocab: LIGAS]

    VinculosCuenta:
      type: object
      properties:
        numeroCuenta:
          $ref: "#/components/schemas/NumeroCuentaSchema"
        vinculos:
          type: array
          items:
            $ref: "#/components/schemas/VinculoCuenta"

    # ── Requests ──────────────────────────────────────────────────────────────

    AperturaCuentaRequest:
      type: object
      required: ["tipoCuenta", "numeroCuenta", "titular", "moneda", "sucursal"]
      properties:
        tipoCuenta:
          $ref: "#/components/schemas/TipoCuenta"
        numeroCuenta:
          $ref: "#/components/schemas/NumeroCuentaSchema"
        titular:
          $ref: "#/components/schemas/Titular"
        moneda:
          type: string
          enum: ["MXN", "USD"]
          default: "MXN"
        sucursal:
          type: string
          maxLength: 4
        productoId:
          type: string
      # [GEMCOG-SOURCE: S500/P010 · journey: apertura-cuenta · REGLAS: BR-001]

    OperacionCaptacionRequest:
      type: object
      required: ["importe", "moneda", "referencia", "canal", "fechaValor"]
      properties:
        importe:
          $ref: "#/components/schemas/ImporteMonetario"
        moneda:
          type: string
          enum: ["MXN", "USD"]
          default: "MXN"
        referencia:
          type: string
          maxLength: 40
          description: "Referencia de la operación (idempotency key)"
        canal:
          $ref: "#/components/schemas/Canal"
        sucursal:
          type: string
          maxLength: 4
        fechaValor:
          $ref: "#/components/schemas/FechaValor"
      # [GEMCOG-SOURCE: S500/P010 · vocab: SALDO, CAPTACION]

    TransferenciaRequest:
      type: object
      required: ["cuentaOrigen", "cuentaDestino", "importe", "moneda", "referencia", "fechaValor"]
      properties:
        cuentaOrigen:
          $ref: "#/components/schemas/NumeroCuentaSchema"
        cuentaDestino:
          $ref: "#/components/schemas/NumeroCuentaSchema"
        importe:
          $ref: "#/components/schemas/ImporteMonetario"
        moneda:
          type: string
          enum: ["MXN", "USD"]
          default: "MXN"
        referencia:
          type: string
          maxLength: 40
        canal:
          $ref: "#/components/schemas/Canal"
        fechaValor:
          $ref: "#/components/schemas/FechaValor"
        conceptoSistemaExterno:
          type: string
          maxLength: 40
          description: "Referencia al sistema externo S080 (tarifas/UDIS) si aplica"
      # [GEMCOG-SOURCE: S500/P080 · vocab: CAPTACION, SALDO · FLAGS: CNBV, BANXICO]

    DispersionFondosRequest:
      type: object
      description: "Solicitud de dispersión masiva de fondos"
      required: ["cuentaOrigen", "beneficiarios", "referencia", "fechaValor"]
      properties:
        cuentaOrigen:
          $ref: "#/components/schemas/NumeroCuentaSchema"
        beneficiarios:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: "#/components/schemas/BeneficiarioDispersion"
        referencia:
          type: string
          maxLength: 40
        fechaValor:
          $ref: "#/components/schemas/FechaValor"
      # [GEMCOG-SOURCE: S500/P015 · vocab: DISPERSION]

    BeneficiarioDispersion:
      type: object
      required: ["numeroCuenta", "importe"]
      properties:
        numeroCuenta:
          $ref: "#/components/schemas/NumeroCuentaSchema"
        importe:
          $ref: "#/components/schemas/ImporteMonetario"
        referencia:
          type: string
          maxLength: 40

    TriggerBatchRequest:
      type: object
      required: ["fechaProceso"]
      properties:
        fechaProceso:
          type: string
          format: date
          description: "Fecha del proceso de cierre batch"
        forzado:
          type: boolean
          default: false
          description: "Si true, usa ReprocesoForzadoCaptacion (FORZA flag S500)"

    ReprocesoForzadoRequest:
      type: object
      required: ["fechaProceso", "motivoReproceso"]
      properties:
        fechaProceso:
          type: string
          format: date
        motivoReproceso:
          type: string
          minLength: 20
          description: "Justificación obligatoria para bitácora de auditoría CNBV"
        idAutorizacion:
          type: string
          description: "Número de autorización del área de operaciones"
      # [GEMCOG-SOURCE: S500/FORZA flag · vocab: FORZA (colisión resuelta §3.5)]

    # ── Responses ─────────────────────────────────────────────────────────────

    ResultadoOperacion:
      type: object
      required: ["idOperacion", "numeroCuenta", "estado", "timestamp"]
      properties:
        idOperacion:
          type: string
          format: uuid
        numeroCuenta:
          $ref: "#/components/schemas/NumeroCuentaSchema"
        estado:
          type: string
          enum: ["EXITOSO", "PENDIENTE", "RECHAZADO"]
        saldoResultante:
          $ref: "#/components/schemas/SaldoCuenta"
        timestamp:
          type: string
          format: date-time
        referencia:
          type: string

    DispersionFondosAceptada:
      type: object
      required: ["idDispersion", "estado", "totalBeneficiarios", "importeTotal"]
      properties:
        idDispersion:
          type: string
          format: uuid
        estado:
          type: string
          enum: ["ACEPTADA", "EN_PROCESO"]
        totalBeneficiarios:
          type: integer
        importeTotal:
          $ref: "#/components/schemas/ImporteMonetario"
        urlSeguimiento:
          type: string
          description: "URL para consultar el resultado: GET /dispersiones/{idDispersion}"

    ResultadoDispersion:
      type: object
      required: ["idDispersion", "estado", "totalBeneficiarios", "procesados", "rechazados"]
      properties:
        idDispersion:
          type: string
          format: uuid
        estado:
          type: string
          enum: ["EN_PROCESO", "COMPLETADA", "COMPLETADA_CON_ERRORES", "FALLIDA"]
        totalBeneficiarios:
          type: integer
        procesados:
          type: integer
        rechazados:
          type: integer
        importeTotal:
          $ref: "#/components/schemas/ImporteMonetario"
        importeDisperso:
          $ref: "#/components/schemas/ImporteMonetario"
        detalles:
          type: array
          items:
            $ref: "#/components/schemas/DetalleDispersion"
      # [GEMCOG-SOURCE: S500/P165 RESULTADO-DISPERSION 5.6K LOC]

    DetalleDispersion:
      type: object
      properties:
        numeroCuenta:
          $ref: "#/components/schemas/NumeroCuentaSchema"
        importe:
          $ref: "#/components/schemas/ImporteMonetario"
        estado:
          type: string
          enum: ["EXITOSO", "RECHAZADO"]
        codigoRechazo:
          type: string

    EstadoCuenta:
      type: object
      description: "Estado de cuenta del cliente de captación"
      required: ["numeroCuenta", "titular", "saldo", "movimientos", "fechaInicio", "fechaFin"]
      properties:
        numeroCuenta:
          $ref: "#/components/schemas/NumeroCuentaSchema"
        titular:
          $ref: "#/components/schemas/Titular"
        saldo:
          $ref: "#/components/schemas/SaldoCuenta"
        movimientos:
          type: array
          items:
            $ref: "#/components/schemas/MovimientoCaptacion"
        fechaInicio:
          type: string
          format: date
        fechaFin:
          type: string
          format: date
        totalMovimientos:
          type: integer
      # [GEMCOG-SOURCE: S500/P400 PID=P335-EDOCTA · vocab: EDOCTA]
      # ANO-002: filename P400/P335 cruzado en source — verificar en transpilación

    MovimientoCaptacion:
      type: object
      required: ["idMovimiento", "tipo", "importe", "fecha", "saldoTras"]
      properties:
        idMovimiento:
          type: string
          format: uuid
        tipo:
          type: string
          enum: ["DEPOSITO", "RETIRO", "TRANSFERENCIA_ENTRADA", "TRANSFERENCIA_SALIDA", "DISPERSION", "CARGO_AUTOMATICO"]
        importe:
          $ref: "#/components/schemas/ImporteMonetario"
        fecha:
          type: string
          format: date
        saldoTras:
          $ref: "#/components/schemas/ImporteMonetario"
          description: "Saldo después del movimiento"
        referencia:
          type: string
        canal:
          $ref: "#/components/schemas/Canal"
        descripcion:
          type: string

    ControlBatchCaptacion:
      type: object
      description: |
        Estado del proceso batch de captación.
        COLISIÓN RESUELTA: CONTROL S500 → ControlBatchCaptacion (UL §3.2)
        COLISIÓN RESUELTA: LOTE S500 → CierreBatchCaptacion (UL §3.4)
      required: ["fechaProceso", "estado", "ultimaActualizacion"]
      properties:
        fechaProceso:
          type: string
          format: date
        estado:
          $ref: "#/components/schemas/EstadoBatch"
        paso:
          type: string
          description: "Paso actual del WFL LOTE (P130, P142, P144, etc.)"
        ultimaActualizacion:
          type: string
          format: date-time
        errorDetalle:
          type: string
        estadisticas:
          type: object
          properties:
            cuentasProcesadas:
              type: integer
            importeTotal:
              $ref: "#/components/schemas/ImporteMonetario"
      # [GEMCOG-SOURCE: S500/WFL_LOTE · BD02AUXILIAR · vocab: CONTROL, LOTE (colisión §3.2, §3.4)]

    ConsultaDiaHabil:
      type: object
      required: ["fecha", "esDiaHabil"]
      properties:
        fecha:
          type: string
          format: date
        esDiaHabil:
          type: boolean
        siguienteDiaHabil:
          type: string
          format: date
          description: "Próximo día hábil si la fecha consultada no lo es"
      # [GEMCOG-SOURCE: S006/LOCSUP · vocab: LOCSUP]

    PaginaCuentas:
      type: object
      properties:
        contenido:
          type: array
          items:
            $ref: "#/components/schemas/CuentaCaptacion"
        paginaActual:
          type: integer
        totalPaginas:
          type: integer
        totalElementos:
          type: integer

    ErrorResponse:
      type: object
      required: ["codigo", "mensaje", "timestamp"]
      properties:
        codigo:
          type: string
          description: "Código de error del dominio (ej. CAP-001, CAP-002)"
        mensaje:
          type: string
        detalle:
          type: string
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
          description: "OpenTelemetry trace ID para correlación de logs"
